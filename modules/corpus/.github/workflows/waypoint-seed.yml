name: Waypoint Seed

# Regenerates data/waypoint/waypoint-seed.json reproducibly, proves it matches the committed
# copy (determinism guard), validates the payload, and publishes it as a versioned build artifact
# the umbrella deploy + Waypoint can consume non-interactively.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "data/waypoint/invoice-decisions.json"
      - "data/suppliers/suppliers.json"
      - "data/contracts/**"
      - "data/policies/**"
      - "data/scenarios/**"
      - "src/ledgerfield/waypoint_seed.py"
      - "src/ledgerfield/cli.py"
      - ".github/workflows/waypoint-seed.yml"
  pull_request:
    paths:
      - "data/waypoint/invoice-decisions.json"
      - "data/suppliers/suppliers.json"
      - "data/contracts/**"
      - "data/policies/**"
      - "data/scenarios/**"
      - "src/ledgerfield/waypoint_seed.py"
      - "src/ledgerfield/cli.py"
      - ".github/workflows/waypoint-seed.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      source_repository:
        description: Repository containing the corpus source. Required for cross-repository callers.
        required: true
        type: string
      source_ref:
        description: Git ref of the corpus repository to check out. Required for cross-repository callers.
        required: true
        type: string
    secrets:
      REPO_TOKEN:
        description: Token with contents:read on this repo so a cross-repo caller (keystone umbrella) can check out ledgerfield's own source. Falls back to GITHUB_TOKEN for standalone runs.
        required: false
    outputs:
      artifact-name:
        description: Name of the uploaded Waypoint seed artifact.
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync dependencies
        run: uv sync

      - name: Compile sources
        run: uv run python -m compileall -q src

      - name: Generate Waypoint seed
        run: uv run ledgerfield generate-waypoint-seed | tee counts.json

      - name: Validate seed JSON
        run: uv run python -m json.tool data/waypoint/waypoint-seed.json > /dev/null

      - name: Determinism / drift check
        run: |
          if ! git diff --exit-code -- data/waypoint/waypoint-seed.json; then
            echo "::error::Regenerated waypoint-seed.json differs from the committed copy."
            echo "::error::Run 'uv run ledgerfield generate-waypoint-seed' and commit the result."
            exit 1
          fi
          git diff --check

      - name: Compute artifact metadata
        id: meta
        run: |
          version=$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          short_sha=$(git rev-parse --short HEAD)
          echo "artifact-name=waypoint-seed-${version}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload Waypoint seed artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: |
            data/waypoint/waypoint-seed.json
            counts.json
          if-no-files-found: error

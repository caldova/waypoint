# Foundry Agent Optimizer config for the single contract-agent.
#
# `python -m castia optimize run` reads this to submit an optimizer job: it runs
# the baseline agent (.agent_configs/baseline — instructions.md + tools.json)
# against `dataset`, scores each response with `evaluators`, and proposes prompt
# + tool-description rewrites, keeping only candidates that beat the baseline on
# `validation_dataset`.
#
# Offline sanity first: `python -m castia eval check` validates this file and the
# dataset paths with no Azure call. `optimize run --dry-run` prints the assembled
# request without submitting.
name: contract-agent-optimize

agent:
  name: contract-agent
  # Baseline model; the optimizer rewrites the prompt/tools, not the model.
  model: gpt-5.5

# Built-in Foundry evaluator, offline-checkable, no rubric file. task_adherence
# scores whether the agent did the governed assurance task.
#
# We deliberately do NOT use builtin.tool_call_accuracy here. The optimizer's
# eval loop is response-scoped — the eval model reads the agent's response and
# each criterion and returns a score — whereas tool_call_accuracy is
# trajectory-scoped and needs tool_calls + tool_definitions, which the optimizer
# holds but never surfaces to the evaluator (it fails with "Tool definitions
# input is required but not provided"). Instead, each dataset row carries a
# task-level `grounded_in_evidence` criterion that recovers the same "decided
# from evidence, not from memory" signal in a form this loop supports.
# tool_call_accuracy still belongs in the standalone eval loop, where the
# trajectory is available. Swapping in the repo's custom
# contract_policy_evidence_grader as a registered Foundry evaluator is the
# follow-up once we run a real scored job.
evaluators:
  - builtin.task_adherence

# contract-agent-native optimizer dataset, derived from the corpus by
# datasets/build_assurance_optimize.py. The optimizer's dataset schema is
# {query, ground_truth} scalars — NOT the fleet-era eval splits' messages/dict
# shape, which target retired agents and fail the optimizer schema. Paths resolve
# relative to this file's folder.
dataset:
  local_uri: datasets/assurance-optimize-train.jsonl
validation_dataset:
  local_uri: datasets/assurance-optimize-validation.jsonl

options:
  eval_model: gpt-5.5
  optimization_model: gpt-5.5
  # Keep the first real job small and cheap; raise once the loop is proven.
  max_candidates: 4

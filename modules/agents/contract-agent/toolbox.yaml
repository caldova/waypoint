# contract-agent investigative toolbox.
#
# Live lane: FoundryIQ contract/policy knowledge base. The `contracts-kb-mcp`
# project connection points at the `contracts-kb` agentic-retrieval MCP endpoint
# and federates `knowledge_base_retrieve`, the demo's grounded lookup.
#
# Create/update:
#   azd ai connection create contracts-kb-mcp --kind remote-tool \
#     --target "<kb-mcp-endpoint>" --auth-type project-managed-identity \
#     --audience "https://search.azure.com" --project-endpoint "<project>"
#   azd ai toolbox create contract-toolbox --from-file ./toolbox.yaml \
#     --project-endpoint "<project>"
# On success azd writes TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT to the azd env;
# forward that to the hosted agent. Castia owns the MCP tool spec; the agent code
# only supplies the endpoint, allow-list, token, and local guidance.
description: contract-agent investigative toolbox -- FoundryIQ contract/policy knowledge base.
connections:
  - name: contracts-kb-mcp

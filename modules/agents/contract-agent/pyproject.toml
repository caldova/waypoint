[project]
name = "contract-agent"
version = "0.1.0"
description = "Waypoint — the single invoice-assurance hosted agent, built on castia."
requires-python = ">=3.11"
dependencies = [
    # castia owns the framework layer: hosting, the three wire protocols,
    # Adaptive Cards, telemetry, optimizer-config resolution, and the
    # eval/optimize/rft lifecycle. The [optimize] extra ships the runtime
    # resolver so configured_model() can load Agent Optimizer candidates.
    "castia[optimize]>=0.4.0",
    "python-dotenv>=1.0",
]

[tool.uv]
# Flat application, not a library: uv installs deps without building a local
# package. prerelease="allow" resolves castia's azure-ai-agentserver-* betas.
package = false
prerelease = "allow"
# Resolve only for the platforms this container actually runs on. Without this,
# uv's universal resolver also solves an emscripten/pyodide split where castia
# caps at 0.3.0, which would otherwise block the 0.4.0 upgrade.
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: market-evidence-expert
# Evidence expert: Responses only.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  # WebIQ binds Foundry's native web search (Azure "Grounding with Bing Search").
  # The Bing grounding resource + project connection are provisioned in infra/
  # (bicep) with the key auto-read via listKeys(), so there is NO key or URL to
  # inject here — the hosted tool resolves the project's bing_grounding connection
  # server-side. (Optional WEBIQ_SEARCH_CONTEXT_SIZE defaults to "high" in code.)

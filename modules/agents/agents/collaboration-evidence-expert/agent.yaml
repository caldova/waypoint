# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: collaboration-evidence-expert
# Evidence expert: Responses only.
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  # WorkIQ uses a Foundry toolbox backed by UserEntraToken RemoteTool
  # connections. The agent calls the toolbox with its Foundry token plus
  # request-context headers; Foundry obtains the current user's delegated token
  # for Microsoft 365 / WorkIQ.
  - name: WORKIQ_TOOLBOX_MCP_ENDPOINT
    value: ${WORKIQ_TOOLBOX_MCP_ENDPOINT}
  - name: WORKIQ_TOOLBOX_NAME
    value: ${WORKIQ_TOOLBOX_NAME}

# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: invoice-analyst
protocols:
  - protocol: responses
    version: 1.0.0
  - protocol: activity_protocol
    version: v1
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  # Optional override for the durable WaypointIQ toolbox. When unset, main.py
  # derives it from FOUNDRY_PROJECT_ENDPOINT as .../toolboxes/waypoint-iq/mcp.
  - name: WAYPOINT_IQ_TOOLBOX_MCP_ENDPOINT
    value: ${WAYPOINT_IQ_TOOLBOX_MCP_ENDPOINT}
  - name: FOUNDRYIQ_KB_TOOLBOX_MCP_ENDPOINT
    value: ${FOUNDRYIQ_KB_TOOLBOX_MCP_ENDPOINT}
  # Direct read-only Waypoint access for status questions on both Responses and
  # Microsoft 365 activity surfaces.
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_API_KEY
    value: ${WAYPOINT_READER_API_KEY}
  # Waypoint WEB app base URL (a waypoint deploy output: web_fqdn), distinct from
  # the API URL above. Builds invoice deep-links in the AI Teammate Adaptive Card
  # (…/invoices?invoice=<id>). Optional — rows still render without links when
  # unset. Seeded into the azd env by the deploy workflow (input > repo var).
  - name: WAYPOINT_APP_BASE_URL
    value: ${WAYPOINT_APP_BASE_URL}
  # Microsoft 365 AI Teammate / Agents SDK configuration. The blueprint values
  # are populated by `make publish invoice-analyst`.
  - name: AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__TYPE
    value: AgenticUserAuthorization
  - name: AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__SETTINGS__ALTERNATEBLUEPRINTCONNECTIONNAME
    value: AgentBluePrint
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE
    value: ClientSecret
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
    value: ${INVOICE_ANALYST_BLUEPRINT_CLIENT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET
    value: ${INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__FEDERATEDCLIENTID
    value: ${AGENT_BLUEPRINT_FEDERATED_CLIENT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID
    value: ${AZURE_TENANT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0
    value: ${AGENT_BLUEPRINT_SERVICE_SCOPE}
  - name: CONNECTIONSMAP__0__SERVICEURL
    value: '*'
  - name: CONNECTIONSMAP__0__CONNECTION
    value: SERVICE_CONNECTION

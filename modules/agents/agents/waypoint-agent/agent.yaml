# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: waypoint-agent
# One agent, all three castia wire protocols. castia pins each publishable
# protocol to contract version 2.0.0; `python -m castia deploy` reconciles the
# azure.yaml service protocol list from the decorators in main.py.
protocols:
  - protocol: responses
    version: 2.0.0
  - protocol: activity_protocol
    version: 2.0.0
  - protocol: invocations
    version: 2.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: FOUNDRY_PROJECT_ENDPOINT
    value: ${FOUNDRY_PROJECT_ENDPOINT}

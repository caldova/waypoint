# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: waypoint-recorder
# Internal writer agent: Responses only.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: TOOLBOX_MCP_ENDPOINT
    value: ${TOOLBOX_MCP_ENDPOINT}
  # Waypoint write boundary: the waypoint-recorder is the only agent that writes to the
  # governed Waypoint API. Its managed identity must hold the Waypoint writer app role.
  # NOTE: AGENT_NAME is NOT declared here — Foundry reserves all AGENT_*/FOUNDRY_* env
  # vars for platform use and rejects the deploy (400 invalid_payload) if set. The write
  # client (waypoint_write_client.py) defaults agent_name to "waypoint-recorder" when unset.
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_API_KEY
    value: ${WAYPOINT_WRITER_API_KEY}
  - name: APP_INSIGHTS_OPERATION_ID
    value: ${APP_INSIGHTS_OPERATION_ID}

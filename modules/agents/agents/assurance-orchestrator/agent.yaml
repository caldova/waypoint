# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: assurance-orchestrator
# Internal pipeline agent: Responses only.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: ASSURANCE_ORCHESTRATOR_EXPERT_INVOCATION_MODE
    value: ${ASSURANCE_ORCHESTRATOR_EXPERT_INVOCATION_MODE}
  - name: ASSURANCE_ORCHESTRATOR_EXPERT_PROJECT_ENDPOINT
    value: ${ASSURANCE_ORCHESTRATOR_EXPERT_PROJECT_ENDPOINT}
  - name: ASSURANCE_ORCHESTRATOR_EXPERT_MODEL
    value: ${ASSURANCE_ORCHESTRATOR_EXPERT_MODEL}
  - name: ASSURANCE_ORCHESTRATOR_WORKIQ_ENABLED
    value: ${ASSURANCE_ORCHESTRATOR_WORKIQ_ENABLED}
  - name: ASSURANCE_ORCHESTRATOR_WEBIQ_ENABLED
    value: ${ASSURANCE_ORCHESTRATOR_WEBIQ_ENABLED}
  - name: ASSURANCE_ORCHESTRATOR_FOUNDRYIQ_ENABLED
    value: ${ASSURANCE_ORCHESTRATOR_FOUNDRYIQ_ENABLED}
  - name: ASSURANCE_ORCHESTRATOR_FABRICIQ_ENABLED
    value: ${ASSURANCE_ORCHESTRATOR_FABRICIQ_ENABLED}
  - name: TOOLBOX_MCP_ENDPOINT
    value: ${TOOLBOX_MCP_ENDPOINT}
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_API_KEY
    value: ${WAYPOINT_WRITER_API_KEY}
  - name: CONTENT_UNDERSTANDING_ENDPOINT
    value: ${CONTENT_UNDERSTANDING_ENDPOINT}
  - name: CONTENT_UNDERSTANDING_API_VERSION
    value: ${CONTENT_UNDERSTANDING_API_VERSION}
  - name: CONTENT_UNDERSTANDING_ANALYZER_ID
    value: ${CONTENT_UNDERSTANDING_ANALYZER_ID}
  - name: CONTENT_UNDERSTANDING_SCOPE
    value: ${CONTENT_UNDERSTANDING_SCOPE}
  # Downstream hosted experts. The expert prompt agents are retired; the
  # orchestrator now fans out to the canonical hosted Responses endpoints.
  # These bind to the *_EXPERT_ENDPOINT azd env values that the deploy workflow
  # self-computes (<project_endpoint>/agents/<name>) in the assurance-orchestrator
  # leg right before `azd deploy` — the same order-independent pattern as
  # WAYPOINT_RECORDER_ENDPOINT below. Do NOT bind these to azd's per-service
  # AGENT_<NAME>_RESPONSES_ENDPOINT auto-outputs: in the parallel CI/keystone
  # deploy matrix each agent runs in an isolated leg, so the orchestrator leg
  # never sees the experts' auto-outputs and would deploy with empty endpoints.
  - name: WORKIQ_EXPERT_ENDPOINT
    value: ${WORKIQ_EXPERT_ENDPOINT}
  - name: WEBIQ_EXPERT_ENDPOINT
    value: ${WEBIQ_EXPERT_ENDPOINT}
  - name: FOUNDRYIQ_EXPERT_ENDPOINT
    value: ${FOUNDRYIQ_EXPERT_ENDPOINT}
  - name: FABRICIQ_EXPERT_ENDPOINT
    value: ${FABRICIQ_EXPERT_ENDPOINT}
  - name: WAYPOINT_RECORDER_ENDPOINT
    value: ${WAYPOINT_RECORDER_ENDPOINT}

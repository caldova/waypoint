# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: operations-data-expert
# Evidence expert: Responses only.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: TOOLBOX_MCP_ENDPOINT
    value: ${TOOLBOX_MCP_ENDPOINT}
  # Live FabricIQ grounding: the Waypoint Fabric data agent (WaypointDataAgent),
  # reached through the `waypoint-data-agent-connection` MicrosoftFabric project
  # connection. main.py resolves this connection name to its id and binds the
  # MicrosoftFabricPreviewTool directly (OBO identity passthrough).
  - name: FABRIC_DATA_AGENT_CONNECTION_NAME
    value: ${FABRIC_DATA_AGENT_CONNECTION_NAME}
  # Headless FabricIQ path: deterministic reads of the mirrored operational core
  # over the Fabric SQL analytics endpoint (TDS) with a project-MI AAD token.
  # Server host + database of the mirrored DB; schema defaults to `_public`
  # (Fabric prefixes the mirrored Postgres `public` schema with `_` on the SQL
  # analytics endpoint because `public` is a T-SQL reserved word).
  # gather_fabric_evidence only reads suppliers/invoices/invoice_lines/
  # reconciliation_findings and degrades gracefully when unset.
  - name: FABRIC_MIRRORED_SQL_ENDPOINT
    value: ${FABRIC_MIRRORED_SQL_ENDPOINT}
  - name: FABRIC_MIRRORED_DATABASE
    value: ${FABRIC_MIRRORED_DATABASE}
  - name: FABRIC_MIRRORED_SCHEMA
    value: ${FABRIC_MIRRORED_SCHEMA}
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_API_KEY
    value: ${WAYPOINT_READER_API_KEY}

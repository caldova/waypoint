# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: contract-policy-expert
# The launch package invokes this expert through the Responses endpoint only.
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: '0.5'
  memory: '1Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: TOOLBOX_MCP_ENDPOINT
    value: ${TOOLBOX_MCP_ENDPOINT}
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_API_KEY
    value: ${WAYPOINT_READER_API_KEY}
  # ---------------------------------------------------------------------
  # Microsoft 365 AI Teammate / Agents SDK configuration
  # ---------------------------------------------------------------------
  # See agents/rhodes/agent.yaml for the full annotated rationale. The
  # short version: the Python M365 Agents SDK reads ASP.NET-style env
  # vars and looks up the connection by the literal key SERVICE_CONNECTION
  # (with the underscore). The connection must be a Confidential Client
  # (AuthType=ClientSecret) so the agentic CCA token flow works; managed
  # identity returns the wrong client type. The federated client id is
  # the *project* MI (not the per-instance FMI) because the blueprint app
  # trusts the project MI via ProjectManagedIdentityFederatedIdentityCredential.
  #
  # The {AGENT}_BLUEPRINT_CLIENT_ID / _SECRET env vars are populated by
  # `make publish <agent>` (via scripts/publish_agent.py + ensure_foundry_application.py).
  # While they are empty, activity_protocol.py mount is a no-op so the
  # Responses path is unaffected.
  - name: AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__TYPE
    value: AgenticUserAuthorization
  - name: AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__AGENTIC__SETTINGS__ALTERNATEBLUEPRINTCONNECTIONNAME
    value: AgentBluePrint
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE
    value: ClientSecret
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
    value: ${FOUNDRYIQ_EXPERT_BLUEPRINT_CLIENT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET
    value: ${FOUNDRYIQ_EXPERT_BLUEPRINT_CLIENT_SECRET}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__FEDERATEDCLIENTID
    value: ${AGENT_BLUEPRINT_FEDERATED_CLIENT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID
    value: ${AZURE_TENANT_ID}
  - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPES__0
    value: ${AGENT_BLUEPRINT_SERVICE_SCOPE}
  - name: CONNECTIONSMAP__0__SERVICEURL
    value: '*'
  - name: CONNECTIONSMAP__0__CONNECTION
    value: SERVICE_CONNECTION

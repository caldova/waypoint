name: contract-policy-expert
services:
  contract-policy-expert:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: contract-policy-expert
    description: FoundryIQ-only Contract Policy Expert serving Responses and Teams activity.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
      - protocol: activity
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "true"
      TOOLBOX_NAME: contract-toolbox
      TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT: ${TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT}

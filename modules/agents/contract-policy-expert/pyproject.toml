[project]
name = "contract-policy-expert"
version = "0.1.0"
description = "FoundryIQ-only Contract Policy Expert for Caldova contract and policy Q&A."
requires-python = ">=3.11"
dependencies = [
    "castia[optimize,prompty]==0.9.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

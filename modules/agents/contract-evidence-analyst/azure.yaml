# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Standalone azd project for contract-evidence-analyst ONLY, so a deploy here never touches the root
# azure.yaml services (contract-policy-expert, contract-agent, ...). The Foundry project is pre-existing.
# Deploy one version per arm with scripts/deploy_version.ps1 (sets the per-version env, then `azd deploy`).
name: contract-evidence-analyst

services:
  contract-evidence-analyst:
    project: .
    host: azure.ai.agent
    language: python
    kind: hosted
    name: contract-evidence-analyst
    description: Evidence-only supplier invoice-line review (benchmark-v1). One model per version.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      # Must equal the resolved config's metadata.yaml model (agent_config refuses to start otherwise).
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      # Empty = .agent_configs/baseline; a candidate id = .agent_configs/<id>; OPTIMIZATION_LOCAL_DIR
      # swaps the config root (releases/<arm>).
      OPTIMIZATION_CANDIDATE_ID: ${OPTIMIZATION_CANDIDATE_ID:-}
      OPTIMIZATION_LOCAL_DIR: ${OPTIMIZATION_LOCAL_DIR:-}
      FOUNDRY_PROJECT_RESOURCE_ID: ${AZURE_AI_PROJECT_ID}
      AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "true"
      CEA_MODEL_ROUTE: account
      CEA_REASONING_EFFORT: ${CEA_REASONING_EFFORT:-}

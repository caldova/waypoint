[project]
name = "waypoint-agents"
version = "0.1.0"
description = "Shared local development environment for the Caldova contract agents."
requires-python = ">=3.11"
dependencies = [
    "castia[optimize,prompty] @ git+https://github.com/sethjuarez/castia.git@55d6a0559157a731ee51c98a6c25c8d8d3eae691#subdirectory=packages/python",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.ruff.lint.isort]
known-first-party = ["toolbox", "tools", "write_tools"]

# Contracts agent toolbox (separate from contract-toolbox, which the
# FoundryIQ-only contract-policy-expert keeps so its eval/RFT tool surface is
# stable).
#
# Lanes:
#   contracts-kb-mcp     FoundryIQ contract/policy KB. Called through the local
#                        foundry_iq_retrieve wrapper (toolbox.py), not projected.
#   contracts-webiq-mcp  WebIQ public web (key in the project connection).
#                        Called through web_iq_search/web_iq_browse (webiq.py).
# Add a lane: `azd ai toolbox connection add contracts-toolbox <connection>`,
# publish the new version, then either add a local `<source>_iq`-kind wrapper
# (IQ lanes, for span typing) or add its MCP tool names to
# CONTRACTS_TOOLBOX_TOOLS in agent/toolsets.py (non-IQ lanes). The agent uses
# the version-less endpoint, so publishing needs no redeploy; code changes do.
#
# Create:
#   azd ai toolbox create contracts-toolbox --from-file ./toolbox.yaml \
#     --project-endpoint "<project>"
# azd writes TOOLBOX_CONTRACTS_TOOLBOX_MCP_ENDPOINT to the azd env.
description: Contracts agent toolbox -- FoundryIQ contract/policy KB; WorkIQ, WebIQ, and FabricIQ lanes attach here.
connections:
  - name: contracts-kb-mcp
  - name: contracts-webiq-mcp

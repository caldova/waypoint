[project]
name = "contract-policy-analyst"
version = "0.1.0"
description = "Independent tool-enabled contract policy quality and MAI-2 pipeline."
requires-python = ">=3.11"
dependencies = [
    "castia[optimize]==0.15.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false
prerelease = "allow"
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.pytest.ini_options]
pythonpath = ["."]

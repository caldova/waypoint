name: Contracts KB seed

# Idempotently ensures the Forge Foundry IQ knowledge base is code-managed:
#   - knowledge source `contracts-ks` (Azure Blob)
#   - knowledge base   `contracts-kb`
#   - Foundry RemoteTool MCP connection `kb-mcp-connection`
#   - an immediate run of the auto-generated indexer `contracts-ks-indexer`
#
# This REPLACES the previous manual/portal creation. It is intentionally opt-in
# (never runs on every deploy) because it mutates shared Search data-plane state
# and depends on the contract corpus already being present in the storage
# container. Blob UPLOAD is owned by Ledgerfield's `contracts-kb-upload` workflow
# / `ledgerfield upload-contracts-kb` CLI; this workflow ensures the KB objects
# over that corpus and can trigger a reindex.
#
# Runnable standalone (workflow_dispatch) from Forge, or called by the Keystone
# umbrella (workflow_call) after Ledgerfield has uploaded the corpus.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref of THIS (forge) repo to check out."
        required: false
        type: string
      skip_upload:
        description: "Ensure KB/KS/MCP over the corpus already uploaded by Ledgerfield (recommended). Uncheck only for a self-contained Forge upload from a sibling Ledgerfield checkout."
        required: false
        type: boolean
        default: true
      run_indexer:
        description: "Trigger an immediate run of contracts-ks-indexer after ensuring the knowledge source."
        required: false
        type: boolean
        default: true
      ledgerfield_ref:
        description: "Optional Ledgerfield git ref to check out and upload from (only used when skip_upload is false)."
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: "Git ref of THIS (forge) repo to check out. Keystone passes its forge_ref."
        required: false
        type: string
      skip_upload:
        description: "Ensure KB/KS/MCP over an already-uploaded corpus (recommended for the Keystone path)."
        required: false
        type: boolean
        default: true
      run_indexer:
        description: "Trigger an immediate run of contracts-ks-indexer."
        required: false
        type: boolean
        default: true
      ledgerfield_ref:
        description: "Optional Ledgerfield git ref (only used when skip_upload is false)."
        required: false
        type: string
    secrets:
      REPO_TOKEN:
        description: "Token with contents:read on forge (and ledgerfield, when skip_upload is false)."
        required: false
    outputs:
      contracts_kb_storage_account:
        description: "Storage account backing the contracts-ks blob knowledge source."
        value: ${{ jobs.seed.outputs.contracts_kb_storage_account }}
      contracts_kb_container:
        description: "Blob container the knowledge source indexes (folder path is 'contracts')."
        value: ${{ jobs.seed.outputs.contracts_kb_container }}
      contracts_kb_search_endpoint:
        description: "Azure AI Search endpoint hosting contracts-kb / contracts-ks."
        value: ${{ jobs.seed.outputs.contracts_kb_search_endpoint }}
      contracts_kb_indexer:
        description: "Deterministic indexer name (<ks>-indexer, e.g. contracts-ks-indexer). Ledgerfield POSTs /indexers('<name>')/run to reindex after a sync."
        value: ${{ jobs.seed.outputs.contracts_kb_indexer }}

concurrency:
  group: contracts-kb-seed
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for federated `az login`
  contents: read

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZD_ENV_NAME: ${{ vars.AZD_ENV_NAME || 'forge' }}
  AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5-mini' }}
  AZURE_AI_SEARCH_KB_CHAT_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_SEARCH_KB_CHAT_DEPLOYMENT_NAME || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5-mini' }}
  AZURE_AI_SEARCH_KB_CHAT_MODEL_NAME: ${{ vars.AZURE_AI_SEARCH_KB_CHAT_MODEL_NAME || vars.MODEL_NAME || vars.AZURE_AI_SEARCH_KB_CHAT_DEPLOYMENT_NAME || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5-mini' }}
  AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_EMBEDDING_DEPLOYMENT_NAME || 'text-embedding-3-large' }}

jobs:
  seed:
    name: Seed contracts-kb
    runs-on: ubuntu-latest
    outputs:
      contracts_kb_storage_account: ${{ steps.coords.outputs.storage_account }}
      contracts_kb_container: ${{ steps.coords.outputs.container }}
      contracts_kb_search_endpoint: ${{ steps.coords.outputs.search_endpoint }}
      contracts_kb_indexer: ${{ steps.coords.outputs.indexer }}
    steps:
      - name: Checkout forge
        uses: actions/checkout@v6
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Checkout ledgerfield (upload mode only)
        if: ${{ inputs.skip_upload == false }}
        uses: actions/checkout@v6
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.ledgerfield_ref || 'main' }}
          token: ${{ secrets.REPO_TOKEN || github.token }}
          path: .ledgerfield

      - name: Validate required variables
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "v=\$$var"
            [ -z "$v" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo variables: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Select azd environment
        run: azd env select "$AZD_ENV_NAME" || azd env refresh -e "$AZD_ENV_NAME" --no-prompt

      - name: Resolve contracts-kb coordinates
        id: coords
        run: |
          set -euo pipefail
          get() { azd env get-value "$1" 2>/dev/null | grep -v 'not found' || true; }

          RG="$(get AZURE_RESOURCE_GROUP)"; [ -n "$RG" ] || RG="rg-${AZD_ENV_NAME}"

          STORAGE="$(get AZURE_STORAGE_ACCOUNT_NAME)"
          [ -n "$STORAGE" ] || STORAGE="$(az resource list -g "$RG" --query "[?type=='Microsoft.Storage/storageAccounts'].name | [0]" -o tsv 2>/dev/null || true)"

          CONTAINER="$(get AZURE_AI_SEARCH_CONTAINER_NAME)"; [ -n "$CONTAINER" ] || CONTAINER="knowledge"

          ENDPOINT="$(get AZURE_AI_SEARCH_SERVICE_ENDPOINT)"
          if [ -z "$ENDPOINT" ]; then
            SVC="$(get AZURE_AI_SEARCH_SERVICE_NAME)"
            [ -n "$SVC" ] || SVC="$(az resource list -g "$RG" --query "[?type=='Microsoft.Search/searchServices'].name | [0]" -o tsv 2>/dev/null || true)"
            [ -n "$SVC" ] && ENDPOINT="https://${SVC}.search.windows.net"
          fi

          # Indexer name is deterministic (<ks>-indexer). Prefer the azd output;
          # otherwise derive it from the knowledge-source name (default contracts-ks).
          INDEXER="$(get AZURE_AI_SEARCH_INDEXER_NAME)"
          if [ -z "$INDEXER" ]; then
            KS="$(get AZURE_AI_SEARCH_KNOWLEDGE_SOURCE_NAME)"; [ -n "$KS" ] || KS="contracts-ks"
            INDEXER="${KS}-indexer"
          fi

          echo "storage_account=$STORAGE"   >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER"        >> "$GITHUB_OUTPUT"
          echo "search_endpoint=$ENDPOINT"   >> "$GITHUB_OUTPUT"
          echo "indexer=$INDEXER"            >> "$GITHUB_OUTPUT"
          echo "Resolved: storage=$STORAGE container=$CONTAINER endpoint=$ENDPOINT indexer=$INDEXER"

      - name: Seed contracts knowledge base
        env:
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          RUN_INDEXER: ${{ inputs.run_indexer }}
        run: |
          set -euo pipefail

          # Bubble the provision outputs into the environment. The initializer reads
          # these (and falls back to `az resource list` for anything missing).
          get() { azd env get-value "$1" 2>/dev/null | grep -v 'not found' || true; }

          export AZURE_SUBSCRIPTION_ID="${{ vars.AZURE_SUBSCRIPTION_ID }}"
          export AZURE_RESOURCE_GROUP="$(get AZURE_RESOURCE_GROUP)"
          [ -z "$AZURE_RESOURCE_GROUP" ] && export AZURE_RESOURCE_GROUP="rg-${AZD_ENV_NAME}"
          export AZURE_STORAGE_ACCOUNT_NAME="${{ steps.coords.outputs.storage_account }}"
          export AZURE_STORAGE_CONTAINER_NAME="${{ steps.coords.outputs.container }}"
          export AZURE_AI_SEARCH_SERVICE_NAME="$(get AZURE_AI_SEARCH_SERVICE_NAME)"
          export AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME="$(get AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME)"
          export AZURE_AI_SEARCH_KNOWLEDGE_SOURCE_NAME="$(get AZURE_AI_SEARCH_KNOWLEDGE_SOURCE_NAME)"
          export AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME="$(get AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME)"
          export AZURE_AI_MODEL_DEPLOYMENT_NAME="${AZURE_AI_MODEL_DEPLOYMENT_NAME}"
          export AZURE_AI_SEARCH_KB_CHAT_DEPLOYMENT_NAME="${AZURE_AI_SEARCH_KB_CHAT_DEPLOYMENT_NAME}"
          export AZURE_AI_SEARCH_KB_CHAT_MODEL_NAME="${AZURE_AI_SEARCH_KB_CHAT_MODEL_NAME}"
          export AZURE_AI_EMBEDDING_DEPLOYMENT_NAME="${AZURE_AI_EMBEDDING_DEPLOYMENT_NAME}"

          ARGS=()
          if [ "$SKIP_UPLOAD" = "true" ]; then
            ARGS+=(--skip-upload)
          else
            ARGS+=(--ledgerfield-root ".ledgerfield")
          fi
          if [ "$RUN_INDEXER" = "true" ]; then
            ARGS+=(--run-indexer)
          fi

          echo "Seeding contracts-kb (skip_upload=$SKIP_UPLOAD run_indexer=$RUN_INDEXER)"
          python scripts/initialize_contracts_kb.py "${ARGS[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Contracts KB seed"
            echo ""
            echo "- Env: \`$AZD_ENV_NAME\`"
            echo "- skip_upload: \`${{ inputs.skip_upload }}\`  |  run_indexer: \`${{ inputs.run_indexer }}\`"
            echo "- Knowledge base: \`contracts-kb\`  |  source: \`contracts-ks\`"
            echo ""
            echo "### Outputs (for the Keystone → Ledgerfield uploader)"
            echo "- \`contracts_kb_storage_account\`: \`${{ steps.coords.outputs.storage_account }}\`"
            echo "- \`contracts_kb_container\`: \`${{ steps.coords.outputs.container }}\`"
            echo "- \`contracts_kb_search_endpoint\`: \`${{ steps.coords.outputs.search_endpoint }}\`"
            echo "- \`contracts_kb_indexer\`: \`${{ steps.coords.outputs.indexer }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

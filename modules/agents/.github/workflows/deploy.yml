name: Deploy Hosted Agents


on:
  push:
    branches: [main]
    paths:
      - "agents/**"
      - "infra/**"
      - "azure.yaml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "agents/**"
      - "infra/**"
      - "azure.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      agent:
        description: "Specific agent to deploy, OR 'all' to redeploy every agent. Leave empty to auto-detect changes since main (same behavior as a PR)."
        type: string
        default: ""
      provision:
        description: "Run `azd provision` before deploy (only needed when infra changes)"
        type: boolean
        default: false
      skip_provision:
        description: "Skip the provision job entirely (use when shared infra is known-good and you just want to redeploy agents)"
        type: boolean
        default: false
      smoke_test:
        description: "Invoke each agent after deploy to verify"
        type: boolean
        default: true
      publish:
        description: "Provision Bot Service + Teams channel for each agent (requires agents/<name>/publish.yaml)"
        type: boolean
        default: false
      prune_unmanaged_agents:
        description: "Delete Foundry agents that this repo no longer declares (drift cleanup). When false, drift is only reported (dry-run)."
        type: boolean
        default: false

  # Reusable entry point for the keystone umbrella (one-click cross-repo deploy).
  # Same implementation as the standalone dispatch/push paths — just a second door.
  # When called, github.event_name reflects the CALLER's trigger (workflow_dispatch
  # from keystone), so the provision-step gate `event==workflow_dispatch && inputs.provision`
  # fires off THIS workflow_call's `provision` input (default true → infra stood up).
  workflow_call:
    inputs:
      source_ref:
        description: "Git ref of THIS (forge) repo to check out. The keystone umbrella passes its forge_ref; defaults to the triggering ref for standalone runs."
        type: string
        default: ""
      agent:
        description: "Specific agent to deploy, OR 'all' to deploy every agent."
        type: string
        default: "all"
      provision:
        description: "Run `azd provision` before deploy (stand up / update shared infra)."
        type: boolean
        default: true
      smoke_test:
        description: "Invoke each agent after deploy to verify."
        type: boolean
        default: false
      waypoint_api_base_url:
        description: "Waypoint API base URL (a waypoint deploy output). Seeded into the forge azd env before deploy so agent.yaml ${WAYPOINT_API_BASE_URL} resolves for the agents that write to / read from Waypoint. Pass needs.waypoint-deploy.outputs.api_fqdn from the umbrella (waypoint-deploy must run BEFORE this call)."
        type: string
        default: ""
      waypoint_api_scope:
        description: "Waypoint API OAuth scope (a waypoint deploy output, e.g. api://<api-app-id>/.default). Seeded into the forge azd env so agent.yaml ${WAYPOINT_API_SCOPE} resolves for the bearer/MI fallback path. Pass needs.waypoint-deploy.outputs.api_default_scope. Only used when x-api-keys are absent; harmless to always pass."
        type: string
        default: ""
      waypoint_app_base_url:
        description: "Waypoint WEB app base URL (a waypoint deploy output: web_fqdn), distinct from the API URL. Seeded into the forge azd env before deploy so agent.yaml ${WAYPOINT_APP_BASE_URL} resolves — used by the invoice-analyst Adaptive Card to build invoice deep-links (…/invoices?invoice=<id>). The keystone umbrella passes preflight.recorded_web_fqdn (forge-deploy runs before waypoint-deploy, and the web Container App FQDN is stable across deploys). Standalone forge runs fall back to the WAYPOINT_APP_BASE_URL repo var. Empty is fine — rows just render without links."
        type: string
        default: ""
      key_vault_name:
        description: "Key Vault holding the scoped Waypoint x-api-keys (secrets waypoint-writer-key / waypoint-reader-key). When set, the deploy job reads them from KV and seeds the forge azd env — used by the keystone umbrella because GitHub Actions cannot pass runtime-generated secrets through job outputs. Empty for standalone runs (falls back to the WAYPOINT_*_API_KEY secrets)."
        type: string
        default: ""
      prune_unmanaged_agents:
        description: "Delete Foundry agents this repo no longer declares (drift cleanup) after deploy. When false (default), drift is only reported. The keystone umbrella can pass true to keep the project clean on one-click deploys."
        type: boolean
        default: false
    secrets:
      REPO_TOKEN:
        description: "Token with contents:read on this repo so a cross-repo caller (keystone umbrella) can check out forge's own source. Falls back to GITHUB_TOKEN for standalone runs."
        required: false
      GH_MCP_PAT:
        description: "PAT for the GitHub MCP toolbox connection (optional; toolbox step is best-effort)."
        required: false
      WAYPOINT_WRITER_API_KEY:
        description: "x-api-key the waypoint-recorder presents on Waypoint writes. Seeded into the forge azd env before deploy so agent.yaml ${WAYPOINT_WRITER_API_KEY} resolves."
        required: false
      WAYPOINT_READER_API_KEY:
        description: "x-api-key the read-only agents present on Waypoint reads (agent.yaml ${WAYPOINT_READER_API_KEY})."
        required: false
    outputs:
      project_endpoint:
        description: "Foundry project endpoint. Each hosted agent is addressed as <project_endpoint>/agents/<agent-name> (its Responses surface at <...>/agents/<name>/responses)."
        value: ${{ jobs.deploy.outputs.project_endpoint }}
      # contracts-kb coordinates — the keystone umbrella reads these from THIS
      # (forge provision) touchpoint and passes them to the Ledgerfield
      # `contracts-kb-upload` workflow (idempotent self-cleaning blob sync +
      # immediate reindex). Resolved from the live azd/ARM deployment outputs
      # (never hardcoded). The indexer name is deterministic (<ks>-indexer) and
      # exposed so keystone/Ledgerfield don't hardcode it either.
      contracts_kb_storage_account:
        description: "Storage account backing the contracts-kb knowledge source (azd output AZURE_STORAGE_ACCOUNT_NAME, e.g. stwi2egf4sh4hfq)."
        value: ${{ jobs.deploy.outputs.contracts_kb_storage_account }}
      contracts_kb_container:
        description: "Blob container the contracts knowledge source indexes (azd output AZURE_AI_SEARCH_CONTAINER_NAME, e.g. knowledge). KS folderPath 'contracts' → blobs at <container>/contracts/*.md."
        value: ${{ jobs.deploy.outputs.contracts_kb_container }}
      contracts_kb_search_endpoint:
        description: "Azure AI Search endpoint hosting the contracts-ks indexer (azd output AZURE_AI_SEARCH_SERVICE_ENDPOINT, e.g. https://search-wi2egf4sh4hfq.search.windows.net). Pass to Ledgerfield's --search-endpoint to trigger immediate reindex."
        value: ${{ jobs.deploy.outputs.contracts_kb_search_endpoint }}
      contracts_kb_indexer:
        description: "Deterministic indexer name (<ks>-indexer, e.g. contracts-ks-indexer; azd output AZURE_AI_SEARCH_INDEXER_NAME). Ledgerfield's uploader POSTs /indexers('<name>')/run to reindex after a sync."
        value: ${{ jobs.deploy.outputs.contracts_kb_indexer }}

# NOTE: M365 / Teams listing is intentionally NOT a CI input. The Foundry
# publish API requires a user-delegated token and rejects app-only SP tokens.
# Run `make publish <agent>` from a developer laptop instead. Post-deploy
# evals are owned by .github/workflows/evals.yml (scheduled + manual).


concurrency:
  group: deploy-hosted-agents
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for federated `az login`
  contents: read

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZD_ENV_NAME: ${{ vars.AZD_ENV_NAME || 'forge' }}
  AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.5' }}
  # Catalog name + version of the chat model to deploy. Default to the same value
  # as AZURE_AI_MODEL_DEPLOYMENT_NAME so partial overrides (e.g. only setting
  # vars.AZURE_AI_MODEL_DEPLOYMENT_NAME) keep the deployment alias and the
  # underlying model in sync. Override independently via repo vars when the
  # deployment alias should differ from the catalog name (rare).
  MODEL_NAME: ${{ vars.MODEL_NAME || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.5' }}
  MODEL_VERSION: ${{ vars.MODEL_VERSION || '2026-04-24' }}
  MODEL_SKU_NAME: ${{ vars.MODEL_SKU_NAME || 'GlobalStandard' }}
  MODEL_CAPACITY: ${{ vars.MODEL_CAPACITY || '200' }}
  AZURE_AI_EMBEDDING_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_EMBEDDING_DEPLOYMENT_NAME || 'text-embedding-3-large' }}
  EMBEDDING_MODEL_NAME: ${{ vars.EMBEDDING_MODEL_NAME || 'text-embedding-3-large' }}
  EMBEDDING_MODEL_VERSION: ${{ vars.EMBEDDING_MODEL_VERSION || '1' }}
  EMBEDDING_MODEL_SKU_NAME: ${{ vars.EMBEDDING_MODEL_SKU_NAME || 'Standard' }}
  EMBEDDING_MODEL_CAPACITY: ${{ vars.EMBEDDING_MODEL_CAPACITY || '50' }}

jobs:
  discover:
    name: Discover changed agents
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}
          fetch-depth: 0   # need history for `git diff`

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install discovery dependencies
        run: python -m pip install --quiet "prompty==2.0.0b2"

      - id: list
        run: |
          if [ "${{ inputs.agent }}" = "all" ]; then
            # Explicit opt-in to a full fan-out deploy (dispatch or workflow_call).
            AGENTS=$(python scripts/discover_agents.py)
            echo "Explicit 'all' — deploying every agent: $AGENTS"
          elif [ -n "${{ inputs.agent }}" ]; then
            AGENTS='["${{ inputs.agent }}"]'
            echo "Deploying only the requested agent: $AGENTS"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # No agent input → auto-detect changes since the default branch
            # so a routine manual re-run doesn't accidentally redeploy every
            # agent and conflict with other teammates' in-flight work.
            DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
            git fetch --no-tags --depth=200 origin "$DEFAULT_BRANCH" 2>/dev/null || true
            BASE_REF="origin/${DEFAULT_BRANCH}"
            if ! git rev-parse "$BASE_REF" >/dev/null 2>&1; then
              echo "::warning::Could not resolve $BASE_REF; falling back to all agents."
              AGENTS=$(python scripts/discover_agents.py)
            else
              AGENTS=$(python scripts/discover_agents.py --changed-since "$BASE_REF")
            fi
            echo "Manual dispatch (auto-detect vs $BASE_REF) — affected agents: $AGENTS"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff against the tip of the PR's base branch as fetched into
            # this runner. `pull_request.base.sha` can drift between events
            # and silently fall out of the local history; resolving the
            # base branch name against origin is more stable when combined
            # with fetch-depth: 0.
            BASE_REF_NAME="${{ github.event.pull_request.base.ref }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=200 origin "$BASE_REF_NAME" 2>/dev/null || true
            if git rev-parse "origin/${BASE_REF_NAME}" >/dev/null 2>&1; then
              BASE_REF="origin/${BASE_REF_NAME}"
            elif [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
              BASE_REF="$BASE_SHA"
            else
              echo "::error::Could not resolve PR base ($BASE_REF_NAME / $BASE_SHA) in local history."
              exit 1
            fi
            echo "Pull request event — diffing against $BASE_REF"
            AGENTS=$(python scripts/discover_agents.py --changed-since "$BASE_REF")
            echo "Pull request event — affected agents: $AGENTS"
          else
            REF="${{ github.event.before }}"
            if [ -z "$REF" ] || [ "$REF" = "0000000000000000000000000000000000000000" ]; then
              AGENTS=$(python scripts/discover_agents.py)
            else
              AGENTS=$(python scripts/discover_agents.py --changed-since "$REF")
            fi
            echo "Push event — affected agents: $AGENTS"
          fi
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"

  # PR what-if: read-only vet of a pull request. Real provision/deploy are gated
  # off pull_request (above), so this is how a PR exercises the Azure path —
  # `azd provision --preview` runs an ARM what-if that compiles the bicep,
  # resolves every parameter, and prints the resource delta WITHOUT creating or
  # mutating anything. (Agent images use docker.remoteBuild=true → they build in
  # ACR at deploy time, so there is no local image build to vet here.)
  # Requires a `pull_request` federated credential on the OIDC app — create it
  # with `scripts/oidc.sh --pull-request` (already included in `make setup-oidc`).
  # Note: fork PRs cannot mint an OIDC token, so this job is skipped for forks.
  whatif:
    name: PR what-if (infra preview)
    needs: discover
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Validate required variables
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "v=\$$var"
            [ -z "$v" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo variables: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd config set alpha.deployment.stacks off

      - name: Initialize azd environment
        run: |
          azd env new "$AZD_ENV_NAME" --location "$AZURE_LOCATION" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" || \
            azd env select "$AZD_ENV_NAME"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd env set MODEL_NAME    "$MODEL_NAME"
          azd env set MODEL_VERSION "$MODEL_VERSION"
          azd env set MODEL_SKU_NAME "$MODEL_SKU_NAME"
          azd env set MODEL_CAPACITY "$MODEL_CAPACITY"
          azd env set AZURE_AI_EMBEDDING_DEPLOYMENT_NAME "$AZURE_AI_EMBEDDING_DEPLOYMENT_NAME"
          azd env set EMBEDDING_MODEL_NAME "$EMBEDDING_MODEL_NAME"
          azd env set EMBEDDING_MODEL_VERSION "$EMBEDDING_MODEL_VERSION"
          azd env set EMBEDDING_MODEL_SKU_NAME "$EMBEDDING_MODEL_SKU_NAME"
          azd env set EMBEDDING_MODEL_CAPACITY "$EMBEDDING_MODEL_CAPACITY"

          # WebIQ expert grounds on Azure "Grounding with Bing Search", provisioned
          # by bicep (core/search/bing_grounding.bicep) with its key auto-read via
          # listKeys() — no secret or URL to seed here.

          # WorkIQ expert Microsoft 365 MCP tools (AgenticIdentity — the agent's
          # own identity, no key). URLs are optional until the exact
          # tenant-supported endpoints are known; do not seed placeholder URLs.
          azd env set WORKIQ_EMAIL_MCP_SERVER_URL "${{ vars.WORKIQ_EMAIL_MCP_SERVER_URL }}"
          azd env set WORKIQ_TEAMS_MCP_SERVER_URL "${{ vars.WORKIQ_TEAMS_MCP_SERVER_URL }}"
          azd env set WORKIQ_SHAREPOINT_MCP_SERVER_URL "${{ vars.WORKIQ_SHAREPOINT_MCP_SERVER_URL || vars.WORKIQ_MCP_SERVER_URL }}"
          azd env set WORKIQ_MCP_SERVER_URL "${{ vars.WORKIQ_MCP_SERVER_URL }}"
          if [ -n "${{ vars.WORKIQ_MCP_SCOPE }}" ]; then
            azd env set WORKIQ_MCP_SCOPE "${{ vars.WORKIQ_MCP_SCOPE }}"
          fi

          ENABLE_SEARCH_VAL="${{ vars.ENABLE_SEARCH || 'true' }}"
          azd env set ENABLE_SEARCH "$ENABLE_SEARCH_VAL"
          if [ "$ENABLE_SEARCH_VAL" = "false" ]; then
            azd env set AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME || 'kb-mcp-connection' }}"
            azd env set AZURE_AI_SEARCH_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_CONNECTION_NAME || 'azure-ai-search-connection' }}"
          fi

          # operations-data-expert binds the live Waypoint Fabric data agent via
          # this MicrosoftFabric project connection (provisioned out-of-band by
          # scripts/initialize_fabric_data_agent.py). agent.yaml substitutes the
          # name into FABRIC_DATA_AGENT_CONNECTION_NAME. The headless path also
          # reads the mirrored operational core over the Fabric SQL analytics
          # endpoint with the project MI; surface its server host + database.
          azd env set FABRIC_DATA_AGENT_CONNECTION_NAME "${{ vars.FABRIC_DATA_AGENT_CONNECTION_NAME || 'waypoint-data-agent-connection' }}"
          azd env set FABRIC_MIRRORED_SQL_ENDPOINT "${{ vars.FABRIC_MIRRORED_SQL_ENDPOINT }}"
          azd env set FABRIC_MIRRORED_DATABASE "${{ vars.FABRIC_MIRRORED_DATABASE }}"
          azd env set FABRIC_MIRRORED_SCHEMA "${{ vars.FABRIC_MIRRORED_SCHEMA || '_public' }}"

          if [ -n "${{ vars.AZURE_AI_ACCOUNT_NAME }}" ] && [ -n "${{ vars.AZURE_AI_PROJECT_NAME }}" ]; then
            echo "Reusing existing Foundry project: ${{ vars.AZURE_AI_ACCOUNT_NAME }}/${{ vars.AZURE_AI_PROJECT_NAME }}"
            azd env set USE_EXISTING_AI_PROJECT true
            azd env set AZURE_RESOURCE_GROUP   "${{ vars.AZURE_RESOURCE_GROUP }}"
            azd env set AZURE_AI_ACCOUNT_NAME  "${{ vars.AZURE_AI_ACCOUNT_NAME }}"
            azd env set AZURE_AI_PROJECT_NAME  "${{ vars.AZURE_AI_PROJECT_NAME }}"
          fi

      - name: What-if (azd provision --preview)
        id: whatif
        run: |
          set -o pipefail
          # azd emits the preview as human text (it ignores --output json here)
          # and may split it across stdout/stderr — capture both into one file
          # for the summary, while tee keeps it visible in the step log.
          azd provision --preview --no-prompt 2>&1 | tee preview.txt
        timeout-minutes: 15

      - name: Render what-if summary
        if: always()
        run: |
          if [ -f preview.txt ]; then
            python3 scripts/render_whatif_summary.py preview.txt >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🔭 Infrastructure what-if"
              echo "_No preview output was produced (the what-if step did not run)._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  provision:
    name: Provision shared infra
    needs: discover
    if: |
      github.event_name != 'pull_request' &&
      needs.discover.outputs.agents != '[]' &&
      needs.discover.outputs.agents != '' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_provision == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}
          fetch-depth: 0   # need history for the `Detect infra changes` git diff

      - name: Validate required variables
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "v=\$$var"
            [ -z "$v" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo variables: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Register Microsoft.BotService provider
        run: az provider register --namespace Microsoft.BotService --wait
        timeout-minutes: 5

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd config set alpha.deployment.stacks off

      - name: Initialize azd environment
        run: |
          azd env new "$AZD_ENV_NAME" --location "$AZURE_LOCATION" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" || \
            azd env select "$AZD_ENV_NAME"
          azd env set AZURE_TENANT_ID "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"
          azd env set MODEL_NAME    "$MODEL_NAME"
          azd env set MODEL_VERSION "$MODEL_VERSION"
          azd env set MODEL_SKU_NAME "$MODEL_SKU_NAME"
          azd env set MODEL_CAPACITY "$MODEL_CAPACITY"
          azd env set AZURE_AI_EMBEDDING_DEPLOYMENT_NAME "$AZURE_AI_EMBEDDING_DEPLOYMENT_NAME"
          azd env set EMBEDDING_MODEL_NAME "$EMBEDDING_MODEL_NAME"
          azd env set EMBEDDING_MODEL_VERSION "$EMBEDDING_MODEL_VERSION"
          azd env set EMBEDDING_MODEL_SKU_NAME "$EMBEDDING_MODEL_SKU_NAME"
          azd env set EMBEDDING_MODEL_CAPACITY "$EMBEDDING_MODEL_CAPACITY"

          # WebIQ expert grounds on Azure "Grounding with Bing Search", provisioned
          # by bicep (key auto-read via listKeys()) — no secret or URL to seed here.

          # WorkIQ expert Microsoft 365 MCP tools (AgenticIdentity, no key).
          azd env set WORKIQ_EMAIL_MCP_SERVER_URL "${{ vars.WORKIQ_EMAIL_MCP_SERVER_URL }}"
          azd env set WORKIQ_TEAMS_MCP_SERVER_URL "${{ vars.WORKIQ_TEAMS_MCP_SERVER_URL }}"
          azd env set WORKIQ_SHAREPOINT_MCP_SERVER_URL "${{ vars.WORKIQ_SHAREPOINT_MCP_SERVER_URL || vars.WORKIQ_MCP_SERVER_URL }}"
          azd env set WORKIQ_MCP_SERVER_URL "${{ vars.WORKIQ_MCP_SERVER_URL }}"
          if [ -n "${{ vars.WORKIQ_MCP_SCOPE }}" ]; then
            azd env set WORKIQ_MCP_SCOPE "${{ vars.WORKIQ_MCP_SCOPE }}"
          fi

          # Allow disabling the bicep-managed Azure AI Search (e.g. when
          # reusing an existing Search service via manually-created project
          # connections). Default is `true` so existing infra keeps working.
          ENABLE_SEARCH_VAL="${{ vars.ENABLE_SEARCH || 'true' }}"
          azd env set ENABLE_SEARCH "$ENABLE_SEARCH_VAL"

          # When bicep skips Search, the kb-mcp-connection still exists on the
          # project (created out-of-band), so tell create_toolbox.py to wire
          # the knowledge_base MCP tool to it.
          if [ "$ENABLE_SEARCH_VAL" = "false" ]; then
            azd env set AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME || 'kb-mcp-connection' }}"
            azd env set AZURE_AI_SEARCH_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_CONNECTION_NAME || 'azure-ai-search-connection' }}"
          fi

          # operations-data-expert binds the live Waypoint Fabric data agent via
          # this MicrosoftFabric project connection (provisioned out-of-band by
          # scripts/initialize_fabric_data_agent.py). agent.yaml substitutes the
          # name into FABRIC_DATA_AGENT_CONNECTION_NAME. The headless path also
          # reads the mirrored operational core over the Fabric SQL analytics
          # endpoint with the project MI; surface its server host + database.
          azd env set FABRIC_DATA_AGENT_CONNECTION_NAME "${{ vars.FABRIC_DATA_AGENT_CONNECTION_NAME || 'waypoint-data-agent-connection' }}"
          azd env set FABRIC_MIRRORED_SQL_ENDPOINT "${{ vars.FABRIC_MIRRORED_SQL_ENDPOINT }}"
          azd env set FABRIC_MIRRORED_DATABASE "${{ vars.FABRIC_MIRRORED_DATABASE }}"
          azd env set FABRIC_MIRRORED_SCHEMA "${{ vars.FABRIC_MIRRORED_SCHEMA || '_public' }}"

          if [ -n "${{ vars.AZURE_AI_ACCOUNT_NAME }}" ] && [ -n "${{ vars.AZURE_AI_PROJECT_NAME }}" ]; then
            echo "Reusing existing Foundry project: ${{ vars.AZURE_AI_ACCOUNT_NAME }}/${{ vars.AZURE_AI_PROJECT_NAME }}"
            azd env set USE_EXISTING_AI_PROJECT true
            azd env set AZURE_RESOURCE_GROUP   "${{ vars.AZURE_RESOURCE_GROUP }}"
            azd env set AZURE_AI_ACCOUNT_NAME  "${{ vars.AZURE_AI_ACCOUNT_NAME }}"
            azd env set AZURE_AI_PROJECT_NAME  "${{ vars.AZURE_AI_PROJECT_NAME }}"
          fi

      - name: Detect infra changes
        # Decides whether the provision step needs to run on this push/PR.
        # Replaces the older `contains(toJson(github.event.commits.*.modified),
        # 'infra/')` JMESPath, which substring-grepped a JSON dump of commits
        # and broke on JSON formatting changes / `pull_request` events (which
        # don't populate github.event.commits). The job's `actions/checkout`
        # uses fetch-depth=0 so `git diff` has the full history it needs.
        #
        # Fail-safe: any time we cannot reliably compute the diff (missing
        # base SHA, network glitch on fetch, git error), we assume infra
        # changed and let provision run. A spurious provision is a no-op when
        # nothing actually changed; a *missed* provision can silently deploy
        # agents against stale infra, which is the bug this step is meant to
        # prevent. Bias toward correctness over CI minutes.
        id: infra_changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          mark_changed() {
            local reason="$1"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Detect infra changes: assuming changed=true ($reason)"
          }

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            mark_changed "no usable base ref (new branch / forced push / initial commit)"
            exit 0
          fi

          # Make sure both ends of the range are reachable locally. PR runs
          # sometimes land with just the merge commit; force-pushes can break
          # the ancestor chain. Fetch the base SHA explicitly; if that fails
          # we'll fall into the fail-safe branch below.
          git fetch --no-tags --depth=200 origin "$BASE" 2>/dev/null || \
          git fetch --no-tags --depth=200 origin "+refs/heads/*:refs/remotes/origin/*" 2>/dev/null || true

          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            mark_changed "base SHA $BASE not reachable after fetch"
            exit 0
          fi
          if ! git cat-file -e "${HEAD}^{commit}" 2>/dev/null; then
            mark_changed "head SHA $HEAD not reachable after fetch"
            exit 0
          fi

          # Capture diff output separately so a git failure is distinguishable
          # from grep finding no matches (the bug the old `git diff | grep -q`
          # pipeline was hiding).
          if ! diff_output=$(git diff --name-only "$BASE" "$HEAD" 2>&1); then
            mark_changed "git diff failed: $diff_output"
            exit 0
          fi

          if printf '%s\n' "$diff_output" | grep -qE '^infra/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "infra/ changes detected between $BASE and $HEAD."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No infra/ changes between $BASE and $HEAD."
          fi

      - name: Provision Azure resources
        # Run once, before per-agent deploys, to avoid parallel infra races.
        # Only fires when explicitly requested (dispatch with provision=true)
        # or when infra/** changed in the triggering push/PR. Plain agent
        # code changes reuse the existing shared infra outputs.
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.provision == true) ||
          ((github.event_name == 'push' || github.event_name == 'pull_request') &&
            steps.infra_changes.outputs.changed == 'true')
        run: azd provision --no-prompt
        timeout-minutes: 30

      - name: Configure Content Understanding defaults
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.provision == true) ||
          ((github.event_name == 'push' || github.event_name == 'pull_request') &&
            steps.infra_changes.outputs.changed == 'true')
        run: |
          set -euo pipefail
          export CONTENT_UNDERSTANDING_ENDPOINT="$(azd env get-value CONTENT_UNDERSTANDING_ENDPOINT)"
          export CONTENT_UNDERSTANDING_API_VERSION="$(azd env get-value CONTENT_UNDERSTANDING_API_VERSION)"
          export CONTENT_UNDERSTANDING_SCOPE="$(azd env get-value CONTENT_UNDERSTANDING_SCOPE)"
          export CONTENT_UNDERSTANDING_COMPLETION_DEPLOYMENT_NAME="$(azd env get-value CONTENT_UNDERSTANDING_COMPLETION_DEPLOYMENT_NAME)"
          export CONTENT_UNDERSTANDING_COMPLETION_MODEL_NAME="$(azd env get-value CONTENT_UNDERSTANDING_COMPLETION_MODEL_NAME)"
          export AZURE_AI_ACCOUNT_NAME="$(azd env get-value AZURE_AI_ACCOUNT_NAME)"
          export AZURE_RESOURCE_GROUP="$(azd env get-value AZURE_RESOURCE_GROUP)"
          export AZURE_AI_EMBEDDING_DEPLOYMENT_NAME="$(azd env get-value AZURE_AI_EMBEDDING_DEPLOYMENT_NAME)"
          python scripts/configure_content_understanding.py
        timeout-minutes: 5

      - name: Verify deployment outputs exist
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?properties.provisioningState=='Succeeded'].{name:name, ts:properties.timestamp}" \
            -o json \
            | jq -r --arg env "$AZD_ENV_NAME" '
                map(select(.name | test("^" + $env + "-[0-9]+$")))
                | sort_by(.ts)
                | last
                | .name // empty
              ')
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment matching '^${AZD_ENV_NAME}-[0-9]+$' found. Run dispatch with provision=true."
            exit 1
          fi
          echo "Latest deployment: $DEPLOYMENT"
        timeout-minutes: 2

  deploy:
    name: Deploy ${{ matrix.agent }}
    needs: [discover, provision]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.discover.result == 'success' &&
      (needs.provision.result == 'success' || needs.provision.result == 'skipped') &&
      needs.discover.outputs.agents != '[]' &&
      needs.discover.outputs.agents != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover.outputs.agents) }}
    # Every matrix leg hydrates the SAME Foundry project endpoint (steps.endpoint),
    # so exposing it as a job output is deterministic regardless of which leg writes last.
    outputs:
      project_endpoint: ${{ steps.endpoint.outputs.endpoint }}
      # contracts-kb coordinates for the keystone umbrella (see workflow-level
      # outputs). Resolved once from the shared azd/ARM deployment outputs; every
      # matrix leg reads the SAME values, so the last writer is deterministic.
      contracts_kb_storage_account: ${{ steps.coords.outputs.storage_account }}
      contracts_kb_container: ${{ steps.coords.outputs.container }}
      contracts_kb_search_endpoint: ${{ steps.coords.outputs.search_endpoint }}
      contracts_kb_indexer: ${{ steps.coords.outputs.indexer }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Validate required variables
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "v=\$$var"
            [ -z "$v" ] && missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo variables: ${missing[*]}"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd config set alpha.deployment.stacks off

      - name: Select azd environment
        run: |
          azd env new "$AZD_ENV_NAME" --location "$AZURE_LOCATION" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" || \
            azd env select "$AZD_ENV_NAME"

      - name: Seed identity values into azd env
        # The azure.ai.agent azd extension's `postdeploy` event handler reads
        # AZURE_TENANT_ID (and friends) from the azd env, not from process
        # env. On provision-skipped runs only bicep outputs get hydrated, so
        # without this step the postdeploy hook fails with:
        #   "AZURE_TENANT_ID is not set in the environment"
        # even though the container deployed fine.
        run: |
          azd env set AZURE_TENANT_ID       "${{ vars.AZURE_TENANT_ID }}"
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_CLIENT_ID       "${{ vars.AZURE_CLIENT_ID }}"
          # AI Teammate blueprint client secret for assurance-orchestrator.
          # agent.yaml binds ${ASSURANCE_ORCHESTRATOR_BLUEPRINT_CLIENT_SECRET}
          # into CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET, which
          # the MSAL confidential-client agentic-token flow behind /api/messages
          # requires (Teams direct chat AND digital-worker email). CI has no
          # remote azd state, so inject it from the repo Actions secret before
          # `azd deploy`. Guard on non-empty so runs without the secret don't
          # shadow a local .env with "" (which surfaces as an opaque -60018 at
          # hire-chat time — see docs/AI_TEAMMATE.md).
          orch_bp_secret="${{ secrets.ASSURANCE_ORCHESTRATOR_BLUEPRINT_CLIENT_SECRET }}"
          if [ -n "$orch_bp_secret" ]; then
            azd env set ASSURANCE_ORCHESTRATOR_BLUEPRINT_CLIENT_SECRET "$orch_bp_secret"
          fi
          # Same blueprint-secret requirement for invoice-analyst's Teams
          # chat surface. agent.yaml binds ${INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET}
          # into CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTSECRET.
          analyst_bp_secret="${{ secrets.INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET }}"
          if [ -n "$analyst_bp_secret" ]; then
            azd env set INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET "$analyst_bp_secret"
          fi
          # When called by the keystone umbrella (workflow_call), the scoped Waypoint
          # x-api-keys arrive either from Key Vault (preferred — inputs.key_vault_name set,
          # because GitHub cannot pass runtime-generated secrets through job outputs) or as
          # secrets, and must land in the azd env BEFORE `azd deploy` so agent.yaml
          # ${WAYPOINT_WRITER_API_KEY}/${WAYPOINT_READER_API_KEY} resolve. Guard on non-empty
          # so standalone runs (no KV, no secrets) don't inject empty values (empty would
          # shadow .env and force the bearer/MI fallback path).
          writer_key="${{ secrets.WAYPOINT_WRITER_API_KEY }}"
          reader_key="${{ secrets.WAYPOINT_READER_API_KEY }}"
          if [ -n "${{ inputs.key_vault_name }}" ]; then
            kv="${{ inputs.key_vault_name }}"
            writer_key="$(az keyvault secret show --vault-name "$kv" --name waypoint-writer-key --query value -o tsv 2>/dev/null || echo "$writer_key")"
            reader_key="$(az keyvault secret show --vault-name "$kv" --name waypoint-reader-key --query value -o tsv 2>/dev/null || echo "$reader_key")"
          fi
          if [ -n "$writer_key" ]; then
            azd env set WAYPOINT_WRITER_API_KEY "$writer_key"
          fi
          if [ -n "$reader_key" ]; then
            azd env set WAYPOINT_READER_API_KEY "$reader_key"
          fi
          # WebIQ expert grounds on Foundry's native web search (Azure "Grounding
          # with Bing Search"), provisioned in bicep — no key/URL to seed here.
          # WorkIQ expert connects DIRECTLY to Microsoft 365 MCP servers as the
          # agent's OWN identity (AgenticIdentity — no key). Seed the container
          # env so agent.yaml WorkIQ placeholders resolve before `azd deploy`.
          azd env set WORKIQ_EMAIL_MCP_SERVER_URL "${{ vars.WORKIQ_EMAIL_MCP_SERVER_URL }}"
          azd env set WORKIQ_TEAMS_MCP_SERVER_URL "${{ vars.WORKIQ_TEAMS_MCP_SERVER_URL }}"
          azd env set WORKIQ_SHAREPOINT_MCP_SERVER_URL "${{ vars.WORKIQ_SHAREPOINT_MCP_SERVER_URL || vars.WORKIQ_MCP_SERVER_URL }}"
          azd env set WORKIQ_MCP_SERVER_URL "${{ vars.WORKIQ_MCP_SERVER_URL }}"
          if [ -n "${{ vars.WORKIQ_MCP_SCOPE }}" ]; then
            azd env set WORKIQ_MCP_SCOPE "${{ vars.WORKIQ_MCP_SCOPE }}"
          fi
          azd env set CONTENT_UNDERSTANDING_API_VERSION "2025-11-01"
          azd env set CONTENT_UNDERSTANDING_ANALYZER_ID "prebuilt-invoice"
          azd env set CONTENT_UNDERSTANDING_SCOPE "https://cognitiveservices.azure.com/.default"
          # Waypoint API base URL + scope are waypoint DEPLOY OUTPUTS (not self-computable
          # by forge). The keystone umbrella passes them as workflow_call inputs (fresh,
          # authoritative — waypoint-deploy runs BEFORE forge-deploy). For STANDALONE forge
          # runs (push / workflow_dispatch — no inputs) fall back to repo vars so the hosted
          # agents still wire up to the known-good deployed Waypoint instead of deploying with
          # the Waypoint tools disabled. Precedence: workflow_call input > repo var. Seed them
          # into the azd env BEFORE `azd deploy` so agent.yaml ${WAYPOINT_API_BASE_URL}/
          # ${WAYPOINT_API_SCOPE} resolve (this replaces keystone wire.sh's `azd env set
          # --cwd ../forge`, a no-op in CI — the wire job has no forge checkout). Guard on
          # non-empty so a truly unconfigured run doesn't shadow a local .env.
          WP_BASE="${{ inputs.waypoint_api_base_url }}"
          if [ -z "$WP_BASE" ]; then WP_BASE="${{ vars.WAYPOINT_API_BASE_URL }}"; fi
          if [ -n "$WP_BASE" ]; then
            azd env set WAYPOINT_API_BASE_URL "$WP_BASE"
          fi
          WP_SCOPE="${{ inputs.waypoint_api_scope }}"
          if [ -z "$WP_SCOPE" ]; then WP_SCOPE="${{ vars.WAYPOINT_API_SCOPE }}"; fi
          if [ -n "$WP_SCOPE" ]; then
            azd env set WAYPOINT_API_SCOPE "$WP_SCOPE"
          fi
          # Waypoint WEB app base URL (web_fqdn) — powers the invoice-analyst
          # Adaptive Card invoice deep-links. Same precedence as the API values:
          # workflow_call input (keystone passes preflight.recorded_web_fqdn —
          # authoritative because the web Container App FQDN is stable across
          # deploys) > forge repo var (standalone push / workflow_dispatch runs).
          # Normalize to an https:// origin since recorded_web_fqdn is a bare FQDN.
          # Guard on non-empty: a fully unconfigured run simply deploys the agent
          # with links disabled (rows still render), and never shadows a local .env.
          WP_APP="${{ inputs.waypoint_app_base_url }}"
          if [ -z "$WP_APP" ]; then WP_APP="${{ vars.WAYPOINT_APP_BASE_URL }}"; fi
          if [ -n "$WP_APP" ]; then
            case "$WP_APP" in
              http://*|https://*) ;;
              *) WP_APP="https://$WP_APP" ;;
            esac
            azd env set WAYPOINT_APP_BASE_URL "$WP_APP"
          elif [ "${{ matrix.agent }}" = "invoice-analyst" ]; then
            # Not fatal, but a silent empty here is exactly the "miss" that ships
            # an invoice-analyst whose Adaptive Cards render without deep-links.
            # Surface it loudly so a one-click deploy makes the gap obvious:
            # set the WAYPOINT_APP_BASE_URL repo var (or pass waypoint_app_base_url
            # from the keystone umbrella) to enable …/invoices?invoice=<id> links.
            echo "::warning title=invoice-analyst deep-links disabled::WAYPOINT_APP_BASE_URL is empty (no workflow input and no repo var); Adaptive Card rows will render without invoice deep-links. Set the WAYPOINT_APP_BASE_URL repo var or pass waypoint_app_base_url to enable them."
          fi
          # operations-data-expert (FabricIQ) binds the live Waypoint Fabric data
          # agent via this MicrosoftFabric project connection, and its headless path
          # reads the mirrored operational core over the Fabric SQL analytics endpoint.
          # These are plain repo vars (not bicep outputs), so — exactly like the
          # WAYPOINT_*/WORKIQ_* values above — they MUST be re-seeded here in the
          # deploy job: the azd env does NOT persist across the provision and deploy
          # jobs (no remote state), so the provision-job seeding never reaches
          # `azd deploy`. Without this, agent.yaml's ${FABRIC_DATA_AGENT_CONNECTION_NAME}
          # and ${FABRIC_MIRRORED_*} resolve to empty and the FabricIQ grounding
          # silently no-ops (empty connection + empty SQL endpoint).
          azd env set FABRIC_DATA_AGENT_CONNECTION_NAME "${{ vars.FABRIC_DATA_AGENT_CONNECTION_NAME || 'waypoint-data-agent-connection' }}"
          azd env set FABRIC_MIRRORED_SQL_ENDPOINT "${{ vars.FABRIC_MIRRORED_SQL_ENDPOINT }}"
          azd env set FABRIC_MIRRORED_DATABASE "${{ vars.FABRIC_MIRRORED_DATABASE }}"
          azd env set FABRIC_MIRRORED_SCHEMA "${{ vars.FABRIC_MIRRORED_SCHEMA || '_public' }}"

      - name: Hydrate azd env from last deployment outputs
        id: endpoint
        # Read the last successful azd subscription deployment and copy
        # *every* output into the azd env. azd names sub-scoped deployments
        # "<env>-<unix-timestamp>". This makes provision-skipped runs behave
        # identically to runs where azd just provisioned.
        #
        # ┌─────────────────────────────────────────────────────────────┐
        # │ LOAD-BEARING REGEX — DO NOT "SIMPLIFY" TO starts_with(...)  │
        # └─────────────────────────────────────────────────────────────┘
        # The previous filter was `starts_with(name, '<env>-')`. That
        # matches sibling env prefixes too: AZD_ENV_NAME=`forge` would
        # match a `forge-demo-<ts>` deployment from a different env
        # and hydrate outputs from the wrong resource group, silently
        # pointing deploys at the wrong Foundry account. The
        # `^<env>-[0-9]+$` regex requires the exact env name followed
        # only by azd's unix-timestamp suffix — nothing else. Changing
        # this WILL re-break env isolation between any pair of envs
        # where one name is a prefix of the other.
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?properties.provisioningState=='Succeeded'].{name:name, ts:properties.timestamp}" \
            -o json \
            | jq -r --arg env "$AZD_ENV_NAME" '
                map(select(.name | test("^" + $env + "-[0-9]+$")))
                | sort_by(.ts)
                | last
                | .name // empty
              ')
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment matching '^${AZD_ENV_NAME}-[0-9]+$' found. Run with provision=true."
            exit 1
          fi
          echo "Hydrating from deployment: $DEPLOYMENT"

          # ARM lowercases all but the last char of the first underscore token
          # in output names (AZURE_AI_PROJECT_ENDPOINT -> azurE_AI_PROJECT_ENDPOINT).
          # Re-uppercase the whole key for azd env consumption.
          while IFS=$'\t' read -r key value; do
            [ -z "$key" ] && continue
            UPPER=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
            azd env set "$UPPER" "$value"
          done < <(az deployment sub show --name "$DEPLOYMENT" \
                    --query "properties.outputs" -o json \
                    | jq -r 'to_entries[] | "\(.key)\t\(.value.value)"')

          ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)
          if [ -z "$ENDPOINT" ] || printf '%s' "$ENDPOINT" | grep -qi 'not found'; then
            echo "::error::Deployment '$DEPLOYMENT' has no AZURE_AI_PROJECT_ENDPOINT output."
            exit 1
          fi
          # The azure.ai.agent azd extension reads FOUNDRY_PROJECT_ENDPOINT
          # (not AZURE_AI_PROJECT_ENDPOINT) from the azd env during
          # `azd deploy`. Locally `azd provision` runs a postprovision hook
          # that aliases it; CI hydrates from bicep outputs only, so set
          # it explicitly here.
          azd env set FOUNDRY_PROJECT_ENDPOINT "$ENDPOINT"
          echo "Endpoint: $ENDPOINT"
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
        timeout-minutes: 2

      - name: Resolve contracts-kb coordinates
        id: coords
        # Surface the storage/container/search-endpoint/indexer coordinates the
        # keystone umbrella passes to Ledgerfield's contracts-kb-upload
        # (idempotent self-cleaning blob sync + immediate reindex). The hydrate
        # step above copied every deployment output into the azd env, so read
        # them straight from there — nothing hardcoded, values track whatever
        # infra provisioned. The indexer name is deterministic (<ks>-indexer).
        # Best-effort: a missing output leaves that coord blank (empty string via
        # `|| true`) rather than failing the deploy.
        run: |
          set -euo pipefail
          STORAGE_ACCOUNT="$(azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>/dev/null || true)"
          CONTAINER="$(azd env get-value AZURE_AI_SEARCH_CONTAINER_NAME 2>/dev/null || true)"
          SEARCH_ENDPOINT="$(azd env get-value AZURE_AI_SEARCH_SERVICE_ENDPOINT 2>/dev/null || true)"
          INDEXER="$(azd env get-value AZURE_AI_SEARCH_INDEXER_NAME 2>/dev/null || true)"
          # azd prints a sentinel string when a key is unset — normalise to empty.
          for var in STORAGE_ACCOUNT CONTAINER SEARCH_ENDPOINT INDEXER; do
            eval "v=\${$var}"
            case "$v" in *"not found"*|"ERROR"*) eval "$var=''";; esac
          done
          echo "storage_account=$STORAGE_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "search_endpoint=$SEARCH_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "indexer=$INDEXER" >> "$GITHUB_OUTPUT"
          {
            echo "### contracts-kb coordinates (keystone → Ledgerfield)"
            echo ""
            echo "| output | value |"
            echo "| --- | --- |"
            echo "| contracts_kb_storage_account | \`${STORAGE_ACCOUNT:-<empty>}\` |"
            echo "| contracts_kb_container | \`${CONTAINER:-<empty>}\` |"
            echo "| contracts_kb_search_endpoint | \`${SEARCH_ENDPOINT:-<empty>}\` |"
            echo "| contracts_kb_indexer | \`${INDEXER:-<empty>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 2

      - name: Create / update Foundry toolbox for ${{ matrix.agent }}
        id: toolbox
        # market-evidence-expert uses Foundry's native web-search tool directly.
        # operations-data-expert has no Foundry toolbox: its only capability is
        # the live Waypoint Fabric data agent (interactive) + the deterministic
        # gather_fabric_evidence SQL read (headless), both bound in main.py, not
        # via a project toolbox MCP endpoint. See agents/operations-data-expert/toolbox.py.
        # collaboration-evidence-expert does use a toolbox, but under the stable
        # name `collaboration-evidence-tools` because the hosted agent forwards
        # request context to that WorkIQ/UserEntraToken toolbox at runtime.
        if: ${{ matrix.agent != 'market-evidence-expert' && matrix.agent != 'operations-data-expert' }}
        # Fail loudly for agents whose toolbox is load-bearing rather than
        # swallowing the error: collaboration-evidence-expert forwards request
        # context to its toolbox at runtime, and invoice-analyst's KB toolbox
        # powers the contract/policy reasoning + Adaptive Card deep-links — a
        # broken toolbox for either must not ship green. Other agents stay
        # best-effort (transient PAT/connection gaps shouldn't block a deploy).
        continue-on-error: ${{ matrix.agent != 'collaboration-evidence-expert' && matrix.agent != 'invoice-analyst' }}
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          # Install everything any agent's toolbox.py might import.
          # Pin to the GA toolboxes line: scripts/create_toolbox.py drives the
          # graduated `project.toolboxes` API (create_version/update), which only
          # exists in azure-ai-projects >= 2.1.0. Unpinned installs previously
          # resolved to preview builds whose `beta.toolboxes` accessor had moved,
          # breaking every toolbox build silently under continue-on-error.
          python -m pip install --quiet 'azure-ai-projects>=2.1.0,<3' azure-identity

          # Pull through any azd env values an agent's toolbox.py may read
          # (e.g. AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME — the generic name
          # hopper reads, AZURE_AI_SEARCH_CONNECTION_NAME). These were set
          # either via bicep deployment outputs (hydration step) or directly
          # by the workflow when ENABLE_SEARCH=false.
          # release-captain has its own per-agent KB connection name that
          # comes from the GH repo var (set once at provisioning time and
          # persisted across CI runs without relying on azd env state
          # crossing jobs).
          KB_MCP_CONN_NAME="$(azd env get-value AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME 2>/dev/null || true)"
          AI_SEARCH_CONN_NAME="$(azd env get-value AZURE_AI_SEARCH_CONNECTION_NAME 2>/dev/null || true)"
          RC_KB_MCP_CONN_NAME="${{ vars.RELEASE_CAPTAIN_KB_MCP_CONNECTION_NAME }}"
          case "$KB_MCP_CONN_NAME" in *"not found"*|"") KB_MCP_CONN_NAME="" ;; esac
          case "$AI_SEARCH_CONN_NAME" in *"not found"*|"") AI_SEARCH_CONN_NAME="" ;; esac

          TOOLBOX_NAME_ARG=()
          if [ "${{ matrix.agent }}" = "collaboration-evidence-expert" ]; then
            TOOLBOX_NAME_ARG=(--toolbox-name collaboration-evidence-tools)
          fi

          FOUNDRY_PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
          GH_MCP_CONNECTION_ID="${{ vars.GH_MCP_CONNECTION_ID }}" \
          GH_MCP_PAT="${{ secrets.GH_MCP_PAT }}" \
          ADO_MCP_CONNECTION_ID="${{ vars.ADO_MCP_CONNECTION_ID }}" \
          OUTLOOK_MCP_CONNECTION_ID="${{ vars.OUTLOOK_MCP_CONNECTION_ID }}" \
          AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME="$KB_MCP_CONN_NAME" \
          RELEASE_CAPTAIN_KB_MCP_CONNECTION_NAME="$RC_KB_MCP_CONN_NAME" \
          AZURE_AI_SEARCH_CONNECTION_NAME="$AI_SEARCH_CONN_NAME" \
            python scripts/create_toolbox.py --agent "${{ matrix.agent }}" "${TOOLBOX_NAME_ARG[@]}" \
            | tee /tmp/toolbox.log

          ENDPOINT=$(grep '^TOOLBOX_MCP_ENDPOINT=' /tmp/toolbox.log | cut -d= -f2-)
          if [ -z "$ENDPOINT" ]; then
            echo "::error::Toolbox script did not emit an endpoint"
            exit 1
          fi
          echo "Toolbox endpoint: $ENDPOINT"
          if [ "${{ matrix.agent }}" = "collaboration-evidence-expert" ]; then
            azd env set WORKIQ_TOOLBOX_NAME "collaboration-evidence-tools"
            azd env set WORKIQ_TOOLBOX_MCP_ENDPOINT "$ENDPOINT"
          else
            azd env set TOOLBOX_MCP_ENDPOINT "$ENDPOINT"
          fi
        timeout-minutes: 5

      - name: Ensure waypoint-iq toolbox uses managed_identity auth
        # Doc-canonical WaypointIQ auth (see docs/WAYPOINTIQ.md): the durable
        # waypoint-iq toolbox's OpenAPI tool authenticates to Waypoint as the
        # Foundry PROJECT managed identity (stable across redeploys/hires), not a
        # per-agent agentic-identity connection. Idempotent: no-op if already
        # managed_identity. Analyst-gated so it runs on every forge deploy (the
        # analyst is always in the matrix), incl. keystone's one-click pipeline.
        # Best-effort: a fresh environment may not yet have the waypoint-iq toolbox.
        if: ${{ matrix.agent == 'invoice-analyst' }}
        continue-on-error: true
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          FOUNDRY_PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
            python scripts/ensure_waypoint_iq_managed_identity.py
        timeout-minutes: 5

      - name: Merge read-only WaypointIQ into invoice-analyst toolbox
        # create_toolbox.py (above) rebuilds invoice-analyst-tools from
        # toolbox.py, which only declares the knowledge-base MCP tool. The analyst
        # also needs live Waypoint reads, but reaching Waypoint via a client-side
        # MCP tool in the container crashes on Foundry hosted-agent deactivation.
        # Instead we fold a READ-ONLY (GET-only) projection of the durable
        # waypoint-iq toolbox into invoice-analyst-tools so those calls run
        # server-side in the Foundry ToolServer. This step must run AFTER
        # create_toolbox so it augments the freshly-rebuilt KB-only toolbox.
        # Best-effort: a fresh environment may not yet have the waypoint-iq source
        # toolbox. The merge sets doc-canonical managed_identity auth (project MI;
        # see `make waypoint-iq-auth` / docs/WAYPOINTIQ.md). The project MI must
        # hold Waypoint.Read and be in Waypoint's APP_MSAL_ALLOWED_APP_IDS.
        if: ${{ matrix.agent == 'invoice-analyst' }}
        continue-on-error: true
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          FOUNDRY_PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
            python scripts/ensure_analyst_waypoint_tool.py
        timeout-minutes: 5

      - name: Discover blueprint client id for ${{ matrix.agent }}
        # The Microsoft 365 AI Teammate /api/messages mount in
        # agents/<name>/activity_protocol.py only activates when the
        # container env var CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
        # is set to the agent's *blueprint* MSA AppId. agent.yaml binds that
        # to ${<AGENT>_BLUEPRINT_CLIENT_ID} via azd env substitution.
        #
        # The blueprint is created by `make publish <agent>` (from a dev
        # machine) — not by this workflow. Once it exists, we discover the
        # client_id from Foundry's agent metadata and seed it into the azd
        # env BEFORE `azd deploy` so the value lands in the container.
        #
        # First-deploy / never-published case: the agent doesn't exist yet
        # (404) or its blueprint is null. Both are non-fatal — the activity
        # protocol mount becomes a no-op and only the /responses surface is
        # served. This preserves the original behavior where the workflow
        # works without `make publish` having ever been run.
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -uo pipefail
          AGENT="${{ matrix.agent }}"
          AGENT_UPPER=$(printf '%s' "$AGENT" | tr '[:lower:]-' '[:upper:]_')
          ENV_KEY="${AGENT_UPPER}_BLUEPRINT_CLIENT_ID"

          AI_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          http_code=$(curl -sS -o /tmp/agent.json -w '%{http_code}' \
            -H "Authorization: Bearer $AI_TOKEN" \
            -H "Foundry-Features: AgentEndpoints=V1Preview,HostedAgents=V1Preview" \
            "${PROJECT_ENDPOINT}/agents/${AGENT}?api-version=2025-11-15-preview" || true)

          if [ "$http_code" = "404" ]; then
            echo "::notice::Agent '${AGENT}' not in Foundry yet — first deploy. /api/messages mount will activate after \`make publish ${AGENT}\` + redeploy."
            azd env set "$ENV_KEY" ""
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            echo "::warning::Could not fetch agent metadata (HTTP ${http_code}); leaving ${ENV_KEY} empty."
            azd env set "$ENV_KEY" ""
            exit 0
          fi

          CLIENT_ID=$(jq -r '.versions.latest.blueprint.client_id // .blueprint.client_id // empty' /tmp/agent.json)
          if [ -z "$CLIENT_ID" ] || [ "$CLIENT_ID" = "null" ]; then
            echo "::notice::Agent '${AGENT}' has no blueprint yet — run \`make publish ${AGENT}\` to enable the AI Teammate path."
            azd env set "$ENV_KEY" ""
            exit 0
          fi

          echo "Discovered blueprint client_id for ${AGENT}: ${CLIENT_ID}"
          azd env set "$ENV_KEY" "$CLIENT_ID"
        timeout-minutes: 2

      - name: Wire assurance-orchestrator pipeline endpoints
        # Assurance Orchestrator is the workflow agent: it fans out to the
        # in-project hosted evidence experts over their Responses endpoints.
        # agent.yaml binds these values from azd env, so they must be set BEFORE
        # `azd deploy assurance-orchestrator`.
        #
        # Forge self-computes it here from its OWN project endpoint using the
        # documented hosted-agent convention <project_endpoint>/agents/<name>
        # (see this workflow's `project_endpoint` output description). This
        # keeps the wiring inside forge's own deploy + azd env — the umbrella
        # (keystone) no longer needs to reach across repos with
        # `azd env set --cwd ../forge`, which never worked in the reusable/CI
        # flow. The waypoint-recorder + hosted experts are deployed by their own
        # jobs; assurance-orchestrator only needs the self-computed Responses
        # endpoint wiring baked into its azd env before deploy.
        if: matrix.agent == 'assurance-orchestrator'
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          base="${PROJECT_ENDPOINT%/}"
          if [ -z "$base" ] || printf '%s' "$base" | grep -qi 'not found'; then
            echo "::error::PROJECT_ENDPOINT is empty; cannot wire assurance-orchestrator pipeline endpoints."
            exit 1
          fi
          # name-of-agent -> env var assurance-orchestrator reads for it
          set_endpoint() { # <env-var> <agent-name>
            local url="${base}/agents/${2}"
            azd env set "$1" "$url"
            echo "  $1=$url"
          }
          echo "Wiring assurance-orchestrator fan-out endpoints from ${base}:"
          set_endpoint WORKIQ_EXPERT_ENDPOINT          collaboration-evidence-expert
          set_endpoint WEBIQ_EXPERT_ENDPOINT           market-evidence-expert
          set_endpoint FOUNDRYIQ_EXPERT_ENDPOINT       contract-policy-expert
          set_endpoint FABRICIQ_EXPERT_ENDPOINT        operations-data-expert
          set_endpoint WAYPOINT_RECORDER_ENDPOINT      waypoint-recorder
          # The four evidence experts are hosted; fan out over their Responses
          # endpoints (INVOCATION_MODE=responses). The prompt-only PROJECT_ENDPOINT
          # and MODEL are still bound by agent.yaml, so pin them empty here. The
          # per-expert *_AGENT_NAME azd vars are no longer bound by agent.yaml, so
          # they are not set at all — prompt-mode fan-out to these experts is retired.
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_INVOCATION_MODE responses
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_PROJECT_ENDPOINT ""
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_MODEL ""
          echo "  ASSURANCE_ORCHESTRATOR_EXPERT_INVOCATION_MODE=responses"
        timeout-minutes: 2

      - name: Deploy ${{ matrix.agent }}
        # Retries up to 3 times. The most common failure is the ACR
        # remote-build log-streaming flake (HTTP 416 InvalidRange on the
        # ACR task log blob). The ACR build itself usually succeeded;
        # only azd's log tail crashed, after which azd falls back to a
        # local Docker build that fails on GitHub runners (no ACR push
        # creds path). `azd deploy` is idempotent, so retrying succeeds
        # on the next attempt almost every time.
        run: |
          set +e
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "::group::azd deploy attempt $attempt / $max_attempts"
            azd deploy "${{ matrix.agent }}" --no-prompt 2>&1 | tee /tmp/azd-deploy.log
            azd_exit=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ $azd_exit -eq 0 ]; then
              echo "::notice::Deploy succeeded on attempt $attempt"
              exit 0
            fi

            # The container itself is what matters. The post-deploy hook
            # (RBAC bootstrap, agent-version fetch) sometimes 404s or lacks
            # Graph perms even though the agent is live and serving traffic.
            if grep -qE "(Done: Deploying service|${{ matrix.agent }}: Done )" /tmp/azd-deploy.log; then
              echo "::warning::Container deployed but post-deploy hook failed — continuing"
              exit 0
            fi

            # Known transient ACR log-streaming flake: retry.
            if grep -qE "(InvalidRange|streaming remote build logs \(HTTP 416\)|failed retrieving package result details)" /tmp/azd-deploy.log; then
              echo "::warning::Transient ACR log-streaming flake on attempt $attempt — retrying"
              attempt=$((attempt + 1))
              sleep $((10 * attempt))
              continue
            fi

            # Known transient azd auth flake: azd's first call sometimes
            # races with `azd config set auth.useAzCliAuth true` and reads
            # an empty user from the az token cache. Re-prime az auth and
            # retry.
            if grep -qE "(failed to get tenant ID for subscription|failed to resolve user '' access to subscription|Retrieving subscriptions\.\.\..*ERROR)" /tmp/azd-deploy.log; then
              echo "::warning::Transient azd auth-cache flake on attempt $attempt — re-priming az and retrying"
              az account show -o none 2>/dev/null || true
              az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" 2>/dev/null || true
              attempt=$((attempt + 1))
              sleep $((10 * attempt))
              continue
            fi

            echo "::error::azd deploy failed with a non-transient error"
            exit 1
          done

          echo "::error::azd deploy failed after $max_attempts attempts"
          exit 1
        timeout-minutes: 30

      - name: Grant agent identities required roles on Foundry account
        # Runs BEFORE the smoke test — on a fresh agent version the
        # instance_identity SP is brand new and has no data-plane roles
        # yet, so invoking the agent endpoint returns 500 PermissionDenied
        # until these grants land. Each hosted agent has TWO Entra
        # identities that need data-plane access on the AI account:
        #   1. instance_identity   - the per-version managed identity used
        #                            for tool calls AND for serving requests
        #                            back through the project endpoint (e.g.
        #                            the Foundry portal Playground). Needs:
        #                              - Cognitive Services User (model calls)
        #                              - Foundry User (wildcard
        #                                `Microsoft.CognitiveServices/*`
        #                                data action — required for
        #                                `accounts/AIServices/agents/read`
        #                                + `projects/{name}/storage/*`.
        #                                Azure AI Developer is NOT enough;
        #                                its dataActions are scoped to
        #                                OpenAI/Speech/ContentSafety/MaaS).
        #   2. blueprint           - the Entra app used by Azure Bot Service
        #                            to call the agent's activity protocol
        #                            endpoint (the "msaAppId" on the bot).
        #                            Without this grant, Teams messages
        #                            silently fail because Bot Service can't
        #                            authenticate to the agent. Needs:
        #                              - Cognitive Services User
        # Idempotent: tolerates RoleAssignmentExists. Works for ANY agent
        # discovered in the matrix — nothing here is hard-coded per-agent.
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          AGENT="${{ matrix.agent }}"
          AI_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)

          # Fetch agent metadata with retries — the Foundry endpoint occasionally
          # resets the connection (curl exit 35) right after a deploy. The role
          # grants below are idempotent and re-applied on every deploy, so if the
          # metadata still can't be fetched after retries we warn and skip rather
          # than failing the whole deploy (the container is already live).
          AGENT_JSON=""
          for attempt in 1 2 3 4 5; do
            if AGENT_JSON=$(curl -sf \
              -H "Authorization: Bearer $AI_TOKEN" \
              -H "Foundry-Features: AgentEndpoints=V1Preview,HostedAgents=V1Preview" \
              "${PROJECT_ENDPOINT}/agents/${AGENT}?api-version=2025-11-15-preview"); then
              break
            fi
            echo "::warning::Could not fetch ${AGENT} metadata for role grants (attempt ${attempt}); retrying…"
            AGENT_JSON=""
            sleep $((attempt * 5))
          done
          if [ -z "$AGENT_JSON" ]; then
            echo "::warning::Skipping ${AGENT} role grants — agent metadata unavailable after retries (grants are idempotent and re-applied on the next deploy)."
            exit 0
          fi

          # Use principal_id (Entra object id) directly — skips MS Graph entirely.
          # Foundry-managed identities aren't always queryable via `az ad sp show`
          # by appId from the CI SP token (which lacks directory read permissions
          # outside the SPs it owns). `principal_id` from the agent metadata is
          # the authoritative object id and is all `az role assignment create`
          # needs alongside `--assignee-principal-type ServicePrincipal`.
          INSTANCE_PRINCIPAL_ID=$(printf '%s' "$AGENT_JSON" | jq -r '.versions.latest.instance_identity.principal_id // .instance_identity.principal_id // empty')
          BLUEPRINT_PRINCIPAL_ID=$(printf '%s' "$AGENT_JSON" | jq -r '.versions.latest.blueprint.principal_id // .blueprint.principal_id // empty')

          ACCOUNT_ID=$(azd env get-value AZURE_AI_ACCOUNT_ID)
          # Role IDs (stable across tenants)
          COGNITIVE_SERVICES_USER="a97b65f3-24c7-4388-baec-2e87135dc908"
          FOUNDRY_USER="53ca6127-db72-4b80-b1b0-d745d6d5456d"

          grant() {
            local label="$1" principal_id="$2" role_id="$3" role_name="$4"
            if [ -z "$principal_id" ]; then
              echo "::warning::No ${label} principal_id discovered — skipping ${role_name}."
              return 0
            fi
            echo "Granting ${role_name} to ${label} (principal ${principal_id})…"
            local out
            out=$(az role assignment create \
              --assignee-object-id "$principal_id" \
              --assignee-principal-type ServicePrincipal \
              --role "$role_id" \
              --scope "$ACCOUNT_ID" 2>&1) || true
            if printf '%s' "$out" | grep -qiE 'RoleAssignmentExists|already exists'; then
              echo "::notice::${label}: ${role_name} already assigned."
            elif printf '%s' "$out" | grep -q '"principalId"'; then
              echo "::notice::${label}: granted ${role_name}."
            else
              echo "::warning::${label}: ${role_name} assignment may have failed: $out"
            fi
          }

          # instance_identity needs both roles so the agent can call the
          # model AND serve project-endpoint reads from the Playground.
          grant "instance_identity" "$INSTANCE_PRINCIPAL_ID" "$COGNITIVE_SERVICES_USER" "Cognitive Services User"
          grant "instance_identity" "$INSTANCE_PRINCIPAL_ID" "$FOUNDRY_USER" "Foundry User"
          # blueprint only needs Cognitive Services User for Bot Service auth.
          grant "blueprint" "$BLUEPRINT_PRINCIPAL_ID" "$COGNITIVE_SERVICES_USER" "Cognitive Services User"
        timeout-minutes: 3

      - name: Ensure agent endpoint protocols + auth scheme for ${{ matrix.agent }}
        # Runs on EVERY deploy (not just publish) because `azd deploy` can
        # reset an agent's `agent_endpoint.protocols` to `["responses"]` only.
        # When that happens, Bot Service POSTs to `/protocols/activityprotocol`
        # land on a 404 and Teams / Web Chat silently hang. This step enforces
        # the right shape for the matrix agent so any future agent added to
        # agents/<name>/ is wired up automatically — no per-agent config.
        # The script is idempotent: it no-ops when both:
        #   1. authorization_schemes == ["BotServiceRbac"]
        #   2. "activity" in protocols
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          python -m pip install --quiet azure-identity requests
          python3 scripts/patch_agent_endpoint.py
        timeout-minutes: 3

      - name: Smoke test (invoke ${{ matrix.agent }})
        if: github.event_name != 'workflow_dispatch' || inputs.smoke_test == true
        env:
          AGENT: ${{ matrix.agent }}
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          # NOTE: this smoke test deliberately does NOT round-trip through
          # the agent container. The endpoint-scoped Responses bridge
          # (POST .../agents/<a>/endpoint/protocols/openai/responses)
          # now requires the agent to declare `responses` v1.0.0 in
          # `container_protocol_versions`. Our hosted agents only declare
          # `activity_protocol/v1` because the primary surface is M365 AI
          # Teammate, where the bridge is bypassed entirely (Foundry
          # delivers Bot Framework Activities directly to /api/messages
          # in the container — see agents/<a>/activity_protocol.py).
          # See docs/AI_TEAMMATE.md and agents/rhodes/agent.yaml for the
          # long-form rationale on the protocol-declaration tradeoff.
          #
          # Until Foundry decouples the bridge from the declaration, the
          # best safe post-deploy check we can run from CI is:
          #
          #   1. GET /agents/<name> succeeds (Foundry control plane sees
          #      the new agent definition).
          #   2. versions.latest.status == "active" (deployment landed,
          #      the new container image was accepted).
          #   3. The image referenced by the latest version is a digest
          #      from this account's ACR (sanity check that azd deploy
          #      pushed a new image, not that Foundry re-used a stale one).
          #
          # Real end-to-end coverage of the container path is exercised
          # by post-deploy evals (.github/workflows/evals.yml) and by
          # manual "what can you do?" testing in Teams against a hire.
          set +e
          set -u
          echo "Smoke-testing ${AGENT} via Foundry control plane…"
          attempt=0
          max_attempts=8
          # Separate, shorter budget for the tertiary image-digest sanity check:
          # a freshly-created version can be "active" before the control plane
          # surfaces its ACR digest, so poll a few times before giving up on it.
          img_polls=0
          max_img_polls=6
          while : ; do
            attempt=$((attempt + 1))
            echo "::group::Smoke attempt ${attempt}/${max_attempts}"
            TOKEN="$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)"
            URL="${PROJECT_ENDPOINT%/}/agents/${AGENT}?api-version=2025-11-15-preview"
            http_status="$(
              curl -sS -o /tmp/smoke.body -w '%{http_code}' \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Foundry-Features: HostedAgents=V1Preview,AgentEndpoints=V1Preview" \
                "$URL"
            )"
            curl_exit=$?
            echo "http_status=${http_status} curl_exit=${curl_exit}"
            # Summarize body for the log without dumping the whole thing
            jq -r '
              .versions.latest as $v |
              "version: \($v.version)\nstatus : \($v.status)\nimage  : \($v.definition.image)"
            ' /tmp/smoke.body 2>/dev/null || { echo "body not JSON:"; head -c 1000 /tmp/smoke.body; echo; }
            echo "::endgroup::"
            if [ "$http_status" = "401" ] || [ "$http_status" = "403" ] \
               || grep -qiE 'PermissionDenied|Principal does not have access|insufficient.*permission' /tmp/smoke.body; then
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Agent ${AGENT} still returning ${http_status} after ${max_attempts} attempts. Dumping role assignments on the AI account…"
                ACCOUNT_ID="$(azd env get-value AZURE_AI_ACCOUNT_ID 2>/dev/null || true)"
                if [ -n "$ACCOUNT_ID" ]; then
                  echo "::group::Role assignments at ${ACCOUNT_ID}"
                  az role assignment list --scope "$ACCOUNT_ID" --include-inherited -o table 2>&1 || true
                  echo "::endgroup::"
                fi
                exit 1
              fi
              echo "::notice::Attempt ${attempt}/${max_attempts} hit ${http_status} — sleeping 30s for RBAC propagation…"
              sleep 30
              continue
            fi
            if [ "$curl_exit" -ne 0 ] || [ "$http_status" != "200" ]; then
              echo "::error::Agent ${AGENT} GET returned HTTP ${http_status} (curl_exit=${curl_exit})"
              exit 1
            fi
            # Validate the agent definition shape now that we have it.
            STATUS="$(jq -r '.versions.latest.status // ""' /tmp/smoke.body)"
            VERSION="$(jq -r '.versions.latest.version // ""' /tmp/smoke.body)"
            # The ACR digest has surfaced under .definition.image historically;
            # fall back to a couple of alternate paths in case the control-plane
            # response shape shifts.
            IMAGE="$(jq -r '
              .versions.latest as $v |
              ( $v.definition.image
                // $v.image
                // $v.definition.deployment.image
                // "" )
            ' /tmp/smoke.body)"
            if [ "$STATUS" != "active" ]; then
              echo "::error::Agent ${AGENT} latest version status is '${STATUS}', expected 'active'"
              exit 1
            fi
            # Tertiary sanity check: the latest version should reference an ACR
            # digest. When the field IS present, enforce it strictly (a non-ACR
            # or non-digest ref means azd pushed the wrong image). When it's
            # empty, the deploy still substantively succeeded — azd already
            # reported the container was packaged, published and the version
            # reached "active" above — but the control plane can lag in
            # surfacing the digest on a freshly-created version (and
            # non-container / prompt-agent versions legitimately have no image).
            # Poll a few times for it to appear, then downgrade to a warning
            # rather than failing an otherwise-healthy deploy. Real container-
            # path coverage comes from the post-deploy evals workflow.
            if [ -n "$IMAGE" ]; then
              case "$IMAGE" in
                *.azurecr.io/*@sha256:*)
                  echo "::notice::Agent ${AGENT} v${VERSION} is active (image $(echo "$IMAGE" | sed 's/.*@sha256:/sha256:/' | cut -c1-30)…)"
                  break
                  ;;
                *)
                  echo "::error::Agent ${AGENT} latest image is present but not an ACR digest ref: '${IMAGE}'"
                  exit 1
                  ;;
              esac
            fi
            if [ "$img_polls" -lt "$max_img_polls" ]; then
              img_polls=$((img_polls + 1))
              echo "::notice::Agent ${AGENT} v${VERSION} is active but the control plane hasn't surfaced an image digest yet (poll ${img_polls}/${max_img_polls}) — sleeping 15s…"
              sleep 15
              continue
            fi
            echo "::warning::Agent ${AGENT} v${VERSION} is active (control plane 200) but never surfaced an ACR image digest (image field empty) after ${max_img_polls} polls. Treating as a soft pass: azd reported the container was packaged, published and the version reached active. Container-path is covered by post-deploy evals."
            break
          done
        timeout-minutes: 8

      # Post-deploy evals run from .github/workflows/evals.yml on a schedule
      # (and can be triggered manually there). They intentionally do not run
      # in this workflow to keep deploys fast and to keep eval failures from
      # blocking deploys.

      - name: Tail recent logs on failure
        if: failure()
        run: |
          echo "=== console logs ==="
          azd ai agent monitor "${{ matrix.agent }}" --type console --tail 200 --no-prompt 2>&1 || true
          echo "=== system logs ==="
          azd ai agent monitor "${{ matrix.agent }}" --type system --tail 200 --no-prompt 2>&1 || true

      - name: Provision Bot Service + Teams channel for ${{ matrix.agent }}
        # Opt-in. Reads agents/<name>/publish.yaml as the trigger marker.
        # Creates the Azure Bot Service backed by the agent's blueprint app
        # and enables the Microsoft Teams channel. SP auth is sufficient —
        # this is pure ARM, no user-context required.
        #
        # Listing in the Microsoft 365 Copilot agent store is a separate
        # step (`make publish AGENT=<name>` from a developer laptop).
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          AGENT_NAME: ${{ matrix.agent }}
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
          PUBLISH_CONFIG: agents/${{ matrix.agent }}/publish.yaml
        run: |
          set -euo pipefail
          if [ ! -f "$PUBLISH_CONFIG" ]; then
            echo "::notice::No $PUBLISH_CONFIG — skipping bot provisioning."
            exit 0
          fi

          ACCOUNT_NAME="$(azd env get-value AZURE_AI_ACCOUNT_NAME)"
          PROJECT_NAME="$(azd env get-value AZURE_AI_PROJECT_NAME)"
          RESOURCE_GROUP="$(azd env get-value AZURE_RESOURCE_GROUP)"

          AI_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
          AGENT_JSON=""
          for attempt in 1 2 3 4 5; do
            if AGENT_JSON=$(curl -sf \
              -H "Authorization: Bearer $AI_TOKEN" \
              -H "Foundry-Features: AgentEndpoints=V1Preview,HostedAgents=V1Preview" \
              "${PROJECT_ENDPOINT}/agents/${AGENT_NAME}?api-version=2025-11-15-preview"); then
              break
            fi
            echo "::warning::Could not fetch ${AGENT_NAME} metadata (attempt ${attempt}); retrying…"
            AGENT_JSON=""
            sleep $((attempt * 5))
          done
          if [ -z "$AGENT_JSON" ]; then
            echo "::error::Agent '${AGENT_NAME}' metadata unavailable after retries."
            exit 1
          fi

          MSA_APP_ID=$(printf '%s' "$AGENT_JSON" | jq -r '.versions.latest.instance_identity.client_id // .instance_identity.client_id // empty')
          if [ -z "$MSA_APP_ID" ]; then
            echo "::error::Agent '${AGENT_NAME}' has no instance_identity.client_id yet."
            exit 1
          fi
          echo "Instance identity app id (bot msaAppId): $MSA_APP_ID"

          # Ensure the agent endpoint advertises activity + responses protocols
          # but ONLY the BotServiceRbac authorization scheme. Defensive re-run
          # of the same enforcement the "Ensure agent endpoint…" step does on
          # every deploy — kept here so a publish-only re-run can self-heal a
          # regression even if the earlier step was skipped (e.g. resumed run).
          # The script is idempotent.
          python -m pip install --quiet azure-identity requests
          AGENT_NAME="$AGENT_NAME" PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
            python3 scripts/patch_agent_endpoint.py

          DEPLOYMENT_NAME="bot-${AGENT_NAME}-$(date +%s)"
          # Idempotent ensure: skips when a bot for this agent already exists.
          AGENT_NAME="$AGENT_NAME" \
          PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
          ACCOUNT_NAME="$ACCOUNT_NAME" \
          PROJECT_NAME="$PROJECT_NAME" \
          RESOURCE_GROUP="$RESOURCE_GROUP" \
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)" \
          python3 scripts/ensure_bot_service.py

          # Third ARM op the portal's publish flow does — registers the agent
          # in the Foundry project's `applications/` collection so it appears
          # in the Teams "Built for your org" catalog. Without this the agent
          # only shows in the M365 admin registry, not Teams.
          AGENT_NAME="$AGENT_NAME" \
          ACCOUNT_NAME="$ACCOUNT_NAME" \
          PROJECT_NAME="$PROJECT_NAME" \
          RESOURCE_GROUP="$RESOURCE_GROUP" \
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)" \
          python3 scripts/ensure_foundry_application.py
        timeout-minutes: 10

      # M365 / Teams listing and OAuth2 admin-consent grants are intentionally
      # not run from this workflow. They require a user-delegated token (and
      # Application Administrator for grants) that the CI service principal
      # cannot satisfy. Run `make publish <agent>` from a developer laptop.

  # ---------------------------------------------------------------------------
  # Reconcile drift after hosted deployment. Prompt-agent deployment is not part
  # of the current Forge evidence path; the four evidence experts are hosted
  # agents in the deploy matrix. This job prunes Foundry agents this repo no
  # longer declares only when prune_unmanaged_agents=true.
  #
  # After the expected agents are deployed it
  # prunes Foundry agents this repo no longer declares (e.g. historical canary
  # prompt agents, retired lineage agents, or renamed/removed agents). By
  # default it only REPORTS drift; set prune_unmanaged_agents=true (dispatch or
  # workflow_call) to actually delete.
  # ---------------------------------------------------------------------------
  reconcile-foundry-agents:
    name: Reconcile Foundry agents + tool connections
    needs: [provision, deploy]
    # Run on push / dispatch / workflow_call (never on pull_request — that path
    # is read-only). Proceed whether the deploy matrix ran or was skipped
    # (an infra-only change still benefits from drift reporting), as long as
    # provision and deploy did not FAIL.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.provision.result == 'success' || needs.provision.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          repository: caldova/waypoint
          ref: ${{ inputs.source_ref || github.ref }}
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Azure login (OIDC)
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Hydrate Foundry project endpoint
        id: endpoint
        # Same proven discovery the deploy/provision jobs use: read the latest
        # succeeded azd sub-deployment for THIS env and pull the project
        # endpoint output. The ^<env>-[0-9]+$ regex (NOT starts_with) keeps env
        # isolation between sibling envs whose names share a prefix — see the
        # long-form rationale on the deploy job's hydrate step.
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?properties.provisioningState=='Succeeded'].{name:name, ts:properties.timestamp}" \
            -o json \
            | jq -r --arg env "$AZD_ENV_NAME" '
                map(select(.name | test("^" + $env + "-[0-9]+$")))
                | sort_by(.ts)
                | last
                | .name // empty
              ')
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment matching '^${AZD_ENV_NAME}-[0-9]+$'. Run with provision=true first."
            exit 1
          fi
          # ARM lowercases all but the last char of the first underscore token
          # in output names, so match case-insensitively on the upper-cased key.
          ENDPOINT=$(az deployment sub show --name "$DEPLOYMENT" \
            --query "properties.outputs" -o json \
            | jq -r 'to_entries[]
                     | select((.key | ascii_upcase) == "AZURE_AI_PROJECT_ENDPOINT")
                     | .value.value' \
            | head -n1)
          if [ -z "$ENDPOINT" ] || printf '%s' "$ENDPOINT" | grep -qi 'not found'; then
            echo "::error::Deployment '$DEPLOYMENT' has no AZURE_AI_PROJECT_ENDPOINT output."
            exit 1
          fi
          echo "Endpoint: $ENDPOINT"
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      - name: Reconcile Foundry agents + tool connections (drift cleanup)
        # Always run so drift is at least reported. Deletes only when
        # prune_unmanaged_agents=true;
        # otherwise dry-run report. Prunes both retired agents AND their orphaned
        # RemoteTool connections (an agent's MCP "tools" outlive the agent).
        # reconcile_agents.py refuses to act if the repo-managed set comes back
        # empty (guards against nuking the project), only ever deletes RemoteTool
        # connections that are referenced nowhere in the repo, and needs ARM
        # delete rights on the project for connection cleanup (covered by the
        # deploy identity's Contributor/Cognitive Services Contributor role).
        if: always() && steps.endpoint.outputs.endpoint != ''
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          python -m pip install --quiet requests azure-identity "prompty==2.0.0b2"
          if [ "${{ inputs.prune_unmanaged_agents }}" = "true" ]; then
            echo "prune_unmanaged_agents=true — deleting drift."
            python scripts/reconcile_agents.py --project-endpoint "$PROJECT_ENDPOINT" --apply
          else
            echo "prune_unmanaged_agents not set — dry-run report only."
            python scripts/reconcile_agents.py --project-endpoint "$PROJECT_ENDPOINT" --dry-run
          fi
        timeout-minutes: 5

name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]
    paths:
      - "agents/**"
      - "evals/**"
      - "infra/**"
      - "azure.yaml"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static repo validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --quiet pyyaml "prompty==2.0.0b2"

      - name: Compile Python sources
        run: python -m compileall -q agents scripts evals

      - name: Validate agents, evals, and azure.yaml
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          import yaml

          root = Path(".")
          agents_dir = root / "agents"
          # Each entry is a set of alternatives — at least one must exist.
          required_agent_files: list[set[str]] = [
              {"agent.yaml"},
              # Flat main.py OR Carson-style src/<name>/__main__.py
              {"main.py"},
              # requirements.txt (legacy) OR pyproject.toml (uv-managed)
              {"requirements.txt", "pyproject.toml"},
              {"Dockerfile"},
          ]

          azure = yaml.safe_load((root / "azure.yaml").read_text(encoding="utf-8"))
          services = azure.get("services", {})
          errors = []
          warnings = []

          discoverable_agents = []
          def prompt_deployment(agent_dir):
             prompt = agent_dir / "prompt.md"
             if not prompt.is_file():
                 return {}
             text = prompt.read_text(encoding="utf-8")
             if not text.startswith("---"):
                 return {}
             _, _, rest = text.partition("---")
             frontmatter, sep, _ = rest.partition("\n---")
             if not sep:
                 return {}
             data = yaml.safe_load(frontmatter) or {}
             return (
                 data.get("metadata", {})
                 .get("forge", {})
                 .get("deployment", {})
             )

          for agent_dir in sorted(agents_dir.iterdir()):
              if not agent_dir.is_dir() or agent_dir.name.startswith((".", "_")):
                  continue

              missing = []
              for alternatives in required_agent_files:
                  # "main.py" has a special alternative: src/<agent>/__main__.py
                  extended = set(alternatives)
                  if "main.py" in alternatives:
                      extended.add(f"src/{agent_dir.name}/__main__.py")
                  if not any((agent_dir / f).is_file() for f in extended):
                      missing.append(" or ".join(sorted(alternatives)))
              if missing:
                  warnings.append(
                      f"Skipping agents/{agent_dir.name}; missing discover-agent required files: "
                      f"{', '.join(missing)}"
                  )
                  continue

              discoverable_agents.append(agent_dir.name)
              agent_yaml = yaml.safe_load((agent_dir / "agent.yaml").read_text(encoding="utf-8"))
              if agent_yaml.get("name") != agent_dir.name:
                  errors.append(
                      f"agents/{agent_dir.name}/agent.yaml name must be '{agent_dir.name}', "
                      f"got {agent_yaml.get('name')!r}"
                  )

              deployment = prompt_deployment(agent_dir)
              hosted = deployment.get("hosted", {})
              hosted_enabled = not (isinstance(hosted, dict) and hosted.get("enabled") is False)
              service = services.get(agent_dir.name)
              if hosted_enabled:
                  if not service:
                      errors.append(f"azure.yaml is missing hosted service '{agent_dir.name}'")
                      continue
                  expected_project = f"./agents/{agent_dir.name}"
                  if service.get("project") != expected_project:
                      errors.append(
                          f"azure.yaml service '{agent_dir.name}' project must be {expected_project!r}, "
                          f"got {service.get('project')!r}"
                      )
              elif service:
                  errors.append(
                      f"azure.yaml still has service '{agent_dir.name}', but prompt.md disables hosted deployment"
                  )

          for service_name, service in sorted(services.items()):
              project = service.get("project", "")
              if isinstance(project, str) and project.startswith("./agents/"):
                  agent_name = project.removeprefix("./agents/")
                  if agent_name not in discoverable_agents:
                      warnings.append(
                          f"azure.yaml service '{service_name}' points at non-discoverable agent {project!r}"
                      )

          for cases_path in sorted((root / "evals" / "cases").glob("*.jsonl")):
              for line_number, raw_line in enumerate(cases_path.read_text(encoding="utf-8").splitlines(), 1):
                  if not raw_line.strip():
                      continue
                  try:
                      case = json.loads(raw_line)
                  except json.JSONDecodeError as exc:
                      errors.append(f"{cases_path}:{line_number} invalid JSON: {exc}")
                      continue
                  for key in ("id", "category", "prompt", "checks"):
                      if key not in case:
                          errors.append(f"{cases_path}:{line_number} missing required key: {key}")

          if errors:
              for warning in warnings:
                  print(f"::warning::{warning}")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          for warning in warnings:
              print(f"::warning::{warning}")
          print(f"Validated {len(discoverable_agents)} agents")
          PY

      - name: Validate prompt-agent replacement plan
        run: python scripts/prompt_agent_plan.py --check

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Completing sign-in</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #fff;
      }
      p {
        margin: 0;
        padding: 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <!--
      MSAL popup and hidden-iframe redirect target. Served in production at
      /auth/msal/callback by server.js instead of the full app route, so token
      renewal only loads this page and the 6 KB redirect bridge.
    -->
    <p id="message">Completing sign-in…</p>
    <script src="/msal-redirect-bridge.js"></script>
    <script>
      (function () {
        var message = document.getElementById("message");
        // Mirrors the app's locale choice: waypoint_lang cookie, then browser language.
        var strings = {
          en: {
            signingIn: "Completing sign-in…",
            signedOut: "Sign-out is complete. You can close this window.",
            failed: "Unable to complete sign-in. Close this window and try again.",
          },
          es: {
            signingIn: "Completando el inicio de sesión…",
            signedOut: "Se cerró la sesión. Puedes cerrar esta ventana.",
            failed: "No se pudo completar el inicio de sesión. Cierra esta ventana y vuelve a intentarlo.",
          },
        };
        var cookie = document.cookie.match(/(?:^|;\s*)waypoint_lang=([^;]+)/);
        var lang = ((cookie && cookie[1]) || navigator.language || "en").slice(0, 2).toLowerCase();
        var text = strings[lang] || strings.en;
        document.documentElement.lang = strings[lang] ? lang : "en";
        document.title = text.signingIn.replace("…", "");
        message.textContent = text.signingIn;
        var query = new URLSearchParams(window.location.search);
        var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var hasAuthResponse =
          query.has("code") || query.has("error") || hash.has("code") || hash.has("error");

        try {
          window.sessionStorage.removeItem("waypoint:msal:logout-popup");
        } catch (error) {
          // Storage can be unavailable in some embedded contexts.
        }

        if (!hasAuthResponse) {
          message.textContent = text.signedOut;
          window.close();
          return;
        }

        if (!window.msalRedirectBridge) {
          message.textContent = text.failed;
          return;
        }

        Promise.resolve(window.msalRedirectBridge.broadcastResponseToMainFrame()).catch(
          function () {
            message.textContent = text.failed;
          },
        );
      })();
    </script>
  </body>
</html>

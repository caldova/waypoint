name: Deploy waypoint-agent

# Deploys the single castia-based waypoint-agent to the caldova Foundry project.
# The app (web/API/PostgreSQL) is deployed separately and is not part of this
# workflow yet. Requires repo variables AZURE_CLIENT_ID, AZURE_TENANT_ID, and
# AZURE_SUBSCRIPTION_ID wired for GitHub-to-Azure OIDC.

on:
  workflow_dispatch:
    inputs:
      provision:
        description: Run `azd provision` first (needed on the first run or after infra changes).
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-waypoint-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: ${{ vars.AZD_ENV_NAME || 'caldova' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westus' }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy-agent:
    name: Deploy waypoint-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/setup-azd@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Select or create azd environment
        run: |
          azd env select "$AZURE_ENV_NAME" 2>/dev/null || \
            azd env new "$AZURE_ENV_NAME" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --location "$AZURE_LOCATION"
        env:
          AZURE_DEV_USER_AGENT: waypoint-ci

      - name: Provision Foundry resources
        if: ${{ inputs.provision }}
        run: azd provision --no-prompt
        env:
          AZURE_DEV_USER_AGENT: waypoint-ci

      - name: Reconcile agent protocols
        working-directory: modules/agents/agents/waypoint-agent
        run: |
          uv sync --frozen
          uv run castia deploy

      - name: Deploy the agent
        run: azd deploy waypoint-agent --no-prompt
        env:
          AZURE_DEV_USER_AGENT: waypoint-ci

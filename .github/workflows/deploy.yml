name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      deploy_app:
        description: Deploy the Waypoint web/API application.
        required: false
        type: boolean
        default: true
      deploy_agents:
        description: Deploy the full hosted agent suite.
        required: false
        type: boolean
        default: true
      provision_agents:
        description: >-
          Run azd provision for the Foundry agent project before deploying agents. Required for
          first runs and infra changes; safe to set false when only agent code changed.
        required: false
        type: boolean
        default: true
      force_full:
        description: Ignore source impact detection and run every enabled deployment stage.
        required: false
        type: boolean
        default: false
      deployment_base_sha:
        description: >-
          Optional known-good deployment SHA override. Normally read from deployment state.
        required: false
        type: string
        default: ''
      seed_data:
        description: Generate and import the Waypoint seed after the app deploys.
        required: false
        type: boolean
        default: true
      fabric_provision_enabled:
        description: >-
          Provision Fabric/OneLake capacity, workspace, and lakehouse for the Waypoint data path.
          This is independent of the hosted-agent fleet.
        required: false
        type: boolean
        default: true
      workiq_enabled:
        description: >-
          Opt in to the WorkIQ expert. Disabled by default while its tenant-specific
          Microsoft 365 deployment path is completed.
        required: false
        type: boolean
        default: false
      webiq_enabled:
        description: >-
          Opt in to the WebIQ expert. Disabled by default while its connection and
          deployment path is completed.
        required: false
        type: boolean
        default: false
      foundryiq_enabled:
        description: >-
          Enable the FoundryIQ fan-out lane in Assurance Orchestrator. Requires the
          contracts-kb knowledge-base MCP connection to be present in the Foundry project.
        required: false
        type: boolean
        default: true
      fabriciq_enabled:
        description: >-
          Opt in to the FabricIQ expert. Disabled by default while its Fabric Data
          Agent connection and deployment path is completed.
        required: false
        type: boolean
        default: false
      azd_env_name:
        description: >-
          azd environment name for the Foundry agents. Also scopes the Key Vault name so
          parallel environments in the same subscription never share a vault.
        required: false
        type: string
        default: waypoint-agents
      # ── Parallel-environment overrides ────────────────────────────────────────────────
      # Supply any of these to run a fully independent, non-destructive parallel environment.
      # Omit all of them for the default standalone deployment (backwards compatible).
      azure_location:
        description: >-
          Azure region override. Falls back to the AZURE_LOCATION repo var or swedencentral.
        required: false
        type: string
        default: ''
      app_resource_group:
        description: >-
          App resource group for the Waypoint/Aspire deployment. Falls back to the
          AZURE_RESOURCE_GROUP repo var or rg-waypoint. The app RG is passed to Aspire;
          the Key Vault is always created in the state RG.
        required: false
        type: string
        default: ''
      state_resource_group:
        description: >-
          Separate state resource group for the deployment Key Vault. Must differ from the
          app RG. Falls back to AZURE_STATE_RESOURCE_GROUP repo var or rg-waypoint-state.
        required: false
        type: string
        default: ''
      key_vault_name:
        description: >-
          Override the deployment Key Vault name. When empty, derived as
          kv-waypoint-<env+sub-hash> so parallel environments in one subscription never
          collide on the same vault.
        required: false
        type: string
        default: ''
      msal_display_name:
        description: >-
          Waypoint MSAL app registration display name. Falls back to the
          WAYPOINT_MSAL_DISPLAY_NAME repo var or 'waypoint'. Supply a unique name for
          parallel environments that need independent MSAL registrations.
        required: false
        type: string
        default: ''
      postgres_server_name:
        description: >-
          PostgreSQL Flexible Server name override. Falls back to the
          WAYPOINT_POSTGRES_SERVER_NAME repo var or a subscription-hash derived name.
          Supply a unique name for parallel environments to avoid reusing an existing server.
        required: false
        type: string
        default: ''
      fabric_capacity_name:
        description: >-
          Fabric capacity name override. Falls back to WAYPOINT_FABRIC_CAPACITY_NAME repo
          var or the Aspire default 'waypointcorpus'. Supply a unique name for parallel
          Fabric environments.
        required: false
        type: string
        default: ''
      fabric_workspace_name:
        description: >-
          Fabric workspace name override. Falls back to WAYPOINT_FABRIC_WORKSPACE_NAME
          repo var or 'waypoint-corpus'.
        required: false
        type: string
        default: ''
      fabric_lakehouse_name:
        description: >-
          Fabric lakehouse name override. Falls back to WAYPOINT_FABRIC_LAKEHOUSE_NAME
          repo var or 'corpus'.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

# Each azd env name gets its own concurrency slot so parallel environments can run
# simultaneously without cancelling each other.
concurrency:
  group: deploy-azure-${{ inputs.azd_env_name || vars.AZD_ENV_NAME || 'waypoint-agents' }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: ${{ inputs.azure_location || vars.AZURE_LOCATION || 'swedencentral' }}
  AZURE_RESOURCE_GROUP: ${{ inputs.app_resource_group || vars.AZURE_RESOURCE_GROUP || 'rg-waypoint' }}
  # Key Vault lives in a dedicated state RG, never the app RG.
  STATE_RESOURCE_GROUP: ${{ inputs.state_resource_group || vars.AZURE_STATE_RESOURCE_GROUP || 'rg-waypoint-state' }}
  AZD_ENV_NAME: ${{ inputs.azd_env_name || vars.AZD_ENV_NAME || 'waypoint-agents' }}

jobs:
  plan:
    name: Plan selective deployment
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.plan.outputs.app }}
      corpus_seed: ${{ steps.plan.outputs.corpus_seed }}
      seed_import: ${{ steps.plan.outputs.seed_import }}
      fabric_infrastructure: ${{ steps.plan.outputs.fabric_infrastructure }}
      onelake_upload: ${{ steps.plan.outputs.onelake_upload }}
      contracts_kb: ${{ steps.plan.outputs.contracts_kb }}
      foundry_infrastructure: ${{ steps.plan.outputs.foundry_infrastructure }}
      deploy_agents: ${{ steps.plan.outputs.deploy_agents }}
      evals: ${{ steps.plan.outputs.evals }}
      optimization: ${{ steps.plan.outputs.optimization }}
      wiring: ${{ steps.plan.outputs.wiring }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
      selected_agents: ${{ steps.plan.outputs.selected_agents }}
      has_deployment_work: ${{ steps.plan.outputs.has_deployment_work }}
      full_deployment: ${{ steps.plan.outputs.full_deployment }}
      mode: ${{ steps.plan.outputs.mode }}
      controls_hash: ${{ steps.state.outputs.controls_hash }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read recorded state and live drift
        id: state
        env:
          BASE_OVERRIDE: ${{ inputs.deployment_base_sha }}
          FABRIC_CAPACITY_NAME: ${{ inputs.fabric_capacity_name || vars.WAYPOINT_FABRIC_CAPACITY_NAME || 'waypointcorpus' }}
          WORKIQ_ENABLED: ${{ inputs.workiq_enabled }}
          WEBIQ_ENABLED: ${{ inputs.webiq_enabled }}
          FOUNDRYIQ_ENABLED: ${{ inputs.foundryiq_enabled }}
          FABRICIQ_ENABLED: ${{ inputs.fabriciq_enabled }}
          DEPLOY_APP: ${{ inputs.deploy_app }}
          DEPLOY_AGENTS: ${{ inputs.deploy_agents }}
          PROVISION_AGENTS: ${{ inputs.provision_agents }}
          SEED_DATA: ${{ inputs.seed_data }}
          FABRIC_PROVISION_ENABLED: ${{ inputs.fabric_provision_enabled }}
        run: |
          set -euo pipefail
          tags="$(az group show --name "$STATE_RESOURCE_GROUP" --query tags -o json 2>/dev/null || echo '{}')"
          recorded_base="$(jq -r '.waypoint_deployment_base_sha // empty' <<<"$tags")"
          base_sha="${BASE_OVERRIDE:-$recorded_base}"
          controls="$(
            printf '%s\n' \
              "deploy_app=${DEPLOY_APP}" \
              "deploy_agents=${DEPLOY_AGENTS}" \
              "provision_agents=${PROVISION_AGENTS}" \
              "seed_data=${SEED_DATA}" \
              "fabric_provision_enabled=${FABRIC_PROVISION_ENABLED}" \
              "workiq=${WORKIQ_ENABLED}" \
              "webiq=${WEBIQ_ENABLED}" \
              "foundryiq=${FOUNDRYIQ_ENABLED}" \
              "fabriciq=${FABRICIQ_ENABLED}" \
              | sha256sum | cut -d' ' -f1
          )"
          recorded_controls="$(jq -r '.waypoint_deployment_controls_hash // empty' <<<"$tags")"
          jq -n \
            --arg base "$base_sha" \
            --arg base_override "$BASE_OVERRIDE" \
            --argjson initialized "$([ -n "$base_sha" ] && echo true || echo false)" \
            --arg controls "$controls" \
            --arg recorded_controls "$recorded_controls" \
            '{
              base_sha: (if $base == "" then null else $base end),
              initialized: (
                $initialized
                and (
                  $base_override != ""
                  or (
                    $recorded_controls != ""
                    and $controls == $recorded_controls
                  )
                )
              ),
              stages: {}
            }' > deployment-state.json
          echo "controls_hash=$controls" >> "$GITHUB_OUTPUT"

          jq -n '{stages: {}, agents: {}}' > live-drift.json
          if ! az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" -o none 2>/dev/null \
            || ! az containerapp show --name web --resource-group "$AZURE_RESOURCE_GROUP" -o none 2>/dev/null; then
            jq '.stages.app = {drifted: true}' live-drift.json > live-drift.tmp
            mv live-drift.tmp live-drift.json
          fi
          if [ "${{ inputs.fabric_provision_enabled }}" = "true" ] \
            && ! az resource show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --resource-type Microsoft.Fabric/capacities \
              --name "$FABRIC_CAPACITY_NAME" -o none 2>/dev/null; then
            jq '.stages.fabric_infrastructure = {drifted: true}' live-drift.json > live-drift.tmp
            mv live-drift.tmp live-drift.json
          fi

          deployment="$(
            az deployment sub list \
              --query "[?properties.provisioningState=='Succeeded'].name" -o tsv 2>/dev/null \
              | grep -E "^${AZD_ENV_NAME}-[0-9]+$" | tail -1 || true
          )"
          if [ "${{ inputs.deploy_agents }}" = "true" ] && [ -z "$deployment" ]; then
            jq '.stages.foundry_infrastructure = {drifted: true}' live-drift.json > live-drift.tmp
            mv live-drift.tmp live-drift.json
          fi

      - name: Build deployment plan
        id: plan
        env:
          FORCE_FULL: ${{ inputs.force_full }}
        run: |
          set -euo pipefail
          args=(
            --manifest tools/deploy/deployment.manifest.json
            --repo .
            --head "${{ github.sha }}"
            --state deployment-state.json
            --drift live-drift.json
            --output deployment-plan.json
          )
          if [ "$FORCE_FULL" = "true" ]; then
            args+=(--force-full)
          fi
          python3 tools/deploy/scripts/plan_deployment.py "${args[@]}"

      - name: Summarize manual upper bounds
        run: |
          {
            echo ""
            echo "### Manual deployment controls"
            echo ""
            echo "| Control | Enabled | Effect |"
            echo "| --- | --- | --- |"
            echo "| deploy_app | ${{ inputs.deploy_app }} | Upper bound for app, seed import, wiring, and acceptance |"
            echo "| deploy_agents | ${{ inputs.deploy_agents }} | Upper bound for Foundry, agents, contracts KB, and wiring |"
            echo "| provision_agents | ${{ inputs.provision_agents }} | Upper bound for Foundry infrastructure reconciliation |"
            echo "| seed_data | ${{ inputs.seed_data }} | Upper bound for corpus seed, OneLake upload, and seed import |"
            echo "| fabric_provision_enabled | ${{ inputs.fabric_provision_enabled }} | Upper bound for Fabric and OneLake |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized deployment plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-plan-${{ github.sha }}
          path: deployment-plan.json
          if-no-files-found: error

  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    needs: plan
    outputs:
      azure_client_id: ${{ steps.required.outputs.azure_client_id }}
      azure_tenant_id: ${{ steps.required.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ steps.required.outputs.azure_subscription_id }}
      agent_matrix: ${{ steps.required.outputs.agent_matrix }}
    steps:
      - name: Check required repository variables
        id: required
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          MSAL_DISPLAY_NAME: ${{ inputs.msal_display_name || vars.WAYPOINT_MSAL_DISPLAY_NAME || 'waypoint' }}
          POSTGRES_SERVER_NAME: ${{ inputs.postgres_server_name || vars.WAYPOINT_POSTGRES_SERVER_NAME }}
          FABRIC_CAPACITY_NAME: ${{ inputs.fabric_capacity_name || vars.WAYPOINT_FABRIC_CAPACITY_NAME || 'waypointcorpus' }}
          FABRIC_WORKSPACE_NAME: ${{ inputs.fabric_workspace_name || vars.WAYPOINT_FABRIC_WORKSPACE_NAME || 'waypoint-corpus' }}
          FABRIC_LAKEHOUSE_NAME: ${{ inputs.fabric_lakehouse_name || vars.WAYPOINT_FABRIC_LAKEHOUSE_NAME || 'corpus' }}
          INPUT_APP_RESOURCE_GROUP: ${{ inputs.app_resource_group }}
          INPUT_STATE_RESOURCE_GROUP: ${{ inputs.state_resource_group }}
          INPUT_MSAL_DISPLAY_NAME: ${{ inputs.msal_display_name }}
          INPUT_POSTGRES_SERVER_NAME: ${{ inputs.postgres_server_name }}
          INPUT_FABRIC_CAPACITY_NAME: ${{ inputs.fabric_capacity_name }}
          INPUT_FABRIC_WORKSPACE_NAME: ${{ inputs.fabric_workspace_name }}
          INPUT_FABRIC_LAKEHOUSE_NAME: ${{ inputs.fabric_lakehouse_name }}
          WORKIQ_ENABLED: ${{ inputs.workiq_enabled }}
          WEBIQ_ENABLED: ${{ inputs.webiq_enabled }}
          FABRICIQ_ENABLED: ${{ inputs.fabriciq_enabled }}
          PLANNED_AGENTS: ${{ needs.plan.outputs.selected_agents }}
        run: |
          set -euo pipefail
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables: ${missing[*]}"
            exit 1
          fi
          if [ "$AZURE_RESOURCE_GROUP" = "$STATE_RESOURCE_GROUP" ]; then
            echo "::error::The app and deployment-state resource groups must differ."
            exit 1
          fi
          if [ "$AZD_ENV_NAME" != "waypoint-agents" ]; then
            missing_overrides=()
            [ -z "$INPUT_APP_RESOURCE_GROUP" ] && missing_overrides+=("app_resource_group")
            [ -z "$INPUT_STATE_RESOURCE_GROUP" ] && missing_overrides+=("state_resource_group")
            [ -z "$INPUT_MSAL_DISPLAY_NAME" ] && missing_overrides+=("msal_display_name")
            [ -z "$INPUT_POSTGRES_SERVER_NAME" ] && missing_overrides+=("postgres_server_name")
            if [ "${{ inputs.fabric_provision_enabled }}" = "true" ]; then
              [ -z "$INPUT_FABRIC_CAPACITY_NAME" ] && missing_overrides+=("fabric_capacity_name")
              [ -z "$INPUT_FABRIC_WORKSPACE_NAME" ] && missing_overrides+=("fabric_workspace_name")
              [ -z "$INPUT_FABRIC_LAKEHOUSE_NAME" ] && missing_overrides+=("fabric_lakehouse_name")
            fi
            if [ "${#missing_overrides[@]}" -gt 0 ]; then
              echo "::error::Custom azd environments require explicit isolated inputs for: ${missing_overrides[*]}"
              exit 1
            fi
          fi
          {
            echo "azure_client_id=$AZURE_CLIENT_ID"
            echo "azure_tenant_id=$AZURE_TENANT_ID"
            echo "azure_subscription_id=$AZURE_SUBSCRIPTION_ID"
            enabled_agents='["invoice-analyst","assurance-orchestrator","contract-policy-expert","waypoint-recorder"]'
            if [ "$WORKIQ_ENABLED" = "true" ]; then
              enabled_agents="$(jq -c '. + ["collaboration-evidence-expert"]' <<<"$enabled_agents")"
            fi
            if [ "$WEBIQ_ENABLED" = "true" ]; then
              enabled_agents="$(jq -c '. + ["market-evidence-expert"]' <<<"$enabled_agents")"
            fi
            if [ "$FABRICIQ_ENABLED" = "true" ]; then
              enabled_agents="$(jq -c '. + ["operations-data-expert"]' <<<"$enabled_agents")"
            fi
            agents="$(
              jq -cn \
                --argjson planned "$PLANNED_AGENTS" \
                --argjson enabled "$enabled_agents" \
                '$planned | map(select(. as $agent | $enabled | index($agent)))'
            )"
            echo "agent_matrix=$agents"
          } >> "$GITHUB_OUTPUT"

  keyvault:
    name: Ensure deployment Key Vault
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      key_vault_name: ${{ steps.kv.outputs.kv_name }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Ensure state resource group
        # Key Vault is created in the dedicated state RG, never the app RG.
        run: az group create --name "$STATE_RESOURCE_GROUP" --location "$AZURE_LOCATION" --output none

      - name: Generate-once deployment secrets
        id: kv
        env:
          AZURE_CLIENT_ID: ${{ needs.validate.outputs.azure_client_id }}
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
          INPUT_KEY_VAULT_NAME: ${{ inputs.key_vault_name }}
          DEPLOY_KEY_VAULT_NAME: ${{ vars.DEPLOY_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_KEY_VAULT_NAME:-}" ]; then
            kv_name="$INPUT_KEY_VAULT_NAME"
          elif [ -n "${DEPLOY_KEY_VAULT_NAME:-}" ]; then
            kv_name="$DEPLOY_KEY_VAULT_NAME"
          else
            # Include AZD_ENV_NAME in the hash so parallel environments in the same
            # subscription never collide on the same Key Vault.
            env_sub_hash="$(printf '%s%s' "$AZD_ENV_NAME" "$AZURE_SUBSCRIPTION_ID" | sha256sum | cut -c1-6)"
            kv_name="kv-waypoint-${env_sub_hash}"
          fi
          sp_object_id="$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)"
          KV_NAME="$kv_name" \
            STATE_RG="$STATE_RESOURCE_GROUP" \
            AZURE_LOCATION="$AZURE_LOCATION" \
            SP_OBJECT_ID="$sp_object_id" \
            bash tools/deploy/scripts/keyvault.sh
          echo "kv_name=$kv_name" >> "$GITHUB_OUTPUT"

  msal:
    name: Ensure Waypoint MSAL app
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      msal_tenant_id: ${{ steps.msal.outputs.msal_tenant_id }}
      msal_client_id: ${{ steps.msal.outputs.msal_client_id }}
      msal_writer_app_role: ${{ steps.msal.outputs.msal_writer_app_role }}
      msal_reader_app_role: ${{ steps.msal.outputs.msal_reader_app_role }}
      msal_admin_app_role: ${{ steps.msal.outputs.msal_admin_app_role }}
      msal_allowed_app_ids: ${{ steps.msal.outputs.msal_allowed_app_ids }}
      api_app_id_uri: ${{ steps.msal.outputs.api_app_id_uri }}
      api_default_scope: ${{ steps.msal.outputs.api_default_scope }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Ensure app registration
        id: msal
        env:
          AZURE_TENANT_ID: ${{ needs.validate.outputs.azure_tenant_id }}
          MSAL_CLIENT_ID: ${{ vars.WAYPOINT_MSAL_CLIENT_ID }}
          INPUT_MSAL_DISPLAY_NAME: ${{ inputs.msal_display_name }}
          MSAL_DISPLAY_NAME: ${{ inputs.msal_display_name || vars.WAYPOINT_MSAL_DISPLAY_NAME || 'waypoint' }}
          MSAL_ALLOWED_APP_IDS: ${{ vars.WAYPOINT_MSAL_ALLOWED_APP_IDS }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_MSAL_DISPLAY_NAME" ]; then
            export MSAL_CLIENT_ID=""
          fi
          bash tools/deploy/scripts/msal.sh ensure

  corpus-seed:
    name: Generate Waypoint seed
    runs-on: ubuntu-latest
    if: ${{ inputs.seed_data && needs.plan.outputs.corpus_seed == 'true' }}
    needs: plan
    outputs:
      artifact_name: waypoint-seed
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Generate seed
        working-directory: modules/corpus
        run: |
          uv sync
          uv run ledgerfield generate-waypoint-seed | tee counts.json
          uv run python -m json.tool data/waypoint/waypoint-seed.json > /dev/null

      - name: Upload seed artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: waypoint-seed
          path: |
            modules/corpus/data/waypoint/waypoint-seed.json
            modules/corpus/counts.json
          if-no-files-found: error

  deploy-app:
    name: Deploy Waypoint app
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.deploy_app &&
      needs.plan.outputs.app == 'true' &&
      needs.validate.result == 'success' &&
      needs.keyvault.result == 'success' &&
      needs.msal.result == 'success'
    needs: [plan, validate, keyvault, msal]
    outputs:
      api_fqdn: ${{ steps.outputs.outputs.api_fqdn }}
      web_fqdn: ${{ steps.outputs.outputs.web_fqdn }}
      api_base_url: ${{ steps.outputs.outputs.api_base_url }}
      web_base_url: ${{ steps.outputs.outputs.web_base_url }}
      api_default_scope: ${{ needs.msal.outputs.api_default_scope }}
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      NUGET_XMLDOC_MODE: skip
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Aspire CLI
        run: curl -sSL https://aspire.dev/install.sh | bash

      - name: Add Aspire to PATH
        run: echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Deploy with Aspire
        working-directory: apps/waypoint
        env:
          KEY_VAULT_NAME: ${{ needs.keyvault.outputs.key_vault_name }}
          BUILD_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}
          AZURE_CLIENT_ID: ${{ needs.validate.outputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ needs.validate.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
          Azure__ClientId: ${{ needs.validate.outputs.azure_client_id }}
          Azure__TenantId: ${{ needs.validate.outputs.azure_tenant_id }}
          Azure__SubscriptionId: ${{ needs.validate.outputs.azure_subscription_id }}
          Azure__Location: ${{ env.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          Azure__AllowResourceGroupCreation: true
          Waypoint__ApiKeyAuth__Enabled: true
          Waypoint__Msal__TenantId: ${{ needs.msal.outputs.msal_tenant_id }}
          Waypoint__Msal__ClientId: ${{ needs.msal.outputs.msal_client_id }}
          Waypoint__Msal__WriterAppRole: ${{ needs.msal.outputs.msal_writer_app_role }}
          Waypoint__Msal__ReaderAppRole: ${{ needs.msal.outputs.msal_reader_app_role }}
          Waypoint__Msal__AdminAppRole: ${{ needs.msal.outputs.msal_admin_app_role }}
          Waypoint__Msal__AllowedAppIds: ${{ needs.msal.outputs.msal_allowed_app_ids }}
          Waypoint__Postgres__ProvisionEnabled: true
          Waypoint__Postgres__ServerName: ${{ inputs.postgres_server_name || vars.WAYPOINT_POSTGRES_SERVER_NAME }}
          Waypoint__Postgres__FirewallRulesJson: ${{ vars.WAYPOINT_POSTGRES_FIREWALL_RULES_JSON || '[{"name":"AllowAllAzureServicesAndResourcesWithinAzureIps","startIpAddress":"0.0.0.0","endIpAddress":"0.0.0.0"}]' }}
          Waypoint__Fabric__ProvisionEnabled: ${{ inputs.fabric_provision_enabled }}
          Waypoint__Fabric__SkuName: ${{ vars.WAYPOINT_FABRIC_SKU_NAME || 'F2' }}
          Waypoint__Fabric__AdministratorMembersJson: ${{ vars.WAYPOINT_FABRIC_ADMIN_MEMBERS_JSON || '[]' }}
          Waypoint__Fabric__CapacityName: ${{ inputs.fabric_capacity_name || vars.WAYPOINT_FABRIC_CAPACITY_NAME }}
          Waypoint__Fabric__WorkspaceName: ${{ inputs.fabric_workspace_name || vars.WAYPOINT_FABRIC_WORKSPACE_NAME || 'waypoint-corpus' }}
          Waypoint__Fabric__LakehouseName: ${{ inputs.fabric_lakehouse_name || vars.WAYPOINT_FABRIC_LAKEHOUSE_NAME || 'corpus' }}
          # Fabric storage remains independently deployable. The FabricIQ semantic
          # layer is enabled only when its expert is explicitly selected.
          Waypoint__Fabric__IqEnabled: ${{ inputs.fabriciq_enabled }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.fabric_provision_enabled }}" = "true" ] \
            && [ "$Waypoint__Fabric__AdministratorMembersJson" = "[]" ]; then
            deploy_sp_object_id="$(az ad sp show \
              --id "${{ needs.validate.outputs.azure_client_id }}" \
              --query id -o tsv)"
            export Waypoint__Fabric__AdministratorMembersJson="[\"${deploy_sp_object_id}\"]"
          fi
          existing_web_fqdn="$(az containerapp show \
            --name web \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv 2>/dev/null || true)"
          if [ -n "$existing_web_fqdn" ]; then
            export Waypoint__Msal__RedirectUri="https://${existing_web_fqdn}/login"
          fi
          pg_app="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-app-password --query value -o tsv)"
          pg_admin="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-admin-password --query value -o tsv)"
          api_keys="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name waypoint-api-keys --query value -o tsv)"
          if [ -z "${Waypoint__Postgres__ServerName:-}" ]; then
            pg_hash="$(printf '%s' "${Azure__SubscriptionId}" | sha256sum | cut -c1-8)"
            export Waypoint__Postgres__ServerName="waypoint-pg-${pg_hash}"
          fi
          echo "::add-mask::$pg_app"
          echo "::add-mask::$pg_admin"
          echo "::add-mask::$api_keys"
          export Parameters__postgres_app_password="$pg_app"
          export Parameters__postgres_admin_password="$pg_admin"
          export Parameters__api_keys="$api_keys"
          set +e
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "::group::aspire deploy attempt $attempt / $max_attempts"
            aspire deploy --non-interactive 2>&1 | tee aspire-deploy.log
            deploy_exit=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$deploy_exit" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ] || ! grep -Eqi \
              'connect: connection refused|connection reset by peer|TLS handshake timeout|unexpected EOF|i/o timeout|temporarily unavailable|status code (429|5[0-9]{2})' \
              aspire-deploy.log; then
              exit "$deploy_exit"
            fi
            echo "::warning::Transient Azure/registry failure; retrying idempotent Aspire deploy."
            sleep $((20 * attempt))
          done

      - name: Apply deployed MSAL redirect
        env:
          MSAL_CLIENT_ID: ${{ needs.msal.outputs.msal_client_id }}
        run: |
          set -euo pipefail
          web_fqdn="$(az containerapp show --name web --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          WEB_FQDN="$web_fqdn" MSAL_CLIENT_ID="$MSAL_CLIENT_ID" bash tools/deploy/scripts/msal.sh redirect
          az containerapp update \
            --name web \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "WAYPOINT_MSAL_REDIRECT_URI=https://${web_fqdn}/login" \
            --output none

      - name: Capture app outputs
        id: outputs
        run: |
          set -euo pipefail
          api_fqdn="$(az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          web_fqdn="$(az containerapp show --name web --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          {
            echo "api_fqdn=$api_fqdn"
            echo "web_fqdn=$web_fqdn"
            echo "api_base_url=https://$api_fqdn"
            echo "web_base_url=https://$web_fqdn"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Waypoint app"
            echo ""
            echo "- API: https://$api_fqdn"
            echo "- Web: https://$web_fqdn"
            echo "- Database bootstrap: API startup bootstrap remains enabled because Aspire provisions PostgreSQL and injects its bootstrap connection during this same deploy; pre-deploy database access cannot be proven on a first deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── fabric-provision ─────────────────────────────────────────────────────────
  # Explicitly reconcile the Fabric workspace and lakehouse after the app is
  # available. The app deploy may be skipped when an existing runtime is reused.
  fabric-provision:
    name: Provision Fabric workspace and lakehouse
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.fabric_provision_enabled &&
      (needs.plan.outputs.fabric_infrastructure == 'true' ||
       needs.plan.outputs.onelake_upload == 'true') &&
      needs.validate.result == 'success' &&
      needs.keyvault.result == 'success' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped')
    needs: [plan, validate, keyvault, deploy-app]
    outputs:
      onelake_workspace: ${{ steps.fabric.outputs.onelake_workspace }}
      onelake_lakehouse: ${{ steps.fabric.outputs.onelake_lakehouse }}
      onelake_corpus_prefix: ${{ steps.fabric.outputs.onelake_corpus_prefix }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Provision Fabric workspace and lakehouse
        id: fabric
        env:
          WAYPOINT_FABRIC_PROVISION_ENABLED: 'true'
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
          WAYPOINT_FABRIC_WORKSPACE_NAME: ${{ inputs.fabric_workspace_name || vars.WAYPOINT_FABRIC_WORKSPACE_NAME || 'waypoint-corpus' }}
          WAYPOINT_FABRIC_LAKEHOUSE_NAME: ${{ inputs.fabric_lakehouse_name || vars.WAYPOINT_FABRIC_LAKEHOUSE_NAME || 'corpus' }}
        run: |
          set -euo pipefail
          # Resolve capacity name and derive the ARM resource ID expected by provision-fabric.sh.
          cap_name="${{ inputs.fabric_capacity_name || vars.WAYPOINT_FABRIC_CAPACITY_NAME }}"
          if [ -z "$cap_name" ]; then
            # Match the Aspire apphost default. Parallel deployments must provide
            # an explicit capacity name so both stages remain isolated.
            cap_name="waypointcorpus"
          fi
          export WAYPOINT_FABRIC_CAPACITY_ID="/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Fabric/capacities/${cap_name}"
          # Aspire assigns a user-assigned identity to the container app. Support either identity
          # shape so runtime OneLake access is never silently omitted.
          app_identity="$(az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" \
            --query identity -o json)"
          app_mi="$(jq -r \
            '.principalId // ((.userAssignedIdentities // {}) | to_entries[0].value.principalId) // empty' \
            <<<"$app_identity")"
          app_mi_client_id="$(jq -r \
            '((.userAssignedIdentities // {}) | to_entries[0].value.clientId) // empty' \
            <<<"$app_identity")"
          if [ -z "$app_mi" ]; then
            echo "::error::The Waypoint API container app has no resolvable managed identity."
            exit 1
          fi
          export WAYPOINT_FABRIC_MI_PRINCIPAL_ID="$app_mi"
          # Grant the deploy SP (corpus uploads) a workspace Member role.
          deploy_sp="$(az ad sp show --id "${{ needs.validate.outputs.azure_client_id }}" \
            --query id -o tsv 2>/dev/null || true)"
          export WAYPOINT_FABRIC_DEPLOY_PRINCIPAL_ID="${deploy_sp:-}"
          bash apps/waypoint/infra/scripts/provision-fabric.sh
          echo "app_mi_client_id=$app_mi_client_id" >> "$GITHUB_OUTPUT"

      - name: Update API container app with OneLake coordinates
        env:
          ONELAKE_WORKSPACE: ${{ steps.fabric.outputs.onelake_workspace }}
          ONELAKE_LAKEHOUSE: ${{ steps.fabric.outputs.onelake_lakehouse }}
        run: |
          set -euo pipefail
          if [ -z "${ONELAKE_WORKSPACE:-}" ]; then
            echo "::warning::Fabric workspace id is empty; skipping APP_ONELAKE_* update."
            exit 0
          fi
          onelake_env=(
            "APP_ONELAKE_WORKSPACE=${ONELAKE_WORKSPACE}"
            "APP_ONELAKE_LAKEHOUSE=${ONELAKE_LAKEHOUSE}"
          )
          if [ -n "${{ steps.fabric.outputs.app_mi_client_id }}" ]; then
            onelake_env+=("AZURE_CLIENT_ID=${{ steps.fabric.outputs.app_mi_client_id }}")
          fi
          az containerapp update \
            --name api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "${onelake_env[@]}" \
            --output none
          echo "Updated api with APP_ONELAKE_WORKSPACE=${ONELAKE_WORKSPACE} APP_ONELAKE_LAKEHOUSE=${ONELAKE_LAKEHOUSE}"

  # ── provision-agents ─────────────────────────────────────────────────────────
  # Run azd provision ONCE. Deploy-agent matrix jobs hydrate all outputs from
  # the exact ^<AZD_ENV_NAME>-[0-9]+$ successful subscription deployment.
  provision-agents:
    name: Provision Foundry infrastructure
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.deploy_agents &&
      (needs.plan.outputs.foundry_infrastructure == 'true' ||
       needs.plan.outputs.deploy_agents == 'true' ||
       needs.plan.outputs.contracts_kb == 'true' ||
       needs.plan.outputs.wiring == 'true' ||
       needs.plan.outputs.acceptance == 'true') &&
      needs.validate.result == 'success' &&
      needs.keyvault.result == 'success' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped')
    needs: [plan, validate, keyvault, deploy-app]
    outputs:
      project_endpoint: ${{ steps.endpoint.outputs.endpoint }}
      ai_account_id: ${{ steps.endpoint.outputs.ai_account_id }}
      contracts_kb_storage_account: ${{ steps.coords.outputs.storage_account }}
      contracts_kb_container: ${{ steps.coords.outputs.container }}
      contracts_kb_search_endpoint: ${{ steps.coords.outputs.search_endpoint }}
      contracts_kb_indexer: ${{ steps.coords.outputs.indexer }}
    defaults:
      run:
        working-directory: modules/agents
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Configure azd environment
        env:
          AZURE_CLIENT_ID: ${{ needs.validate.outputs.azure_client_id }}
          AZURE_TENANT_ID: ${{ needs.validate.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
          AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          AZURE_AI_ACCOUNT_NAME: ${{ vars.AZURE_AI_ACCOUNT_NAME }}
          AZURE_AI_PROJECT_NAME: ${{ vars.AZURE_AI_PROJECT_NAME }}
          WAYPOINT_API_BASE_URL_FROM_APP: ${{ needs['deploy-app'].outputs.api_base_url }}
          WAYPOINT_API_BASE_URL_FROM_VARS: ${{ vars.WAYPOINT_API_BASE_URL }}
          WAYPOINT_API_SCOPE_FROM_APP: ${{ needs['deploy-app'].outputs.api_default_scope }}
          WAYPOINT_API_SCOPE_FROM_VARS: ${{ vars.WAYPOINT_API_SCOPE }}
        run: |
          set -euo pipefail
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          azd config set alpha.deployment.stacks off
          azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" \
            --location "$AZURE_LOCATION" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set ENABLE_HOSTED_AGENTS true
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.5' }}"
          azd env set MODEL_NAME "${{ vars.MODEL_NAME || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.5' }}"
          azd env set MODEL_VERSION "${{ vars.MODEL_VERSION || '2026-04-24' }}"
          azd env set MODEL_SKU_NAME "${{ vars.MODEL_SKU_NAME || 'GlobalStandard' }}"
          azd env set MODEL_CAPACITY "${{ vars.MODEL_CAPACITY || '200' }}"
          azd env set AZURE_AI_EMBEDDING_DEPLOYMENT_NAME "${{ vars.AZURE_AI_EMBEDDING_DEPLOYMENT_NAME || 'text-embedding-3-large' }}"
          azd env set EMBEDDING_MODEL_NAME "${{ vars.EMBEDDING_MODEL_NAME || 'text-embedding-3-large' }}"
          azd env set EMBEDDING_MODEL_VERSION "${{ vars.EMBEDDING_MODEL_VERSION || '1' }}"
          azd env set EMBEDDING_MODEL_SKU_NAME "${{ vars.EMBEDDING_MODEL_SKU_NAME || 'Standard' }}"
          azd env set EMBEDDING_MODEL_CAPACITY "${{ vars.EMBEDDING_MODEL_CAPACITY || '50' }}"
          azd env set ENABLE_WORKIQ_CONNECTIONS "${{ inputs.workiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_WORKIQ_ENABLED "${{ inputs.workiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_WEBIQ_ENABLED "${{ inputs.webiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_FOUNDRYIQ_ENABLED "${{ inputs.foundryiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_FABRICIQ_ENABLED "${{ inputs.fabriciq_enabled }}"
          # Repo-level Foundry outputs belong to the default environment. A custom
          # azd environment must provision and hydrate its own project.
          if [ "$AZD_ENV_NAME" = "waypoint-agents" ] && [ -n "${AZURE_AI_PROJECT_ENDPOINT:-}" ]; then
            azd env set AZURE_AI_PROJECT_ENDPOINT "$AZURE_AI_PROJECT_ENDPOINT"
          fi
          if [ "$AZD_ENV_NAME" = "waypoint-agents" ] && [ -n "${AZURE_AI_PROJECT_ID:-}" ]; then
            azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"
          fi
          if [ "$AZD_ENV_NAME" = "waypoint-agents" ] && [ -n "${AZURE_AI_ACCOUNT_NAME:-}" ] && [ -n "${AZURE_AI_PROJECT_NAME:-}" ]; then
            azd env set USE_EXISTING_AI_PROJECT true
            azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
            azd env set AZURE_AI_ACCOUNT_NAME "$AZURE_AI_ACCOUNT_NAME"
            azd env set AZURE_AI_PROJECT_NAME "$AZURE_AI_PROJECT_NAME"
          fi
          wp_base="${WAYPOINT_API_BASE_URL_FROM_APP:-$WAYPOINT_API_BASE_URL_FROM_VARS}"
          wp_scope="${WAYPOINT_API_SCOPE_FROM_APP:-$WAYPOINT_API_SCOPE_FROM_VARS}"
          if [ -n "$wp_base" ]; then azd env set WAYPOINT_API_BASE_URL "$wp_base"; fi
          if [ -n "$wp_scope" ]; then azd env set WAYPOINT_API_SCOPE "$wp_scope"; fi

      - name: Bootstrap Foundry parent account
        if: ${{ inputs.provision_agents }}
        run: bash scripts/bootstrap_foundry_account.sh
        timeout-minutes: 10

      - name: Run azd provision
        if: ${{ inputs.provision_agents && needs.plan.outputs.foundry_infrastructure == 'true' }}
        run: azd provision --no-prompt
        timeout-minutes: 45

      - name: Verify deployment outputs and resolve endpoint
        id: endpoint
        # ┌─────────────────────────────────────────────────────────────┐
        # │ LOAD-BEARING REGEX — DO NOT "SIMPLIFY" TO starts_with(...)  │
        # └─────────────────────────────────────────────────────────────┘
        # ^<env>-[0-9]+$ requires the exact env name followed only by azd's
        # unix-timestamp suffix. A starts_with filter silently matches sibling
        # envs where one name is a prefix of the other (e.g. 'forge' matches
        # 'forge-demo-<ts>'), hydrating outputs from the wrong resource group.
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?properties.provisioningState=='Succeeded'].{name:name, ts:properties.timestamp}" \
            -o json \
            | jq -r --arg env "$AZD_ENV_NAME" '
                map(select(.name | test("^" + $env + "-[0-9]+$")))
                | sort_by(.ts)
                | last
                | .name // empty
              ')
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment matching '^${AZD_ENV_NAME}-[0-9]+$' found. Run with provision_agents=true."
            exit 1
          fi
          echo "Latest deployment: $DEPLOYMENT"
          # Hydrate outputs so we can read AZURE_AI_PROJECT_ENDPOINT.
          while IFS=$'\t' read -r key value; do
            [ -z "$key" ] && continue
            UPPER=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
            azd env set "$UPPER" "$value"
          done < <(az deployment sub show --name "$DEPLOYMENT" \
                    --query "properties.outputs" -o json \
                    | jq -r 'to_entries[] | "\(.key)\t\(.value.value)"')
          endpoint="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT 2>/dev/null || true)"
          if [ -z "$endpoint" ] || printf '%s' "$endpoint" | grep -qi 'not found'; then
            echo "::error::AZURE_AI_PROJECT_ENDPOINT is unavailable after provisioning. Run with provision_agents=true or set AZURE_AI_PROJECT_ENDPOINT repository variable."
            exit 1
          fi
          ai_account_id="$(azd env get-value AZURE_AI_ACCOUNT_ID 2>/dev/null || true)"
          if [ -z "$ai_account_id" ] || printf '%s' "$ai_account_id" | grep -qi 'not found'; then
            echo "::error::AZURE_AI_ACCOUNT_ID is unavailable after provisioning."
            exit 1
          fi
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "ai_account_id=$ai_account_id" >> "$GITHUB_OUTPUT"
        timeout-minutes: 5

      - name: Configure Content Understanding model defaults
        run: |
          set -euo pipefail
          export CONTENT_UNDERSTANDING_ENDPOINT="$(azd env get-value CONTENT_UNDERSTANDING_ENDPOINT)"
          export CONTENT_UNDERSTANDING_API_VERSION="$(azd env get-value CONTENT_UNDERSTANDING_API_VERSION)"
          export CONTENT_UNDERSTANDING_SCOPE="$(azd env get-value CONTENT_UNDERSTANDING_SCOPE)"
          export CONTENT_UNDERSTANDING_COMPLETION_DEPLOYMENT_NAME="$(azd env get-value CONTENT_UNDERSTANDING_COMPLETION_DEPLOYMENT_NAME)"
          export CONTENT_UNDERSTANDING_COMPLETION_MODEL_NAME="$(azd env get-value CONTENT_UNDERSTANDING_COMPLETION_MODEL_NAME)"
          export AZURE_AI_ACCOUNT_NAME="$(azd env get-value AZURE_AI_ACCOUNT_NAME)"
          export AZURE_RESOURCE_GROUP="$(azd env get-value AZURE_RESOURCE_GROUP)"
          export AZURE_AI_EMBEDDING_DEPLOYMENT_NAME="$(azd env get-value AZURE_AI_EMBEDDING_DEPLOYMENT_NAME)"
          python scripts/configure_content_understanding.py
        timeout-minutes: 5

      - name: Resolve contracts-kb coordinates
        id: coords
        # Surface storage/container/search-endpoint/indexer so the contracts-kb-upload
        # job can perform an idempotent blob sync and reindex without hardcoding anything.
        run: |
          set -euo pipefail
          STORAGE_ACCOUNT="$(azd env get-value AZURE_STORAGE_ACCOUNT_NAME 2>/dev/null || true)"
          CONTAINER="$(azd env get-value AZURE_AI_SEARCH_CONTAINER_NAME 2>/dev/null || true)"
          SEARCH_ENDPOINT="$(azd env get-value AZURE_AI_SEARCH_SERVICE_ENDPOINT 2>/dev/null || true)"
          INDEXER="$(azd env get-value AZURE_AI_SEARCH_INDEXER_NAME 2>/dev/null || true)"
          for var in STORAGE_ACCOUNT CONTAINER SEARCH_ENDPOINT INDEXER; do
            eval "v=\${$var}"
            case "$v" in *"not found"*|"ERROR"*) eval "$var=''" ;; esac
          done
          echo "storage_account=$STORAGE_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          echo "search_endpoint=$SEARCH_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "indexer=$INDEXER" >> "$GITHUB_OUTPUT"
          {
            echo "## Foundry infrastructure"
            echo ""
            echo "- Project endpoint: \`${{ steps.endpoint.outputs.endpoint }}\`"
            echo ""
            echo "### contracts-kb coordinates"
            echo ""
            echo "| output | value |"
            echo "| --- | --- |"
            echo "| storage_account | \`${STORAGE_ACCOUNT:-<empty>}\` |"
            echo "| container | \`${CONTAINER:-<empty>}\` |"
            echo "| search_endpoint | \`${SEARCH_ENDPOINT:-<empty>}\` |"
            echo "| indexer | \`${INDEXER:-<empty>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 2

      - name: Initialize contracts knowledge base
        if: ${{ inputs.foundryiq_enabled }}
        run: |
          set -euo pipefail
          get() { azd env get-value "$1" 2>/dev/null | grep -v 'not found' || true; }

          export AZURE_SUBSCRIPTION_ID="${{ needs.validate.outputs.azure_subscription_id }}"
          export AZURE_RESOURCE_GROUP="$(get AZURE_RESOURCE_GROUP)"
          export AZURE_AI_ACCOUNT_NAME="$(get AZURE_AI_ACCOUNT_NAME)"
          export AZURE_AI_PROJECT_NAME="$(get AZURE_AI_PROJECT_NAME)"
          export AZURE_AI_SEARCH_SERVICE_NAME="$(get AZURE_AI_SEARCH_SERVICE_NAME)"
          export AZURE_STORAGE_ACCOUNT_NAME="$(get AZURE_STORAGE_ACCOUNT_NAME)"
          export AZURE_STORAGE_CONTAINER_NAME="$(get AZURE_AI_SEARCH_CONTAINER_NAME)"
          export AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME="$(get AZURE_AI_SEARCH_KNOWLEDGE_BASE_NAME)"
          export AZURE_AI_SEARCH_KNOWLEDGE_SOURCE_NAME="$(get AZURE_AI_SEARCH_KNOWLEDGE_SOURCE_NAME)"
          export AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME="$(get AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME)"
          export AZURE_AI_MODEL_DEPLOYMENT_NAME="$(get AZURE_AI_MODEL_DEPLOYMENT_NAME)"
          export AZURE_AI_EMBEDDING_DEPLOYMENT_NAME="$(get AZURE_AI_EMBEDDING_DEPLOYMENT_NAME)"

          python scripts/initialize_contracts_kb.py --skip-upload
        timeout-minutes: 10

  # ── deploy-agents ─────────────────────────────────────────────────────────────
  # Matrix: one job per hosted agent. Each leg re-selects the azd env and
  # hydrates all Foundry outputs from the exact ^<env>-[0-9]+$ ARM deployment —
  # no per-leg azd provision, no shared mutable state between legs.
  deploy-agents:
    name: Deploy ${{ matrix.agent }}
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.deploy_agents &&
      needs.plan.outputs.deploy_agents == 'true' &&
      needs.validate.outputs.agent_matrix != '[]' &&
      needs.validate.result == 'success' &&
      needs.keyvault.result == 'success' &&
      needs['provision-agents'].result == 'success' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped')
    needs: [plan, validate, keyvault, deploy-app, provision-agents]
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.validate.outputs.agent_matrix) }}
    defaults:
      run:
        working-directory: modules/agents
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2.3.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install azd AI Agents extension
        run: azd ext install azure.ai.agents

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Configure azd auth
        env:
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          azd config set alpha.deployment.stacks off

      - name: Select azd environment
        env:
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
        run: |
          azd env new "$AZD_ENV_NAME" \
            --location "$AZURE_LOCATION" \
            --subscription "$AZURE_SUBSCRIPTION_ID" || \
            azd env select "$AZD_ENV_NAME"

      - name: Seed identity values
        env:
          AZURE_TENANT_ID: ${{ needs.validate.outputs.azure_tenant_id }}
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.azure_subscription_id }}
          AZURE_CLIENT_ID: ${{ needs.validate.outputs.azure_client_id }}
        run: |
          azd env set AZURE_TENANT_ID       "$AZURE_TENANT_ID"
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_CLIENT_ID       "$AZURE_CLIENT_ID"
          orch_bp_secret="${{ secrets.ASSURANCE_ORCHESTRATOR_BLUEPRINT_CLIENT_SECRET }}"
          if [ -n "$orch_bp_secret" ]; then
            azd env set ASSURANCE_ORCHESTRATOR_BLUEPRINT_CLIENT_SECRET "$orch_bp_secret"
          fi
          analyst_bp_secret="${{ secrets.INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET }}"
          if [ -n "$analyst_bp_secret" ]; then
            azd env set INVOICE_ANALYST_BLUEPRINT_CLIENT_SECRET "$analyst_bp_secret"
          fi

      - name: Hydrate azd env from last successful deployment
        id: endpoint
        # Reads every output from the most recent succeeded ARM deployment and copies
        # them into the azd env. This makes provision-skipped legs behave identically
        # to legs that just provisioned fresh infra.
        run: |
          set -euo pipefail
          DEPLOYMENT=$(az deployment sub list \
            --query "[?properties.provisioningState=='Succeeded'].{name:name, ts:properties.timestamp}" \
            -o json \
            | jq -r --arg env "$AZD_ENV_NAME" '
                map(select(.name | test("^" + $env + "-[0-9]+$")))
                | sort_by(.ts)
                | last
                | .name // empty
              ')
          if [ -z "$DEPLOYMENT" ]; then
            echo "::error::No succeeded azd deployment matching '^${AZD_ENV_NAME}-[0-9]+$' found."
            exit 1
          fi
          echo "Hydrating from deployment: $DEPLOYMENT"
          while IFS=$'\t' read -r key value; do
            [ -z "$key" ] && continue
            UPPER=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
            azd env set "$UPPER" "$value"
          done < <(az deployment sub show --name "$DEPLOYMENT" \
                    --query "properties.outputs" -o json \
                    | jq -r 'to_entries[] | "\(.key)\t\(.value.value)"')
          ENDPOINT=$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)
          if [ -z "$ENDPOINT" ] || printf '%s' "$ENDPOINT" | grep -qi 'not found'; then
            echo "::error::Deployment '$DEPLOYMENT' has no AZURE_AI_PROJECT_ENDPOINT output."
            exit 1
          fi
          # The azure.ai.agent extension reads FOUNDRY_PROJECT_ENDPOINT during azd deploy.
          azd env set FOUNDRY_PROJECT_ENDPOINT "$ENDPOINT"
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
        timeout-minutes: 2

      - name: Seed Waypoint keys from Key Vault
        # Guard on non-empty so runs without KV (e.g. repo-secret-only paths) do not
        # shadow a local .env with empty strings.
        env:
          KV_NAME: ${{ needs.keyvault.outputs.key_vault_name }}
        run: |
          set -euo pipefail
          writer_key="$(az keyvault secret show --vault-name "$KV_NAME" \
            --name waypoint-writer-key --query value -o tsv 2>/dev/null || true)"
          reader_key="$(az keyvault secret show --vault-name "$KV_NAME" \
            --name waypoint-reader-key --query value -o tsv 2>/dev/null || true)"
          if [ -n "$writer_key" ]; then
            echo "::add-mask::$writer_key"
            azd env set WAYPOINT_WRITER_API_KEY "$writer_key"
          fi
          if [ -n "$reader_key" ]; then
            echo "::add-mask::$reader_key"
            azd env set WAYPOINT_READER_API_KEY "$reader_key"
          fi

      - name: Seed API base URL, key auth, and lane flags
        env:
          WAYPOINT_API_BASE_URL_FROM_APP: ${{ needs['deploy-app'].outputs.api_base_url }}
        run: |
          set -euo pipefail
          WP_BASE="${WAYPOINT_API_BASE_URL_FROM_APP:-}"
          if [ -z "$WP_BASE" ]; then WP_BASE="${{ vars.WAYPOINT_API_BASE_URL }}"; fi
          if [ -n "$WP_BASE" ]; then azd env set WAYPOINT_API_BASE_URL "$WP_BASE"; fi
          # The consolidated deployment deliberately routes reader/writer keys from
          # Key Vault. Clear a stale scope so clients select x-api-key instead of an
          # un-granted hosted-agent managed-identity token.
          azd env set WAYPOINT_API_SCOPE ""
          azd env set ASSURANCE_ORCHESTRATOR_WORKIQ_ENABLED    "${{ inputs.workiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_WEBIQ_ENABLED     "${{ inputs.webiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_FOUNDRYIQ_ENABLED "${{ inputs.foundryiq_enabled }}"
          azd env set ASSURANCE_ORCHESTRATOR_FABRICIQ_ENABLED  "${{ inputs.fabriciq_enabled }}"
          if [ "${{ inputs.workiq_enabled }}" = "true" ]; then
            azd env set WORKIQ_EMAIL_MCP_SERVER_URL "${{ vars.WORKIQ_EMAIL_MCP_SERVER_URL }}"
            azd env set WORKIQ_TEAMS_MCP_SERVER_URL "${{ vars.WORKIQ_TEAMS_MCP_SERVER_URL }}"
            azd env set WORKIQ_SHAREPOINT_MCP_SERVER_URL "${{ vars.WORKIQ_SHAREPOINT_MCP_SERVER_URL || vars.WORKIQ_MCP_SERVER_URL }}"
            azd env set WORKIQ_MCP_SERVER_URL "${{ vars.WORKIQ_MCP_SERVER_URL }}"
            if [ -n "${{ vars.WORKIQ_MCP_SCOPE }}" ]; then
              azd env set WORKIQ_MCP_SCOPE "${{ vars.WORKIQ_MCP_SCOPE }}"
            fi
          fi
          if [ "${{ inputs.fabriciq_enabled }}" = "true" ]; then
            azd env set FABRIC_DATA_AGENT_CONNECTION_NAME "${{ vars.FABRIC_DATA_AGENT_CONNECTION_NAME || 'waypoint-data-agent-connection' }}"
            azd env set FABRIC_MIRRORED_SQL_ENDPOINT "${{ vars.FABRIC_MIRRORED_SQL_ENDPOINT }}"
            azd env set FABRIC_MIRRORED_DATABASE "${{ vars.FABRIC_MIRRORED_DATABASE }}"
            azd env set FABRIC_MIRRORED_SCHEMA "${{ vars.FABRIC_MIRRORED_SCHEMA || '_public' }}"
          fi
          # Content understanding
          azd env set CONTENT_UNDERSTANDING_API_VERSION "2025-11-01"
          azd env set CONTENT_UNDERSTANDING_ANALYZER_ID "prebuilt-invoice"
          azd env set CONTENT_UNDERSTANDING_SCOPE "https://cognitiveservices.azure.com/.default"
          # Search (allow pre-existing connection bypass)
          ENABLE_SEARCH_VAL="${{ vars.ENABLE_SEARCH || 'true' }}"
          azd env set ENABLE_SEARCH "$ENABLE_SEARCH_VAL"
          if [ "$ENABLE_SEARCH_VAL" = "false" ]; then
            azd env set AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME || 'kb-mcp-connection' }}"
            azd env set AZURE_AI_SEARCH_CONNECTION_NAME "${{ vars.AZURE_AI_SEARCH_CONNECTION_NAME || 'azure-ai-search-connection' }}"
          fi

      - name: Wire assurance-orchestrator pipeline endpoints
        # Compute expert Responses endpoints from the project endpoint rather than
        # letting keystone reach across repos. Stable names are the canonical
        # hosted-agent name under <project_endpoint>/agents/<name>.
        if: matrix.agent == 'assurance-orchestrator'
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          base="${FOUNDRY_PROJECT_ENDPOINT%/}"
          if [ -z "$base" ] || printf '%s' "$base" | grep -qi 'not found'; then
            echo "::error::FOUNDRY_PROJECT_ENDPOINT empty; cannot wire orchestrator endpoints."
            exit 1
          fi
          set_ep() { local url="${base}/agents/${2}"; azd env set "$1" "$url"; echo "  $1=$url"; }
          echo "Wiring assurance-orchestrator fan-out endpoints from ${base}:"
          if [ "${{ inputs.workiq_enabled }}" = "true" ]; then
            set_ep WORKIQ_EXPERT_ENDPOINT collaboration-evidence-expert
          else
            azd env set WORKIQ_EXPERT_ENDPOINT ""
          fi
          if [ "${{ inputs.webiq_enabled }}" = "true" ]; then
            set_ep WEBIQ_EXPERT_ENDPOINT market-evidence-expert
          else
            azd env set WEBIQ_EXPERT_ENDPOINT ""
          fi
          if [ "${{ inputs.fabriciq_enabled }}" = "true" ]; then
            set_ep FABRICIQ_EXPERT_ENDPOINT operations-data-expert
          else
            azd env set FABRICIQ_EXPERT_ENDPOINT ""
          fi
          set_ep FOUNDRYIQ_EXPERT_ENDPOINT      contract-policy-expert
          set_ep WAYPOINT_RECORDER_ENDPOINT     waypoint-recorder
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_INVOCATION_MODE responses
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_PROJECT_ENDPOINT ""
          azd env set ASSURANCE_ORCHESTRATOR_EXPERT_MODEL ""
        timeout-minutes: 2

      - name: Create / update Foundry toolbox for ${{ matrix.agent }}
        id: toolbox
        # WebIQ uses Foundry-native web search; FabricIQ binds its data agent in code.
        if: ${{ matrix.agent != 'market-evidence-expert' && matrix.agent != 'operations-data-expert' }}
        continue-on-error: ${{ matrix.agent != 'collaboration-evidence-expert' && matrix.agent != 'contract-policy-expert' && matrix.agent != 'invoice-analyst' }}
        env:
          PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          python -m pip install --quiet 'azure-ai-projects>=2.1.0,<3' azure-identity
          KB_MCP_CONN_NAME="$(azd env get-value AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME 2>/dev/null || true)"
          AI_SEARCH_CONN_NAME="$(azd env get-value AZURE_AI_SEARCH_CONNECTION_NAME 2>/dev/null || true)"
          RC_KB_MCP_CONN_NAME="${{ vars.RELEASE_CAPTAIN_KB_MCP_CONNECTION_NAME }}"
          case "$KB_MCP_CONN_NAME" in *"not found"*|"") KB_MCP_CONN_NAME="" ;; esac
          case "$AI_SEARCH_CONN_NAME" in *"not found"*|"") AI_SEARCH_CONN_NAME="" ;; esac
          TOOLBOX_NAME_ARG=()
          if [ "${{ matrix.agent }}" = "collaboration-evidence-expert" ]; then
            TOOLBOX_NAME_ARG=(--toolbox-name collaboration-evidence-tools)
          fi
          FOUNDRY_PROJECT_ENDPOINT="$PROJECT_ENDPOINT" \
          GH_MCP_CONNECTION_ID="${{ vars.GH_MCP_CONNECTION_ID }}" \
          GH_MCP_PAT="${{ secrets.GH_MCP_PAT }}" \
          ADO_MCP_CONNECTION_ID="${{ vars.ADO_MCP_CONNECTION_ID }}" \
          OUTLOOK_MCP_CONNECTION_ID="${{ vars.OUTLOOK_MCP_CONNECTION_ID }}" \
          AZURE_AI_SEARCH_KB_MCP_CONNECTION_NAME="$KB_MCP_CONN_NAME" \
          RELEASE_CAPTAIN_KB_MCP_CONNECTION_NAME="$RC_KB_MCP_CONN_NAME" \
          AZURE_AI_SEARCH_CONNECTION_NAME="$AI_SEARCH_CONN_NAME" \
            python scripts/create_toolbox.py --agent "${{ matrix.agent }}" "${TOOLBOX_NAME_ARG[@]}" \
            | tee toolbox.log
          ENDPOINT=$(grep '^TOOLBOX_MCP_ENDPOINT=' toolbox.log | cut -d= -f2-)
          if [ -z "$ENDPOINT" ]; then
            echo "::error::Toolbox script did not emit TOOLBOX_MCP_ENDPOINT"
            exit 1
          fi
          if [ "${{ matrix.agent }}" = "collaboration-evidence-expert" ]; then
            azd env set WORKIQ_TOOLBOX_NAME "collaboration-evidence-tools"
            azd env set WORKIQ_TOOLBOX_MCP_ENDPOINT "$ENDPOINT"
          else
            azd env set TOOLBOX_MCP_ENDPOINT "$ENDPOINT"
          fi
        timeout-minutes: 5

      - name: Compare desired agent deployment state
        id: agent-state
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          source_hash="$(
            {
              git ls-files -z -- "agents/${AGENT_NAME}" \
                | sort -z \
                | xargs -0 sha256sum
              sha256sum azure.yaml
            } | sha256sum | cut -d' ' -f1
          )"
          env_hash="$(azd env get-values 2>/dev/null | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          desired_hash="$(printf '%s\n%s\n' "$source_hash" "$env_hash" | sha256sum | cut -d' ' -f1)"

          token="$(az account get-access-token \
            --resource https://ai.azure.com \
            --query accessToken -o tsv)"
          agent_exists=false
          agent_json=""
          if agent_json="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer ${token}" \
            --header "Foundry-Features: AgentEndpoints=V1Preview,HostedAgents=V1Preview" \
            "${FOUNDRY_PROJECT_ENDPOINT%/}/agents/${AGENT_NAME}?api-version=2025-11-15-preview")"; then
            agent_exists=true
          fi
          live_version="$(jq -r '.versions.latest.version // empty' <<<"$agent_json")"

          mapfile -t bot_ids < <(
            az resource list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --resource-type Microsoft.BotService/botServices \
              --query "[?starts_with(name, '${AGENT_NAME}-bot-')].id" \
              -o tsv
          )
          if [ "${#bot_ids[@]}" -gt 1 ]; then
            echo "::error::Multiple Bot Service resources found for ${AGENT_NAME}; reconcile drift before deployment."
            exit 1
          fi
          state_resource_id="${bot_ids[0]:-}"
          recorded_hash=""
          recorded_version=""
          if [ -n "$state_resource_id" ]; then
            recorded_hash="$(az tag list \
              --resource-id "$state_resource_id" \
              --query properties.tags.waypoint_agent_hash \
              -o tsv 2>/dev/null || true)"
            recorded_version="$(az tag list \
              --resource-id "$state_resource_id" \
              --query properties.tags.waypoint_agent_version \
              -o tsv 2>/dev/null || true)"
          fi

          needs_deploy=true
          if [ "$agent_exists" = "true" ] \
            && [ -n "$live_version" ] \
            && [ "$recorded_version" = "$live_version" ] \
            && [ "$recorded_hash" = "$desired_hash" ]; then
            needs_deploy=false
            echo "::notice::${AGENT_NAME} already matches desired deployment state; skipping azd deploy."
          fi
          {
            echo "desired_hash=$desired_hash"
            echo "needs_deploy=$needs_deploy"
          } >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      - name: Deploy ${{ matrix.agent }}
        if: steps.agent-state.outputs.needs_deploy == 'true'
        run: |
          set +e
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "::group::azd deploy ${{ matrix.agent }} attempt $attempt / $max_attempts"
            azd deploy "${{ matrix.agent }}" --no-prompt 2>&1 | tee azd-deploy.log
            azd_exit=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $azd_exit -eq 0 ]; then
              echo "::notice::Deploy succeeded on attempt $attempt"
              exit 0
            fi
            if grep -qE "(InvalidRange|streaming remote build logs \(HTTP 416\)|failed retrieving package result details)" azd-deploy.log; then
              echo "::warning::Transient ACR log-streaming flake on attempt $attempt — retrying"
              attempt=$((attempt + 1))
              sleep $((10 * attempt))
              continue
            fi
            if grep -qE "(failed to get tenant ID for subscription|failed to resolve user .* access to subscription)" azd-deploy.log; then
              az account show -o none 2>/dev/null || true
              az account set --subscription "${{ needs.validate.outputs.azure_subscription_id }}" 2>/dev/null || true
              attempt=$((attempt + 1))
              sleep $((10 * attempt))
              continue
            fi
            echo "::error::azd deploy failed with a non-transient error"
            exit "$azd_exit"
          done
          echo "::error::azd deploy failed after $max_attempts attempts"
          exit 1
        timeout-minutes: 45

      - name: Record agent deployment state
        if: steps.agent-state.outputs.needs_deploy == 'true'
        env:
          DESIRED_HASH: ${{ steps.agent-state.outputs.desired_hash }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
          AGENT_NAME: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          token="$(az account get-access-token \
            --resource https://ai.azure.com \
            --query accessToken -o tsv)"
          agent_json="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer ${token}" \
            --header "Foundry-Features: AgentEndpoints=V1Preview,HostedAgents=V1Preview" \
            "${FOUNDRY_PROJECT_ENDPOINT%/}/agents/${AGENT_NAME}?api-version=2025-11-15-preview")"
          live_version="$(jq -r '.versions.latest.version // empty' <<<"$agent_json")"
          if [ -z "$live_version" ]; then
            echo "::error::${AGENT_NAME} has no live version after deployment."
            exit 1
          fi
          mapfile -t bot_ids < <(
            az resource list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --resource-type Microsoft.BotService/botServices \
              --query "[?starts_with(name, '${AGENT_NAME}-bot-')].id" \
              -o tsv
          )
          if [ "${#bot_ids[@]}" -ne 1 ]; then
            echo "::error::Expected one Bot Service resource for ${AGENT_NAME}; found ${#bot_ids[@]}."
            exit 1
          fi
          az tag update \
            --resource-id "${bot_ids[0]}" \
            --operation Merge \
            --tags \
              "waypoint_agent_hash=${DESIRED_HASH}" \
              "waypoint_agent_version=${live_version}" \
            --output none

      - name: Deployment summary
        if: always()
        env:
          FOUNDRY_ENDPOINT: ${{ steps.endpoint.outputs.endpoint }}
        run: |
          {
            echo "## Hosted agent: ${{ matrix.agent }}"
            echo ""
            echo "- Project endpoint: \`${FOUNDRY_ENDPOINT:-<unavailable>}\`"
            echo "- Deployment required: \`${{ steps.agent-state.outputs.needs_deploy }}\`"
            if [ "${{ matrix.agent }}" = "assurance-orchestrator" ]; then
              echo "- Fan-out lanes: WorkIQ=${{ inputs.workiq_enabled }}, WebIQ=${{ inputs.webiq_enabled }}, FoundryIQ=${{ inputs.foundryiq_enabled }}, FabricIQ=${{ inputs.fabriciq_enabled }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── wire-app-operations ───────────────────────────────────────────────────────
  # Let the authenticated Waypoint API start the hosted orchestrator without
  # exposing Foundry credentials to the browser. The API uses its existing
  # user-assigned identity and receives only the Foundry User role.
  wire-app-operations:
    name: Wire Waypoint assurance operations
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.deploy_app &&
      inputs.deploy_agents &&
      needs.plan.outputs.wiring == 'true' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped') &&
      needs['provision-agents'].result == 'success' &&
      (needs['deploy-agents'].result == 'success' || needs['deploy-agents'].result == 'skipped')
    needs: [plan, validate, deploy-app, provision-agents, deploy-agents]
    steps:
      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Grant API identity Foundry invocation access
        env:
          AI_ACCOUNT_ID: ${{ needs['provision-agents'].outputs.ai_account_id }}
        run: |
          set -euo pipefail
          app_identity="$(az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" \
            --query identity -o json)"
          app_principal_id="$(jq -r \
            '.principalId // ((.userAssignedIdentities // {}) | to_entries[0].value.principalId) // empty' \
            <<<"$app_identity")"
          app_client_id="$(jq -r \
            '((.userAssignedIdentities // {}) | to_entries[0].value.clientId) // empty' \
            <<<"$app_identity")"
          if [ -z "$app_principal_id" ] || [ -z "$app_client_id" ]; then
            echo "::error::The Waypoint API user-assigned identity is incomplete."
            exit 1
          fi
          foundry_user_role="/subscriptions/${{ needs.validate.outputs.azure_subscription_id }}/providers/Microsoft.Authorization/roleDefinitions/53ca6127-db72-4b80-b1b0-d745d6d5456d"
          existing="$(az role assignment list \
            --assignee-object-id "$app_principal_id" \
            --scope "$AI_ACCOUNT_ID" \
            --query "[?roleDefinitionId=='${foundry_user_role}'].id | [0]" -o tsv)"
          if [ -z "$existing" ]; then
            az role assignment create \
              --assignee-object-id "$app_principal_id" \
              --assignee-principal-type ServicePrincipal \
              --role "$foundry_user_role" \
              --scope "$AI_ACCOUNT_ID" \
              --output none
            echo "Granted Foundry User to the Waypoint API identity."
          else
            echo "Reused the Waypoint API identity's Foundry User assignment."
          fi
          echo "app_client_id=$app_client_id" >> "$GITHUB_ENV"

      - name: Configure API assurance endpoint
        env:
          PROJECT_ENDPOINT: ${{ needs['provision-agents'].outputs.project_endpoint }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars \
              "APP_FOUNDRY_ENDPOINT=${PROJECT_ENDPOINT}" \
              "APP_FOUNDRY_ORCHESTRATOR_AGENT_NAME=assurance-orchestrator" \
              "AZURE_CLIENT_ID=${app_client_id}" \
            --output none
          configured_endpoint="$(az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?name=='APP_FOUNDRY_ENDPOINT'].value | [0]" \
            -o tsv)"
          if [ "$configured_endpoint" != "$PROJECT_ENDPOINT" ]; then
            echo "::error::Waypoint API Foundry endpoint wiring did not converge."
            exit 1
          fi

  # ── onelake-upload ────────────────────────────────────────────────────────────
  # Idempotent upload of the ledgerfield corpus (Files + Delta tables) to the
  # provisioned Fabric OneLake lakehouse. Gated on successful Fabric provisioning.
  onelake-upload:
    name: Upload corpus to OneLake
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.fabric_provision_enabled &&
      inputs.seed_data &&
      needs.plan.outputs.onelake_upload == 'true' &&
      needs['fabric-provision'].result == 'success' &&
      (needs['corpus-seed'].result == 'success' || needs['corpus-seed'].result == 'skipped')
    needs: [plan, validate, fabric-provision, corpus-seed]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Upload corpus to OneLake
        working-directory: modules/corpus
        env:
          ONELAKE_WORKSPACE: ${{ needs['fabric-provision'].outputs.onelake_workspace }}
          ONELAKE_LAKEHOUSE: ${{ needs['fabric-provision'].outputs.onelake_lakehouse }}
          ONELAKE_CORPUS_PREFIX: ${{ needs['fabric-provision'].outputs.onelake_corpus_prefix }}
        run: |
          set -euo pipefail
          uv sync
          uv run playwright install --with-deps chromium
          uv run ledgerfield upload-onelake \
            --workspace "$ONELAKE_WORKSPACE" \
            --lakehouse "$ONELAKE_LAKEHOUSE" \
            --corpus-prefix "${ONELAKE_CORPUS_PREFIX:-Files/corpus}"

  # ── contracts-kb-upload ───────────────────────────────────────────────────────
  # Idempotent blob sync of supplier contracts into the contracts-kb Search
  # knowledge source, followed by an immediate reindex. Gated on FoundryIQ and
  # resolved storage coordinates from provision-agents.
  contracts-kb-upload:
    name: Upload contracts to knowledge base
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.foundryiq_enabled &&
      inputs.deploy_agents &&
      needs.plan.outputs.contracts_kb == 'true' &&
      needs['provision-agents'].result == 'success' &&
      needs['provision-agents'].outputs.contracts_kb_storage_account != ''
    needs: [plan, validate, provision-agents]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Upload contracts to knowledge base
        working-directory: modules/corpus
        env:
          CONTRACTS_KB_STORAGE_ACCOUNT: ${{ needs['provision-agents'].outputs.contracts_kb_storage_account }}
          CONTRACTS_KB_CONTAINER: ${{ needs['provision-agents'].outputs.contracts_kb_container }}
          CONTRACTS_KB_SEARCH_ENDPOINT: ${{ needs['provision-agents'].outputs.contracts_kb_search_endpoint }}
          CONTRACTS_KB_INDEXER: ${{ needs['provision-agents'].outputs.contracts_kb_indexer }}
        run: |
          set -euo pipefail
          uv sync
          uv run ledgerfield upload-contracts-kb \
            --storage-account "$CONTRACTS_KB_STORAGE_ACCOUNT" \
            --container "${CONTRACTS_KB_CONTAINER:-knowledge}" \
            --search-endpoint "${CONTRACTS_KB_SEARCH_ENDPOINT:-}" \
            --indexer "${CONTRACTS_KB_INDEXER:-contracts-ks-indexer}"

  # ── seed-import ───────────────────────────────────────────────────────────────
  # Wait for OneLake upload when Fabric is enabled so the seed references data
  # that is already in the lake. When Fabric is disabled, onelake-upload is
  # skipped and the 'skipped' result satisfies the gate below.
  seed-import:
    name: Import Waypoint seed
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.seed_data &&
      inputs.deploy_app &&
      needs.plan.outputs.seed_import == 'true' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped') &&
      needs['corpus-seed'].result == 'success' &&
      needs.keyvault.result == 'success' &&
      (needs['onelake-upload'].result == 'success' || needs['onelake-upload'].result == 'skipped')
    needs: [plan, validate, keyvault, corpus-seed, deploy-app, onelake-upload]
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Download seed artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: waypoint-seed
          path: seed

      - name: Import seed
        env:
          SEED_FILE: seed/data/waypoint/waypoint-seed.json
          API_FQDN: ${{ needs['deploy-app'].outputs.api_fqdn }}
          KV_NAME: ${{ needs.keyvault.outputs.key_vault_name }}
        run: |
          set -euo pipefail
          if [ -z "$API_FQDN" ]; then
            API_FQDN="$(
              az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn -o tsv
            )"
            export API_FQDN
          fi
          bash tools/deploy/scripts/seed_import.sh

  # ── acceptance ────────────────────────────────────────────────────────────────
  # Final gate: HTTP probes via verify_deployment.py + Container App inventory.
  # Reader key is read from KV and masked immediately; never printed or uploaded.
  # WorkIQ is user-scoped and excluded from required health checks. Disabled lanes
  # are reported explicitly in the evidence rather than pretending they passed.
  acceptance:
    name: Acceptance and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: |
      always() &&
      inputs.deploy_app &&
      needs.plan.outputs.acceptance == 'true' &&
      (needs['deploy-app'].result == 'success' || needs['deploy-app'].result == 'skipped') &&
      needs.keyvault.result == 'success'
    needs:
      - plan
      - validate
      - keyvault
      - deploy-app
      - fabric-provision
      - provision-agents
      - deploy-agents
      - wire-app-operations
      - onelake-upload
      - contracts-kb-upload
      - seed-import
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ needs.validate.outputs.azure_client_id }}
          tenant-id: ${{ needs.validate.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.validate.outputs.azure_subscription_id }}

      - name: Run HTTP probes and build evidence
        id: evidence
        env:
          KV_NAME: ${{ needs.keyvault.outputs.key_vault_name }}
          API_BASE_URL: ${{ needs['deploy-app'].outputs.api_base_url }}
          WEB_BASE_URL: ${{ needs['deploy-app'].outputs.web_base_url }}
          PROJECT_ENDPOINT: ${{ needs['provision-agents'].outputs.project_endpoint }}
          SELECTED_AGENTS: ${{ needs.validate.outputs.agent_matrix }}
          FABRIC_PROVISION_RESULT: ${{ needs['fabric-provision'].result }}
          AGENT_DEPLOY_RESULT: ${{ needs['deploy-agents'].result }}
          APP_OPERATIONS_WIRING_RESULT: ${{ needs['wire-app-operations'].result }}
          ONELAKE_UPLOAD_RESULT: ${{ needs['onelake-upload'].result }}
          CONTRACTS_KB_UPLOAD_RESULT: ${{ needs['contracts-kb-upload'].result }}
          SEED_IMPORT_RESULT: ${{ needs['seed-import'].result }}
          AGENT_DEPLOY_PLANNED: ${{ needs.plan.outputs.deploy_agents }}
          WIRING_PLANNED: ${{ needs.plan.outputs.wiring }}
          FABRIC_INFRASTRUCTURE_PLANNED: ${{ needs.plan.outputs.fabric_infrastructure }}
          ONELAKE_UPLOAD_PLANNED: ${{ needs.plan.outputs.onelake_upload }}
          CONTRACTS_KB_PLANNED: ${{ needs.plan.outputs.contracts_kb }}
          SEED_IMPORT_PLANNED: ${{ needs.plan.outputs.seed_import }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$API_BASE_URL" ]; then
            api_fqdn="$(
              az containerapp show --name api --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn -o tsv
            )"
            API_BASE_URL="https://${api_fqdn}"
          fi
          if [ -z "$WEB_BASE_URL" ]; then
            web_fqdn="$(
              az containerapp show --name web --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn -o tsv
            )"
            WEB_BASE_URL="https://${web_fqdn}"
          fi
          reader_key="$(az keyvault secret show --vault-name "$KV_NAME" \
            --name waypoint-reader-key --query value -o tsv 2>/dev/null || true)"
          echo "::add-mask::$reader_key"

          # Seed an empty probe report so evidence_builder.py always has a file to read.
          echo '{"schema_version":"1.0","source_manifest":"tools/deploy/deployment.manifest.json","results":[],"passed":false}' \
            > probe-results.json

          # Run HTTP acceptance probes. Exit code is 1 when probes fail — capture it and
          # re-raise at the end so evidence is always built and uploaded first.
          probe_exit=0
          python3 tools/deploy/scripts/verify_deployment.py \
            --manifest tools/deploy/deployment.manifest.json \
            --api-base-url "$API_BASE_URL" \
            --web-base-url "$WEB_BASE_URL" \
            --api-key "$reader_key" \
            --require-authenticated \
            --output probe-results.json || probe_exit=$?

          # Inventory deployed Container Apps (sanitized — names only, no secrets).
          container_apps="$(az containerapp list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].name" -o json 2>/dev/null || echo '[]')"

          # Query Foundry itself instead of treating the manifest as proof that
          # the declared agents were deployed.
          inventory_result="skipped"
          if [ "${{ inputs.deploy_agents }}" = "true" ]; then
            if [ -z "$PROJECT_ENDPOINT" ]; then
              echo "::error::Foundry project endpoint is unavailable for live inventory."
              printf '[]' > live-agents.json
              inventory_result="failed"
            else
              access_token="$(az account get-access-token \
                --resource https://ai.azure.com \
                --query accessToken -o tsv)"
              inventory_exit=0
              PROJECT_ENDPOINT="$PROJECT_ENDPOINT" ACCESS_TOKEN="$access_token" python3 - <<'PYEOF' || inventory_exit=$?
          import json
          import os
          import urllib.parse
          import urllib.request

          endpoint = os.environ["PROJECT_ENDPOINT"].rstrip("/")
          token = os.environ["ACCESS_TOKEN"]
          params = {"api-version": "2025-11-15-preview", "limit": "100"}
          names = []
          while True:
              url = f"{endpoint}/agents?{urllib.parse.urlencode(params)}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Foundry-Features": "AgentEndpoints=V1Preview,HostedAgents=V1Preview",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.load(response)
              items = (
                  body
                  if isinstance(body, list)
                  else body.get("data") or body.get("value") or []
              )
              names.extend(
                  item.get("name") or item.get("id")
                  for item in items
                  if isinstance(item, dict) and (item.get("name") or item.get("id"))
              )
              if not (
                  isinstance(body, dict)
                  and body.get("has_more")
                  and body.get("last_id")
              ):
                  break
              params["after"] = str(body["last_id"])
          agents = []
          for name in sorted(set(names)):
              url = (
                  f"{endpoint}/agents/{urllib.parse.quote(name, safe='')}"
                  "?api-version=2025-11-15-preview"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Foundry-Features": "AgentEndpoints=V1Preview,HostedAgents=V1Preview",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  detail = json.load(response)
              latest = (detail.get("versions") or {}).get("latest") or {}
              agents.append(
                  {
                      "name": name,
                      "version": latest.get("version"),
                      "status": latest.get("status"),
                  }
              )
          with open("live-agents.json", "w", encoding="utf-8") as handle:
              json.dump(agents, handle)
          PYEOF
              unset access_token
              if [ "$inventory_exit" -eq 0 ]; then
                inventory_result="success"
              else
                echo "::error::Unable to query live Foundry agent inventory."
                printf '[]' > live-agents.json
                inventory_result="failed"
              fi
            fi
          else
            printf '[]' > live-agents.json
          fi

          # Drive a real invoice through the hosted orchestrator, then verify the
          # recorder finalized the governed Waypoint run.
          e2e_result="skipped"
          printf '{"passed":false,"status":"skipped"}\n' > e2e-run.json
          if [ "${{ inputs.deploy_agents }}" = "true" ] \
            && [ "${{ inputs.seed_data }}" = "true" ] \
            && [ "$inventory_result" = "success" ]; then
            e2e_invoice_id="$(
              curl -fsS -H "x-api-key: $reader_key" "$API_BASE_URL/api/work" \
                | jq -r '[.[].invoice_id | select(type == "string" and length > 0)] | first // empty'
            )"
            if [ -z "$e2e_invoice_id" ]; then
              echo "::error::The deployed Waypoint work queue contains no invoice target for E2E acceptance."
              exit 1
            fi
            echo "Selected E2E invoice from deployed work queue: $e2e_invoice_id"
            run_watermark="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python3 -m pip install --quiet requests azure-identity
            drive_exit=0
            python3 modules/agents/scripts/drive_hosted_agent.py \
              assurance-orchestrator \
              --project-endpoint "$PROJECT_ENDPOINT" \
              --input "Run the full invoice-assurance review for invoice ${e2e_invoice_id}." \
              --poll-timeout 2100 \
              --poll-interval 10 \
              > orchestrator-response.txt || drive_exit=$?
            rm -f orchestrator-response.txt
            if [ "$drive_exit" -eq 0 ]; then
              verify_exit=0
              python3 tools/deploy/scripts/verify_terminal_run.py \
                --api-base-url "$API_BASE_URL" \
                --api-key "$reader_key" \
                --invoice-id "$e2e_invoice_id" \
                --updated-after "$run_watermark" \
                --output e2e-run.json || verify_exit=$?
              if [ "$verify_exit" -eq 0 ]; then
                e2e_result="success"
              else
                e2e_result="failed"
              fi
            else
              e2e_result="failed"
              E2E_DRIVE_EXIT="$drive_exit" python3 - <<'PYEOF'
          import json
          import os

          with open("e2e-run.json", "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "passed": False,
                      "status": "failed",
                      "detail": (
                          "Hosted assurance-orchestrator invocation failed with exit "
                          + os.environ["E2E_DRIVE_EXIT"]
                      ),
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          PYEOF
            fi
          fi

          lane_json='{"workiq":${{ inputs.workiq_enabled }},"webiq":${{ inputs.webiq_enabled }},"foundryiq":${{ inputs.foundryiq_enabled }},"fabriciq":${{ inputs.fabriciq_enabled }}}'

          # Write evidence builder inline (no /tmp — workspace root is fine).
          cat > evidence_builder.py << 'PYEOF'
          import json, sys, os, datetime
          sha = sys.argv[1]
          env_name = sys.argv[2]
          probes = json.load(open("probe-results.json"))
          e2e_run = json.load(open("e2e-run.json"))
          container_apps = json.loads(os.environ["CONTAINER_APPS"])
          live_agents = json.loads(os.environ["LIVE_AGENTS"])
          live_agent_names = [
              agent.get("name") for agent in live_agents if isinstance(agent, dict)
          ]
          lane_status = json.loads(os.environ["LANE_JSON"])
          manifest = json.load(open("tools/deploy/deployment.manifest.json"))
          declared_agents = json.loads(os.environ["SELECTED_AGENTS"])
          disabled_lanes = [k for k, v in lane_status.items() if not v]
          evidence = {
              "schema_version": probes.get("schema_version", "1.0"),
              "commit_sha": sha,
              "environment": env_name,
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
              "http_probes": probes.get("results", []),
              "http_probes_passed": probes.get("passed", False),
              "end_to_end_run": e2e_run,
              "container_apps_deployed": sorted(container_apps),
              "declared_agents": declared_agents,
              "live_agents": live_agents,
              "stages": {
                  "fabric_provision": os.environ["FABRIC_PROVISION_RESULT"],
                  "agent_deploy": os.environ["AGENT_DEPLOY_RESULT"],
                  "app_operations_wiring": os.environ["APP_OPERATIONS_WIRING_RESULT"],
                  "agent_inventory": os.environ["AGENT_INVENTORY_RESULT"],
                  "onelake_upload": os.environ["ONELAKE_UPLOAD_RESULT"],
                  "contracts_kb_upload": os.environ["CONTRACTS_KB_UPLOAD_RESULT"],
                  "seed_import": os.environ["SEED_IMPORT_RESULT"],
                  "end_to_end_run": os.environ["E2E_RESULT"],
              },
              "lane_status": lane_status,
              "disabled_lanes": disabled_lanes,
              "passed": False,
          }
          issues = []
          failed_probes = [r for r in evidence["http_probes"] if r.get("status") == "failed"]
          if failed_probes:
              issues.append("Failed HTTP probes: " + str([r["name"] for r in failed_probes]))
          required_apps = {"api", "web"}
          missing_apps = required_apps - set(evidence["container_apps_deployed"])
          if missing_apps:
              issues.append("Missing required Container Apps: " + str(sorted(missing_apps)))
          if os.environ["DEPLOY_AGENTS_ENABLED"] == "true":
              if os.environ["AGENT_INVENTORY_RESULT"] != "success":
                  issues.append("Foundry live agent inventory query failed.")
              missing_agents = sorted(set(declared_agents) - set(live_agent_names))
              if missing_agents:
                  issues.append(
                      "Foundry live inventory is missing declared agents: "
                      + ", ".join(missing_agents)
                  )
              inactive_agents = sorted(
                  agent["name"]
                  for agent in live_agents
                  if agent.get("name") in declared_agents
                  and agent.get("status") != "active"
              )
              if inactive_agents:
                  issues.append(
                      "Foundry agents are not active: " + ", ".join(inactive_agents)
                  )
              if (
                  os.environ["AGENT_DEPLOY_PLANNED"] == "true"
                  and declared_agents
                  and os.environ["AGENT_DEPLOY_RESULT"] != "success"
              ):
                  issues.append(
                      "Agent deployment did not succeed: "
                      + os.environ["AGENT_DEPLOY_RESULT"]
                  )
              if (
                  os.environ["WIRING_PLANNED"] == "true"
                  and os.environ["APP_OPERATIONS_WIRING_RESULT"] != "success"
              ):
                  issues.append(
                      "Waypoint assurance-operation wiring did not succeed: "
                      + os.environ["APP_OPERATIONS_WIRING_RESULT"]
                  )
          if (
              os.environ["FABRIC_INFRASTRUCTURE_PLANNED"] == "true"
              and os.environ["FABRIC_PROVISION_ENABLED"] == "true"
              and os.environ["FABRIC_PROVISION_RESULT"] != "success"
          ):
              issues.append(
                  "Fabric provisioning did not succeed: "
                  + os.environ["FABRIC_PROVISION_RESULT"]
              )
          if (
              os.environ["ONELAKE_UPLOAD_PLANNED"] == "true"
              and os.environ["FABRIC_PROVISION_ENABLED"] == "true"
              and os.environ["SEED_DATA_ENABLED"] == "true"
              and os.environ["ONELAKE_UPLOAD_RESULT"] != "success"
          ):
              issues.append(
                  "OneLake upload did not succeed: "
                  + os.environ["ONELAKE_UPLOAD_RESULT"]
              )
          if (
              os.environ["CONTRACTS_KB_PLANNED"] == "true"
              and os.environ["DEPLOY_AGENTS_ENABLED"] == "true"
              and os.environ["FOUNDRYIQ_ENABLED"] == "true"
              and os.environ["CONTRACTS_KB_UPLOAD_RESULT"] != "success"
          ):
              issues.append(
                  "Contracts KB upload did not succeed: "
                  + os.environ["CONTRACTS_KB_UPLOAD_RESULT"]
              )
          if (
              os.environ["SEED_IMPORT_PLANNED"] == "true"
              and os.environ["SEED_DATA_ENABLED"] == "true"
              and os.environ["SEED_IMPORT_RESULT"] != "success"
          ):
              issues.append(
                  "Seed import did not succeed: " + os.environ["SEED_IMPORT_RESULT"]
              )
          if (
              os.environ["DEPLOY_AGENTS_ENABLED"] == "true"
              and os.environ["SEED_DATA_ENABLED"] == "true"
              and os.environ["E2E_RESULT"] != "success"
          ):
              issues.append(
                  "End-to-end assurance run did not succeed: "
                  + os.environ["E2E_RESULT"]
              )
          evidence["passed"] = not issues
          evidence["outcome"] = (
              "failed" if issues else "partial" if disabled_lanes else "passed"
          )
          evidence["issues"] = issues
          json.dump(evidence, open("deployment-evidence.json", "w"), indent=2, sort_keys=True)
          if disabled_lanes:
              print("::notice::Disabled lanes (expected — not a failure): " + str(disabled_lanes), flush=True)
          if issues:
              for issue in issues:
                  print("::error::" + issue, flush=True)
              sys.exit(1)
          print("All acceptance checks passed.", flush=True)
          PYEOF

          live_agents="$(cat live-agents.json)"
          CONTAINER_APPS="$container_apps" \
          LIVE_AGENTS="$live_agents" \
          LANE_JSON="$lane_json" \
          DEPLOY_AGENTS_ENABLED="${{ inputs.deploy_agents }}" \
          AGENT_DEPLOY_PLANNED="${{ needs.plan.outputs.deploy_agents }}" \
          WIRING_PLANNED="${{ needs.plan.outputs.wiring }}" \
          AGENT_INVENTORY_RESULT="$inventory_result" \
          FABRIC_PROVISION_ENABLED="${{ inputs.fabric_provision_enabled }}" \
          FABRIC_INFRASTRUCTURE_PLANNED="${{ needs.plan.outputs.fabric_infrastructure }}" \
          ONELAKE_UPLOAD_PLANNED="${{ needs.plan.outputs.onelake_upload }}" \
          FOUNDRYIQ_ENABLED="${{ inputs.foundryiq_enabled }}" \
          CONTRACTS_KB_PLANNED="${{ needs.plan.outputs.contracts_kb }}" \
          SEED_DATA_ENABLED="${{ inputs.seed_data }}" \
          SEED_IMPORT_PLANNED="${{ needs.plan.outputs.seed_import }}" \
          E2E_RESULT="$e2e_result" \
          python3 evidence_builder.py "$COMMIT_SHA" "$AZD_ENV_NAME"
          rm -f evidence_builder.py

          # Re-raise probe exit so CI is red when probes fail.
          exit $probe_exit

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: deployment-evidence-${{ github.sha }}
          path: deployment-evidence.json
          if-no-files-found: warn

      - name: Summarise evidence
        if: always()
        run: |
          {
            echo "## Deployment evidence"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Environment: \`${{ env.AZD_ENV_NAME }}\`"
            if [ -f deployment-evidence.json ]; then
              outcome="$(python3 -c "import json; e=json.load(open('deployment-evidence.json')); print(e.get('outcome', 'unknown'))" 2>/dev/null || echo 'unknown')"
              echo "- Outcome: $outcome"
              disabled="$(python3 -c "import json; e=json.load(open('deployment-evidence.json')); print(', '.join(e.get('disabled_lanes', [])) or 'none')" 2>/dev/null || echo '')"
              echo "- Disabled lanes: $disabled"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  record-deployment-state:
    name: Record deployment baseline
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.keyvault.result == 'success'
    needs:
      - plan
      - validate
      - keyvault
      - msal
      - corpus-seed
      - deploy-app
      - fabric-provision
      - provision-agents
      - deploy-agents
      - wire-app-operations
      - onelake-upload
      - contracts-kb-upload
      - seed-import
      - acceptance
    steps:
      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Advance trusted deployment baseline
        env:
          APP_PLANNED: ${{ needs.plan.outputs.app }}
          APP_ENABLED: ${{ inputs.deploy_app }}
          APP_RESULT: ${{ needs['deploy-app'].result }}
          CORPUS_SEED_PLANNED: ${{ needs.plan.outputs.corpus_seed }}
          CORPUS_SEED_ENABLED: ${{ inputs.seed_data }}
          CORPUS_SEED_RESULT: ${{ needs['corpus-seed'].result }}
          SEED_IMPORT_PLANNED: ${{ needs.plan.outputs.seed_import }}
          SEED_IMPORT_ENABLED: ${{ inputs.seed_data && inputs.deploy_app }}
          SEED_IMPORT_RESULT: ${{ needs['seed-import'].result }}
          FABRIC_PLANNED: ${{ needs.plan.outputs.fabric_infrastructure }}
          FABRIC_ENABLED: ${{ inputs.fabric_provision_enabled }}
          FABRIC_RESULT: ${{ needs['fabric-provision'].result }}
          ONELAKE_PLANNED: ${{ needs.plan.outputs.onelake_upload }}
          ONELAKE_ENABLED: ${{ inputs.fabric_provision_enabled && inputs.seed_data }}
          ONELAKE_RESULT: ${{ needs['onelake-upload'].result }}
          CONTRACTS_KB_PLANNED: ${{ needs.plan.outputs.contracts_kb }}
          CONTRACTS_KB_ENABLED: ${{ inputs.deploy_agents && inputs.foundryiq_enabled }}
          CONTRACTS_KB_RESULT: ${{ needs['contracts-kb-upload'].result }}
          FOUNDRY_PLANNED: ${{ needs.plan.outputs.foundry_infrastructure }}
          FOUNDRY_ENABLED: ${{ inputs.deploy_agents && inputs.provision_agents }}
          FOUNDRY_RESULT: ${{ needs['provision-agents'].result }}
          AGENTS_PLANNED: ${{ needs.plan.outputs.deploy_agents }}
          AGENTS_ENABLED: ${{ inputs.deploy_agents }}
          AGENTS_RESULT: ${{ needs['deploy-agents'].result }}
          WIRING_PLANNED: ${{ needs.plan.outputs.wiring }}
          WIRING_ENABLED: ${{ inputs.deploy_app && inputs.deploy_agents }}
          WIRING_RESULT: ${{ needs['wire-app-operations'].result }}
          ACCEPTANCE_PLANNED: ${{ needs.plan.outputs.acceptance }}
          ACCEPTANCE_ENABLED: ${{ inputs.deploy_app }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          CONTROLS_HASH: ${{ needs.plan.outputs.controls_hash }}
        run: |
          set -euo pipefail
          complete=true
          check_stage() {
            local label="$1" planned="$2" enabled="$3" result="$4"
            if [ "$planned" != "true" ]; then
              return
            fi
            if [ "$enabled" != "true" ]; then
              echo "::notice::${label} was planned but intentionally disabled by workflow input."
            elif [ "$result" != "success" ]; then
              echo "::notice::Not advancing baseline: ${label} result was ${result}."
              complete=false
            fi
          }
          check_stage app "$APP_PLANNED" "$APP_ENABLED" "$APP_RESULT"
          check_stage corpus_seed "$CORPUS_SEED_PLANNED" "$CORPUS_SEED_ENABLED" "$CORPUS_SEED_RESULT"
          check_stage seed_import "$SEED_IMPORT_PLANNED" "$SEED_IMPORT_ENABLED" "$SEED_IMPORT_RESULT"
          check_stage fabric_infrastructure "$FABRIC_PLANNED" "$FABRIC_ENABLED" "$FABRIC_RESULT"
          check_stage onelake_upload "$ONELAKE_PLANNED" "$ONELAKE_ENABLED" "$ONELAKE_RESULT"
          check_stage contracts_kb "$CONTRACTS_KB_PLANNED" "$CONTRACTS_KB_ENABLED" "$CONTRACTS_KB_RESULT"
          check_stage foundry_infrastructure "$FOUNDRY_PLANNED" "$FOUNDRY_ENABLED" "$FOUNDRY_RESULT"
          check_stage deploy_agents "$AGENTS_PLANNED" "$AGENTS_ENABLED" "$AGENTS_RESULT"
          check_stage wiring "$WIRING_PLANNED" "$WIRING_ENABLED" "$WIRING_RESULT"
          check_stage acceptance "$ACCEPTANCE_PLANNED" "$ACCEPTANCE_ENABLED" "$ACCEPTANCE_RESULT"
          if [ "$complete" != "true" ]; then
            echo "Deployment baseline was not advanced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          az group update \
            --name "$STATE_RESOURCE_GROUP" \
            --set \
              "tags.waypoint_deployment_base_sha=${{ github.sha }}" \
              "tags.waypoint_deployment_controls_hash=${CONTROLS_HASH}" \
            --output none
          {
            echo "## Deployment baseline"
            echo ""
            echo "- Recorded source SHA: \`${{ github.sha }}\`"
            echo "- Plan mode: \`${{ needs.plan.outputs.mode }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

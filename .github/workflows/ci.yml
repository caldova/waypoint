name: Consolidated CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidated-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waypoint-api:
    name: Waypoint API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/waypoint/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check app/
      - run: uv run mypy app/
      - run: uv run pytest --tb=short -v

  waypoint-web:
    name: Waypoint web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/waypoint/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/waypoint/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  corpus:
    name: Corpus seed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/corpus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python -m compileall -q src
      - run: uv run ledgerfield generate-waypoint-seed
      - run: uv run python -m json.tool data/waypoint/waypoint-seed.json > /dev/null
      - run: git diff --exit-code -- data/waypoint/waypoint-seed.json

  agents-static:
    name: Agent static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q modules/agents/agents modules/agents/scripts modules/agents/evals
      - run: python -m compileall -q apps/waypoint/integrations/agents

  evals:
    name: Evaluation tooling
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run caliber telemetry backfill-plan --json
      - run: uv run ruff check .

  deploy-tooling:
    name: Deploy tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n tools/deploy/scripts/*.sh
      - run: python -m compileall -q tools/deploy/scripts
      - run: python -m json.tool tools/deploy/deployment.manifest.json > /dev/null
      - run: python -m unittest discover -s tools/deploy/tests -v

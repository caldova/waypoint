name: Agent quality operations

run-name: ${{ inputs.operation }} · ${{ inputs.agent }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Controlled agent quality operation to run.
        required: true
        type: choice
        options:
          - invoice-run
          - trace-export
          - eval-run
          - quality-status
          - optimizer-start
          - rft-prepare
          - rft-submit
      agent:
        description: Hosted agent or quality target.
        required: true
        type: string
        default: contract-policy-expert
      invoice_id:
        description: Required only for invoice-run.
        required: false
        type: string
        default: ''
      trace_id:
        description: Required only for trace-export.
        required: false
        type: string
        default: ''
      trace_lookback_days:
        description: Trace query window (1-30 days).
        required: true
        type: string
        default: '7'
      log_analytics_workspace_id:
        description: Workspace customer ID; falls back to the LOG_ANALYTICS_WORKSPACE_ID variable.
        required: false
        type: string
        default: ''
      project_endpoint:
        description: Foundry project endpoint; falls back to the AZURE_AI_PROJECT_ENDPOINT variable.
        required: false
        type: string
        default: ''
      azd_env_name:
        description: Existing azd environment context for Foundry CLI commands.
        required: true
        type: string
        default: waypoint-agents
      eval_config:
        description: Repository-relative reviewed Foundry eval config.
        required: true
        type: string
        default: modules/agents/agents/contract-policy-expert/eval.yaml
      eval_name:
        description: Name for a new no-wait eval run.
        required: true
        type: string
        default: contract-policy-evidence-compliance-operations
      eval_model:
        description: Existing evaluator model deployment.
        required: true
        type: string
        default: gpt-5.5
      optimization_model:
        description: Existing Agent Optimizer model deployment.
        required: true
        type: string
        default: gpt-5.5
      train_dataset:
        description: Repository-relative reviewed RFT training dataset.
        required: true
        type: string
        default: modules/evals/datasets/contract-policy-expert/contract-policy-expert-train.jsonl
      validation_dataset:
        description: Repository-relative reviewed RFT validation dataset.
        required: true
        type: string
        default: modules/evals/datasets/contract-policy-expert/contract-policy-expert-validation.jsonl
      grader:
        description: Repository-relative reviewed Python reward grader.
        required: true
        type: string
        default: modules/evals/graders/contract-policy-expert/contract_policy_evidence_grader.py
      rft_base_model:
        description: Supported RFT base model deployment.
        required: true
        type: string
        default: o4-mini-2025-04-16
      optimizer_job_id:
        description: Required lineage for RFT preparation.
        required: false
        type: string
        default: ''
      optimizer_candidate_id:
        description: Required accepted quality target for RFT preparation.
        required: false
        type: string
        default: ''
      spend_confirmation:
        description: Live RFT spend acknowledgement; used only by rft-submit.
        required: true
        type: choice
        default: 'NO'
        options:
          - 'NO'
          - I_ACKNOWLEDGE_LIVE_RFT_SPEND

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-quality-operations-${{ inputs.operation }}-${{ inputs.agent }}
  cancel-in-progress: false

jobs:
  operate:
    name: ${{ inputs.operation }}
    if: inputs.operation != 'rft-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZD_ENV_NAME: ${{ inputs.azd_env_name }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Validate inputs
        env:
          AGENT: ${{ inputs.agent }}
          EVAL_CONFIG: ${{ inputs.eval_config }}
          EVAL_NAME: ${{ inputs.eval_name }}
          GRADER: ${{ inputs.grader }}
          INVOICE_ID: ${{ inputs.invoice_id }}
          LOOKBACK_DAYS: ${{ inputs.trace_lookback_days }}
          OPERATION: ${{ inputs.operation }}
          OPTIMIZATION_MODEL: ${{ inputs.optimization_model }}
          OPTIMIZER_CANDIDATE_ID: ${{ inputs.optimizer_candidate_id }}
          OPTIMIZER_JOB_ID: ${{ inputs.optimizer_job_id }}
          RFT_BASE_MODEL: ${{ inputs.rft_base_model }}
          TRACE_ID: ${{ inputs.trace_id }}
          TRAIN_DATASET: ${{ inputs.train_dataset }}
          VALIDATION_DATASET: ${{ inputs.validation_dataset }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 2
          }
          safe_name='^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
          [[ "$AGENT" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || fail "agent has an invalid format"
          [[ "$EVAL_NAME" =~ $safe_name ]] || fail "eval_name has an invalid format"
          [[ "$OPTIMIZATION_MODEL" =~ $safe_name ]] || fail "optimization_model has an invalid format"
          [[ "$RFT_BASE_MODEL" =~ $safe_name ]] || fail "rft_base_model has an invalid format"
          [[ "$LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || fail "trace_lookback_days must be numeric"
          (( LOOKBACK_DAYS >= 1 && LOOKBACK_DAYS <= 30 )) || fail "trace_lookback_days must be 1-30"

          if [ "$OPERATION" = "invoice-run" ]; then
            [[ "$INVOICE_ID" =~ $safe_name ]] || fail "invoice_id is required and has an invalid format"
          fi
          if [ "$OPERATION" = "trace-export" ]; then
            [[ "$TRACE_ID" =~ $safe_name ]] || fail "trace_id is required and has an invalid format"
          fi
          if [ "$OPERATION" = "rft-prepare" ]; then
            [[ "$OPTIMIZER_JOB_ID" =~ $safe_name ]] ||
              fail "optimizer_job_id is required for rft-prepare"
            [[ "$OPTIMIZER_CANDIDATE_ID" =~ $safe_name ]] ||
              fail "optimizer_candidate_id is required for rft-prepare"
          fi

          for path in "$EVAL_CONFIG" "$TRAIN_DATASET" "$VALIDATION_DATASET" "$GRADER"; do
            case "$path" in
              /*|*..*) fail "paths must be repository-relative and may not contain '..': $path" ;;
            esac
          done

          if [ "$OPERATION" = "eval-run" ] || [ "$OPERATION" = "optimizer-start" ] ||
             [ "$OPERATION" = "quality-status" ]; then
            [ -f "$EVAL_CONFIG" ] || fail "eval config does not exist: $EVAL_CONFIG"
          fi
          if [ "$OPERATION" = "quality-status" ] || [ "$OPERATION" = "rft-prepare" ]; then
            [ -f "$TRAIN_DATASET" ] || fail "training dataset does not exist: $TRAIN_DATASET"
            [ -f "$VALIDATION_DATASET" ] || fail "validation dataset does not exist: $VALIDATION_DATASET"
            [ -f "$GRADER" ] || fail "grader does not exist: $GRADER"
          fi

      - name: Initialize sanitized evidence
        run: |
          mkdir -p artifacts
          jq -n \
            --arg operation "${{ inputs.operation }}" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:"1.0",operation:$operation,status:"validated",source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},raw_payload_uploaded:false}' \
            > artifacts/operation.json

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Set up uv
        if: >-
          inputs.operation == 'quality-status' ||
          inputs.operation == 'optimizer-start' ||
          inputs.operation == 'rft-prepare'
        uses: astral-sh/setup-uv@v6

      - name: Install Azure Developer CLI
        if: inputs.operation == 'eval-run' || inputs.operation == 'optimizer-start'
        uses: Azure/setup-azd@v2.3.0

      - name: Install azd AI Agents extension
        if: inputs.operation == 'eval-run' || inputs.operation == 'optimizer-start'
        run: azd ext install azure.ai.agents

      - name: Azure login
        if: >-
          inputs.operation == 'invoice-run' ||
          inputs.operation == 'trace-export' ||
          inputs.operation == 'eval-run' ||
          inputs.operation == 'optimizer-start'
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Foundry context
        if: >-
          inputs.operation == 'invoice-run' ||
          inputs.operation == 'eval-run' ||
          inputs.operation == 'optimizer-start'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          INPUT_PROJECT_ENDPOINT: ${{ inputs.project_endpoint }}
          PROJECT_ENDPOINT_FROM_VARS: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          set -euo pipefail
          endpoint="${INPUT_PROJECT_ENDPOINT:-$PROJECT_ENDPOINT_FROM_VARS}"
          if [ -z "$endpoint" ]; then
            echo "::error::project_endpoint or AZURE_AI_PROJECT_ENDPOINT is required"
            exit 2
          fi
          case "$endpoint" in
            https://*.services.ai.azure.com/api/projects/*) ;;
            *) echo "::error::Foundry project endpoint has an invalid format"; exit 2 ;;
          esac
          echo "::add-mask::$endpoint"
          echo "PROJECT_ENDPOINT=$endpoint" >> "$GITHUB_ENV"

          if [ "${{ inputs.operation }}" = "eval-run" ] ||
             [ "${{ inputs.operation }}" = "optimizer-start" ]; then
            azd config set auth.useAzCliAuth true
            azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
            azd env select "$AZD_ENV_NAME" || azd env new "$AZD_ENV_NAME" \
              --location "$AZURE_LOCATION" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --no-prompt
            azd env set AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
            azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
            azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
            azd env set AZURE_AI_PROJECT_ENDPOINT "$endpoint"
            azd env set FOUNDRY_PROJECT_ENDPOINT "$endpoint"
          fi

      - name: Run invoice assurance
        if: inputs.operation == 'invoice-run'
        env:
          INVOICE_ID: ${{ inputs.invoice_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pip install --disable-pip-version-check --quiet azure-identity requests
          set +e
          python modules/agents/scripts/drive_hosted_agent.py assurance-orchestrator \
            --project-endpoint "$PROJECT_ENDPOINT" \
            --input "Run the full invoice-assurance review for invoice $INVOICE_ID" \
            --poll-timeout 600 \
            --poll-interval 5 \
            --json > "$RUNNER_TEMP/invoice-run.json"
          exit_code=$?
          set -e
          status="$(jq -r '.status // "command_failed"' "$RUNNER_TEMP/invoice-run.json" 2>/dev/null || echo command_failed)"
          response_id="$(jq -r '.id // .response_id // empty' "$RUNNER_TEMP/invoice-run.json" 2>/dev/null || true)"
          jq -n \
            --arg operation invoice-run \
            --arg status "$status" \
            --arg response_id "$response_id" \
            --arg agent assurance-orchestrator \
            --arg invoice_id "$INVOICE_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:"1.0",operation:$operation,status:$status,lineage:{agent:$agent,invoice_id:$invoice_id,response_id:$response_id},source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},bounded:true,raw_payload_uploaded:false}' \
            > artifacts/operation.json
          exit "$exit_code"

      - name: Export sanitized trace metadata
        if: inputs.operation == 'trace-export'
        env:
          INPUT_WORKSPACE_ID: ${{ inputs.log_analytics_workspace_id }}
          LOOKBACK_DAYS: ${{ inputs.trace_lookback_days }}
          TRACE_ID: ${{ inputs.trace_id }}
          WORKSPACE_ID_FROM_VARS: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          workspace="${INPUT_WORKSPACE_ID:-$WORKSPACE_ID_FROM_VARS}"
          if [[ ! "$workspace" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::log_analytics_workspace_id or LOG_ANALYTICS_WORKSPACE_ID must be a workspace customer ID"
            exit 2
          fi
          kql="union isfuzzy=true withsource=SourceTable AppRequests, AppDependencies, AppTraces, AppExceptions, AppEvents | where TimeGenerated > ago(${LOOKBACK_DAYS}d) | where OperationId == '${TRACE_ID}' or ParentId == '${TRACE_ID}' or Id == '${TRACE_ID}' | project TimeGenerated, SourceTable, AppRoleName, OperationId, ParentId, Id, Name, Success, ResultCode, DurationMs | order by TimeGenerated asc"
          az monitor log-analytics query \
            --workspace "$workspace" \
            --analytics-query "$kql" \
            --output json > "$RUNNER_TEMP/trace-export.json"
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg trace_id "$TRACE_ID" \
            '
            def normalized_rows:
              if type == "array" then
                .[]
              elif ((.tables? // null) | type) == "array" then
                .tables[] |
                .columns as $columns |
                .rows[] as $row |
                reduce range(0; $columns | length) as $index
                  ({}; .[$columns[$index].name] = $row[$index])
              else
                empty
              end;
            {
              schema_version:"1.0",
              operation:"trace-export",
              status:"completed",
              trace_id:$trace_id,
              rows:[normalized_rows | {TimeGenerated,SourceTable,AppRoleName,OperationId,ParentId,Id,Name,Success,ResultCode,DurationMs}],
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
              bounded:true,
              content_fields_exported:false
            }' "$RUNNER_TEMP/trace-export.json" > artifacts/operation.json

      - name: Start Foundry evaluation
        if: inputs.operation == 'eval-run'
        env:
          EVAL_CONFIG: ${{ inputs.eval_config }}
          EVAL_NAME: ${{ inputs.eval_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          config="$GITHUB_WORKSPACE/$EVAL_CONFIG"
          set +e
          azd ai agent eval run \
            -C "$GITHUB_WORKSPACE/modules/agents" \
            --config "$config" \
            --name "$EVAL_NAME" \
            -e "$AZD_ENV_NAME" \
            --no-wait \
            --no-prompt \
            --output json > "$RUNNER_TEMP/eval-run.json"
          exit_code=$?
          set -e
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg name "$EVAL_NAME" \
            --argjson exit_code "$exit_code" \
            '{
              schema_version:"1.0",
              operation:"eval-run",
              status:(.status // .properties.status // (if $exit_code == 0 then "submitted" else "command_failed" end)),
              lineage:{name:$name,evaluation_id:(.eval_id // .evaluationId // .id // null),run_id:(.run_id // .runId // .eval_run_id // null)},
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
              no_wait:true,
              raw_payload_uploaded:false
            }' "$RUNNER_TEMP/eval-run.json" > artifacts/operation.json 2>/dev/null || \
            jq -n --argjson exit_code "$exit_code" '{schema_version:"1.0",operation:"eval-run",status:"command_failed",exit_code:$exit_code,no_wait:true,raw_payload_uploaded:false}' > artifacts/operation.json
          exit "$exit_code"

      - name: Report quality readiness
        if: inputs.operation == 'quality-status'
        env:
          EVAL_CONFIG: ${{ inputs.eval_config }}
          GRADER: ${{ inputs.grader }}
          INPUT_PROJECT_ENDPOINT: ${{ inputs.project_endpoint }}
          PROJECT_ENDPOINT_FROM_VARS: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          TRAIN_DATASET: ${{ inputs.train_dataset }}
          VALIDATION_DATASET: ${{ inputs.validation_dataset }}
        working-directory: modules/evals
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          uv sync --frozen
          uv run caliber doctor --json > "$RUNNER_TEMP/doctor.json"
          uv run caliber manifest --json > "$RUNNER_TEMP/manifest.json"
          uv run caliber optimizer plan \
            --forge-path "$GITHUB_WORKSPACE/modules/agents" \
            --agent "${{ inputs.agent }}" \
            --eval-config "$GITHUB_WORKSPACE/$EVAL_CONFIG" \
            --json > "$RUNNER_TEMP/optimizer-plan.json"
          endpoint="${INPUT_PROJECT_ENDPOINT:-$PROJECT_ENDPOINT_FROM_VARS}"
          rft_endpoint_args=()
          if [ -n "$endpoint" ]; then
            rft_endpoint_args=(--project-endpoint "$endpoint")
          fi
          uv run caliber rft plan \
            --train "$GITHUB_WORKSPACE/$TRAIN_DATASET" \
            --validation "$GITHUB_WORKSPACE/$VALIDATION_DATASET" \
            --grader "$GITHUB_WORKSPACE/$GRADER" \
            --base-model "${{ inputs.rft_base_model }}" \
            "${rft_endpoint_args[@]}" \
            --json > "$RUNNER_TEMP/rft-plan.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --slurpfile optimizer "$RUNNER_TEMP/optimizer-plan.json" \
            --slurpfile rft "$RUNNER_TEMP/rft-plan.json" \
            '{
              schema_version:"1.0",
              operation:"quality-status",
              status:"completed",
              readiness:{
                invoice_run:{available:true,command:"modules/agents/scripts/drive_hosted_agent.py"},
                trace_export:{available:true,command:"az monitor log-analytics query"},
                eval_run:{available:true,command:"azd ai agent eval run"},
                optimizer_start:{available:($optimizer[0].routes.agent_optimizer.ready // false),checks:($optimizer[0].checks // [])},
                rft_prepare:{available:true,ready_to_submit:($rft[0].ready_to_submit // false)},
                rft_submit:{available:false,reason:"No first-class caliber rft submit command or committed submission script exists."}
              },
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
              raw_payload_uploaded:false
            }' > "$GITHUB_WORKSPACE/artifacts/operation.json"

      - name: Start Agent Optimizer
        if: inputs.operation == 'optimizer-start'
        env:
          AGENT: ${{ inputs.agent }}
          EVAL_CONFIG: ${{ inputs.eval_config }}
          EVAL_MODEL: ${{ inputs.eval_model }}
          OPTIMIZATION_MODEL: ${{ inputs.optimization_model }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          config="$GITHUB_WORKSPACE/$EVAL_CONFIG"
          cd "$GITHUB_WORKSPACE/modules/evals"
          uv sync --frozen
          uv run caliber optimizer plan \
            --forge-path "$GITHUB_WORKSPACE/modules/agents" \
            --agent "$AGENT" \
            --eval-config "$config" \
            --json > "$RUNNER_TEMP/optimizer-plan.json"
          if [ "$(jq -r '.routes.agent_optimizer.ready // false' "$RUNNER_TEMP/optimizer-plan.json")" != "true" ]; then
            jq \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg commit "$GITHUB_SHA" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg agent "$AGENT" \
              '{
                schema_version:"1.0",
                operation:"optimizer-start",
                status:"blocked",
                lineage:{agent:$agent},
                checks,
                source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
                no_wait:true,
                apply:false,
                deploy:false,
                raw_payload_uploaded:false
              }' "$RUNNER_TEMP/optimizer-plan.json" > "$GITHUB_WORKSPACE/artifacts/operation.json"
            echo "::error::Agent Optimizer readiness checks did not pass"
            exit 2
          fi
          cd "$GITHUB_WORKSPACE"
          set +e
          azd ai agent optimize \
            -C "$GITHUB_WORKSPACE/modules/agents" \
            --agent "$AGENT" \
            --project-endpoint "$PROJECT_ENDPOINT" \
            --config "$config" \
            --eval-model "$EVAL_MODEL" \
            --optimize-model "$OPTIMIZATION_MODEL" \
            --target instruction \
            --no-wait \
            --no-prompt \
            --output json > "$RUNNER_TEMP/optimizer-start.json"
          exit_code=$?
          set -e
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg agent "$AGENT" \
            --argjson exit_code "$exit_code" \
            '{
              schema_version:"1.0",
              operation:"optimizer-start",
              status:(.status // .properties.status // (if $exit_code == 0 then "submitted" else "command_failed" end)),
              lineage:{agent:$agent,optimizer_job_id:(.operation_id // .operationId // .job_id // .id // null)},
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
              no_wait:true,
              apply:false,
              deploy:false,
              raw_payload_uploaded:false
            }' "$RUNNER_TEMP/optimizer-start.json" > artifacts/operation.json 2>/dev/null || \
            jq -n --argjson exit_code "$exit_code" '{schema_version:"1.0",operation:"optimizer-start",status:"command_failed",exit_code:$exit_code,no_wait:true,apply:false,deploy:false,raw_payload_uploaded:false}' > artifacts/operation.json
          exit "$exit_code"

      - name: Prepare RFT package
        if: inputs.operation == 'rft-prepare'
        env:
          GRADER: ${{ inputs.grader }}
          INPUT_PROJECT_ENDPOINT: ${{ inputs.project_endpoint }}
          OPTIMIZER_CANDIDATE_ID: ${{ inputs.optimizer_candidate_id }}
          OPTIMIZER_JOB_ID: ${{ inputs.optimizer_job_id }}
          TRAIN_DATASET: ${{ inputs.train_dataset }}
          VALIDATION_DATASET: ${{ inputs.validation_dataset }}
        working-directory: modules/evals
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          uv sync --frozen
          rft_endpoint_args=()
          if [ -n "$INPUT_PROJECT_ENDPOINT" ]; then
            rft_endpoint_args=(--project-endpoint "$INPUT_PROJECT_ENDPOINT")
          fi
          uv run caliber rft plan \
            --train "$GITHUB_WORKSPACE/$TRAIN_DATASET" \
            --validation "$GITHUB_WORKSPACE/$VALIDATION_DATASET" \
            --grader "$GITHUB_WORKSPACE/$GRADER" \
            --base-model "${{ inputs.rft_base_model }}" \
            "${rft_endpoint_args[@]}" \
            --json > "$RUNNER_TEMP/rft-plan.json"
          optimizer_args=()
          if [ -n "$OPTIMIZER_JOB_ID" ]; then
            optimizer_args+=(--optimizer-job-id "$OPTIMIZER_JOB_ID")
          fi
          if [ -n "$OPTIMIZER_CANDIDATE_ID" ]; then
            optimizer_args+=(--optimizer-candidate-id "$OPTIMIZER_CANDIDATE_ID")
          fi
          uv run caliber rft package \
            --train "$GITHUB_WORKSPACE/$TRAIN_DATASET" \
            --validation "$GITHUB_WORKSPACE/$VALIDATION_DATASET" \
            --grader "$GITHUB_WORKSPACE/$GRADER" \
            --agent "${{ inputs.agent }}" \
            --base-model "${{ inputs.rft_base_model }}" \
            --suffix "${{ inputs.agent }}-cost" \
            --out-dir "$RUNNER_TEMP/rft-package" \
            "${optimizer_args[@]}" \
            --json > "$RUNNER_TEMP/rft-package.json"
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{
              schema_version:"1.0",
              operation:"rft-prepare",
              status:"completed",
              agent,
              base_model,
              goal,
              ready_for_live_submit,
              blocked_until,
              optimizer_job_id,
              optimizer_candidate_id,
              checks,
              artifacts:{
                train_rows:.artifacts.train.rows,
                validation_rows:.artifacts.validation.rows,
                grader_bytes:.artifacts.grader.bytes,
                raw_training_rows_uploaded:false,
                grader_source_uploaded:false
              },
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},
              submit:false,
              deploy:false
            }' "$RUNNER_TEMP/rft-package.json" > "$GITHUB_WORKSPACE/artifacts/operation.json"

      - name: Publish operation summary
        if: always()
        run: |
          if [ -f artifacts/operation.json ]; then
            {
              echo "## Agent quality operation"
              echo
              echo '```json'
              jq . artifacts/operation.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Agent quality operation failed before sanitized evidence was produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized evidence
        if: always() && hashFiles('artifacts/operation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-operation-${{ inputs.operation }}-${{ github.run_id }}
          path: artifacts/operation.json
          if-no-files-found: error
          retention-days: 30

  rft-submit:
    name: Protected RFT submission gate
    if: inputs.operation == 'rft-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: quality-rft-submit
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Initialize sanitized evidence
        run: |
          mkdir -p artifacts
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:"1.0",operation:"rft-submit",status:"awaiting_controls",source:{repository:$repository,commit:$commit,workflow_run_id:$run_id},raw_payload_uploaded:false}' \
            > artifacts/operation.json

      - name: Verify explicit spend confirmation
        env:
          SPEND_CONFIRMATION: ${{ inputs.spend_confirmation }}
        run: |
          if [ "$SPEND_CONFIRMATION" != "I_ACKNOWLEDGE_LIVE_RFT_SPEND" ]; then
            echo "::error::rft-submit requires I_ACKNOWLEDGE_LIVE_RFT_SPEND"
            exit 2
          fi

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Report submission readiness
        working-directory: modules/evals
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          uv sync --frozen
          if uv run caliber rft --help | grep -q 'submit'; then
            reason="A submit command exists but this workflow has not been reviewed to invoke it."
          else
            reason="Blocked: no first-class caliber rft submit command or committed submission script exists."
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg reason "$reason" \
            '{
              schema_version:"1.0",
              operation:"rft-submit",
              status:"blocked",
              reason:$reason,
              controls:{
                protected_environment:"quality-rft-submit",
                spend_confirmed:true,
                submit:false,
                promote:false,
                deploy:false
              },
              source:{repository:$repository,commit:$commit,workflow_run_id:$run_id}
            }' > "$GITHUB_WORKSPACE/artifacts/operation.json"
          {
            echo "## RFT submission blocked"
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$reason"
          exit 1

      - name: Upload sanitized evidence
        if: always() && hashFiles('artifacts/operation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-quality-operation-rft-submit-${{ github.run_id }}
          path: artifacts/operation.json
          if-no-files-found: error
          retention-days: 30

name: Seed demo integrations

# Adds an Oracle ERP (Oracle Database@Azure) evidence lane to the latest decision of a few demo
# invoices so the agent map's Integrations bubble and the invoice panel show a third-party source.
# Idempotent; seeded lanes are marked and can be removed with `remove`. Defaults to a dry run.
# See apps/waypoint/api/app/demo_integrations.py.
#
# Uses the `caldova` GitHub Environment (same values as deploy-app.yml).

on:
  workflow_dispatch:
    inputs:
      invoices:
        description: Space-separated invoice ids. Leave empty for the curated demo set.
        type: string
        default: ""
      remove:
        description: Remove the seeded lanes instead of adding them.
        type: boolean
        default: false
      dry_run:
        description: Show what would change without writing anything.
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: demo-data
  cancel-in-progress: false

jobs:
  seed:
    name: Seed demo integrations
    runs-on: ubuntu-latest
    environment: caldova
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PG: ${{ vars.WAYPOINT_POSTGRES_SERVER_NAME }}
      FIREWALL_RULE: gha-integrations-${{ github.run_id }}
    defaults:
      run:
        working-directory: apps/waypoint/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The Caldova subscription auto-stops PostgreSQL after hours.
      - name: Ensure PostgreSQL is running
        run: |
          set -euo pipefail
          state="$(az postgres flexible-server show -g "$RG" -n "$PG" --query state -o tsv)"
          echo "PostgreSQL ${PG} state: ${state}"
          if [ "$state" = "Stopped" ]; then
            az postgres flexible-server start -g "$RG" -n "$PG" -o none
          fi

      - name: Allow this runner through the PostgreSQL firewall
        run: |
          set -euo pipefail
          ip="$(curl -fsS https://api.ipify.org)"
          az postgres flexible-server firewall-rule create -g "$RG" -n "$PG" \
            --rule-name "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip" -o none

      - name: Seed integration evidence
        env:
          APP_DATABASE_CONNECTION: >-
            Host=${{ vars.WAYPOINT_POSTGRES_SERVER_NAME }}.postgres.database.azure.com;Port=5432;Database=waypoint;Username=waypoint_app;Password=${{ secrets.POSTGRES_APP_PASSWORD }};SSL Mode=require
          INVOICES: ${{ inputs.invoices }}
          REMOVE: ${{ inputs.remove }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev -q
          args=()
          for invoice in $INVOICES; do
            [[ "$invoice" =~ ^[A-Za-z0-9-]+$ ]] || { echo "Invalid invoice id: $invoice" >&2; exit 1; }
            args+=(--invoice "$invoice")
          done
          [ "$REMOVE" = "true" ] && args+=(--remove)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          uv run --no-dev python -m app.demo_integrations "${args[@]}" | tee summary.json
          {
            echo "### Demo integrations $([ "$DRY_RUN" = "true" ] && echo '(dry run)')"
            echo '```json'
            cat summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the runner firewall rule
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete -g "$RG" -n "$PG" \
            --rule-name "$FIREWALL_RULE" --yes -o none || true

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: ai-foundry-starter-basic

services:
  contract-expert:
    project: modules/agents/contract-expert
    host: azure.ai.agent
    language: python
    kind: hosted
    name: contract-expert
    description: Prompt-grounded Contract Expert demo agent serving Foundry Responses.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    protocols:
      - protocol: responses
        version: 2.0.0

  contract-policy-expert:
    project: modules/agents/contract-policy-expert
    host: azure.ai.agent
    language: python
    kind: hosted
    name: contract-policy-expert
    description: FoundryIQ-only Contract Policy Expert serving Responses and Teams activity.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_NAME
        value: contract-toolbox
      - name: TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT
        value: ${TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT}
    protocols:
      - protocol: activity
        version: 2.0.0
      - protocol: responses
        version: 2.0.0

  contract-agent:
    project: modules/agents/contract-agent
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: contract-agent
    description: Full multi-IQ Caldova contract-agent (castia) speaking responses, activity, and invocations from one handler set.
    docker:
      remoteBuild: true
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: TOOLBOX_NAME
        value: contract-toolbox
      # Investigative toolbox lane (FoundryIQ contract/policy KB). Version-less
      # endpoint => always the published default version, so attaching a lane +
      # republishing needs no agent redeploy. Resolved by castia.
      - name: TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT
        value: ${TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT}
    protocols:
      - protocol: activity
        version: 2.0.0
      - protocol: responses
        version: 2.0.0
      - protocol: invocations
        version: 2.0.0

  contracts:
    project: modules/agents/contracts
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: contracts
    description: Teams-first contract intake and evidence autopilot stub for Waypoint.
    docker:
      remoteBuild: true
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      - name: WAYPOINT_API_BASE_URL
        value: ${WAYPOINT_API_BASE_URL}
      - name: WAYPOINT_API_SCOPE
        value: ${WAYPOINT_API_SCOPE}
      - name: CONTRACTS_INBOX_ADDRESS
        value: ${CONTRACTS_INBOX_ADDRESS}
    protocols:
      - protocol: activity
        version: 2.0.0
      - protocol: responses
        version: 2.0.0
      - protocol: invocations
        version: 2.0.0
infra:
  provider: bicep
  path: ./infra

requiredVersions:
  extensions:
    # the azd ai agent extension is required for this template
    "azure.ai.agents": ">=0.1.0-preview"
